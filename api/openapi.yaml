          in: query
          schema: { type: string }
      responses:
        '200':
          description: Property definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPropertyDefinition
      summary: Create property definition
      tags: [Metamodel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyDefinitionWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /metamodel/property-definitions/{id}:
    put:
      operationId: updatePropertyDefinition
      summary: Update property definition
      tags: [Metamodel]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyDefinitionWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deletePropertyDefinition
      summary: Delete property definition
      tags: [Metamodel]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '204':
          description: Deleted
        '409':
          description: Definition still has mappings or values
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /metamodel/property-definitions/{id}/enum-values:
    get:
      operationId: listEnumValues
      summary: Enum values of a property definition
      tags: [Metamodel]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Enum values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertyEnumValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEnumValue
      summary: Create enum value
      tags: [Metamodel]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:     { type: string }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyEnumValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

