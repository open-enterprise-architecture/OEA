  # ── Service accounts (ADR-026, REQ-155) ───────────────────────────────────
  /admin/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: All service accounts of the instance (person_type=service-account).
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"]}
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Service account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createServiceAccount
      summary: Create service account (REQ-155)
      description: |
        Creates a service account (`persons.person_type=service-account`)
        and returns `clientSecret` once in plaintext.
        Afterwards only retrievable via rotation.
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"], "conditions": [{"when": "request body sets or changes roles", "permissions": ["role:assign"]}]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountWrite' }
      responses:
        '201':
          description: Service account created; clientSecret returned once in the response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Invalid role or name already taken
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/service-accounts/{id}:
    get:
      operationId: getServiceAccount
      summary: Service account detail
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Service account (without clientSecret)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: updateServiceAccount
      summary: Update service account (name, description, roles)
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"], "conditions": [{"when": "request body sets or changes roles", "permissions": ["role:assign"]}]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteServiceAccount
      summary: Deactivate service account
      description: Soft deactivation (active=false). Credentials invalid.
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '204':
          description: Deactivated
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/service-accounts/{id}/credentials/rotate:
    post:
      operationId: rotateServiceAccountCredentials
      summary: Rotate service account credentials (REQ-155)
      description: |
        Generates a new `clientSecret`. The old secret is invalid immediately.
        The new secret is returned once in plaintext.
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["service-account:manage"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: New secret; old one immediately invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/settings:
    get:
      operationId: getSystemSettings
      summary: System settings (SCR-038)
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["settings:manage"]}
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateSystemSettings
      summary: Update system settings (SCR-038)
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["settings:manage"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/audit/retention:
    get:
      operationId: getAuditRetention
      summary: Audit retention in force and pending reduction (ADR-033 §4)
      description: |
        Readable by system administrators and auditors, so that a pending reduction is
        visible to auditors before it takes effect.
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["settings:manage", "audit:read"]}
      responses:
        '200':
          description: Retention
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRetention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: setAuditRetention
      summary: Set the audit retention (ADR-033 §4)
      description: |
        Appends a new value to the retention series (no record is changed). An increase
        takes effect immediately; a reduction takes effect 30 days after recording and
        is returned as `pending` until then. The database records the change as audit
        event `settings.audit-retention-changed`. The floor of 365 days is enforced in
        the database as well.
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "permissions": ["settings:manage"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditRetentionWrite' }
      responses:
        '200':
          description: Recorded; returns the value in force and a pending reduction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRetention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: "`retentionDays` below the floor of 365 days"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  ACCESS CONTROL (ADR-032, UC-23)                                       ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /admin/permissions:
    get:
      operationId: listPermissions
      summary: Permission catalog (ADR-032 §3)
      description: Fixed, release-versioned catalog; identical to `x-oea-permissions`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["role:assign", "visibility:configure", "service-account:manage"]}
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/roles:
    get:
      operationId: listAuthorizationRoles
      summary: Authorization roles with their permissions (permission matrix, REQ-157 AC1)
      description: |
        Built-in and custom roles. Readable with `role:assign` and by principals that
        reference roles: `visibility:configure` (readRoles/writeRoles) and
        `service-account:manage` (service account roles).
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["role:assign", "visibility:configure", "service-account:manage"]}
      parameters:
        - name: assignableToServiceAccounts
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthorizationRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAuthorizationRole
      summary: Create custom role (UC-23 A5)
      description: Audited as `role.created`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationRoleCreate' }
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationRole' }
        '202':
          description: Accepted – change needs four-eyes approval (`privilegedAssignmentApproval`, Q18); the change takes effect after approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Role ID already taken
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Unknown permission, SoD-2 violation or admin-class role flagged as assignable to service accounts
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/roles/{roleId}:
    get:
      operationId: getAuthorizationRole
      summary: Authorization role detail
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["role:assign", "visibility:configure", "service-account:manage"]}
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateAuthorizationRole
      summary: Update custom role
      description: |
        Built-in roles are immutable (SoD-5) → `409`. Changing a role the caller holds
        → `403` (SoD-1). Removing permissions takes effect for all holders within 60 s.
        Audited as `role.changed`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationRoleWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationRole' }
        '202':
          description: Accepted – change needs four-eyes approval (`privilegedAssignmentApproval`, Q18); the change takes effect after approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Unknown permission, SoD-2 violation, admin-class permission added to a role assignable to (or assigned to) service accounts
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteAuthorizationRole
      summary: Delete custom role
      description: |
        Rejected with `409` for built-in roles and for roles still referenced by an active
        assignment, an IdP group mapping, property visibility or the override list.
        Audited as `role.deleted`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/persons/{personId}/role-assignments:
    get:
      operationId: listRoleAssignments
      summary: Local role assignments of a person or service account
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - $ref: '#/components/parameters/PersonIdParam'
        - name: status
          in: query
          schema:
            type: array
            items: { type: string, enum: [scheduled, active, expired, revoked] }
          style: form
          explode: false
          description: "Default: `scheduled,active`"
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRoleAssignment
      summary: Assign a role (UC-23 basic flow)
      description: |
        Creates a local assignment (audited as `role.assigned`, privileged roles with high
        severity; all administrators are notified of privileged assignments).
        - Target is the caller itself or the person linked to the caller's local system
          admin account → `403` (SoD-1)
        - Service account target and role not flagged `assignableToServiceAccounts` → `422` (SoD-4)
        - SoD-3 combination without `acknowledgeSodConflict: true` → `409`
        - Privileged role while `privilegedAssignmentApproval` is enabled → `202` with a
          pending request; the assignment is created only after approval (Q15)
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - $ref: '#/components/parameters/PersonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentWrite' }
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '202':
          description: Privileged role; four-eyes approval pending
          headers:
            Location:
              schema: { type: string }
              description: URL of the pending request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Unknown role, role not assignable to service accounts, or `validTo` before `validFrom`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/persons/{personId}/role-assignments/{assignmentId}/revoke:
    post:
      operationId: revokeRoleAssignment
      summary: Revoke a role assignment (UC-23 A3)
      description: |
        Sets `revokedAt`/`revokedBy` (no hard delete), revokes all sessions of the person
        (REQ-164) and is audited as `role.revoked`. Own assignment → `403` (SoD-1);
        last administration path to `system-admin` → `409` (SoD-7); already revoked or
        expired → `409`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - $ref: '#/components/parameters/PersonIdParam'
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentRevoke' }
      responses:
        '200':
          description: Assignment revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/approval-requests:
    get:
      operationId: listApprovalRequests
      summary: Four-eyes requests for privileged changes (Q15, Q18)
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, expired], default: pending }
        - name: kind
          in: query
          schema: { type: string, enum: [role-assignment, idp-group-mapping, role-permission] }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalRequest' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/approval-requests/{requestId}/approve:
    post:
      operationId: approveApprovalRequest
      summary: Approve a pending privileged change (four-eyes, Q15, Q18)
      description: |
        Applies the change: creates the role assignment, activates the IdP group mapping or
        adds the permission to the custom role; the approver is recorded. The approver
        must be neither the requester nor the assignee (also not via a linked local system
        admin account) → otherwise `403`. Request no longer pending, or the assignment is
        no longer valid (role or mapping deleted, target offboarded) → `409`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Approved; the request references the created assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/approval-requests/{requestId}/reject:
    post:
      operationId: rejectApprovalRequest
      summary: Reject (or, as requester, withdraw) a pending privileged change
      description: |
        The assignee cannot decide on their own request → `403` (SoD-1). Request no
        longer pending → `409`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/idp-group-mappings:
    get:
      operationId: listIdpGroupMappings
      summary: IdP group mappings (UC-23 A1)
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: authProviderId
          in: query
          schema: { type: string, format: uuid }
        - name: roleId
          in: query
          schema: { $ref: '#/components/schemas/RoleId' }
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IdpGroupMapping' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createIdpGroupMapping
      summary: Map an IdP group to a role
      description: Audited as `idp-mapping.created`; mappings to privileged roles with high severity.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdpGroupMappingWrite' }
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdpGroupMapping' }
        '202':
          description: Accepted – change needs four-eyes approval (`privilegedAssignmentApproval`, Q18); the change takes effect after approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Mapping for this provider, group and role already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Unknown provider or role, or group identifier not in the provider's immutable identifier format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/idp-group-mappings/{mappingId}:
    put:
      operationId: updateIdpGroupMapping
      summary: Change or deactivate an IdP group mapping
      description: |
        Audited as `idp-mapping.changed`. Deactivating or changing the last administration
        path to `system-admin` → `409` (SoD-7).
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdpGroupMappingWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdpGroupMapping' }
        '202':
          description: Accepted – change needs four-eyes approval (`privilegedAssignmentApproval`, Q18); the change takes effect after approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Unknown provider or role, or invalid group identifier format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteIdpGroupMapping
      summary: Delete an IdP group mapping
      description: |
        Audited as `idp-mapping.deleted`; effective for all affected sessions within 60 s.
        Last administration path to `system-admin` → `409` (SoD-7).
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["role:assign"]}
      parameters:
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/persons/{personId}/entity-link:
    put:
      operationId: setPersonEntityLink
      summary: Link a person account to its Person entity (REQ-127)
      description: |
        Sets or removes the account link used for connection-scoped visibility. Audited as
        `person.account-linked`. Own account (incl. via a linked local system admin
        account) → `403` (SoD-1); service account target → `422`; entity already linked
        to another account → `409`.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "permissions": ["person:manage"]}
      parameters:
        - $ref: '#/components/parameters/PersonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonEntityLink' }
      responses:
        '200':
          description: Link set or removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonEntityLinkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Entity is not of the person metatype, or the target is a service account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/access-review:
    get:
      operationId: getAccessReview
      summary: Access review (UC-23 A8)
      description: |
        All principals with their roles, the source of every role (local, IdP group,
        system admin account), validity, grantor, last login, SoD conflicts, privileged
        holdings and service accounts with expiring secrets. `text/csv` for the export
        used as audit evidence.
      tags: [Access Control]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["role:assign", "audit:read"]}
      parameters:
        - name: principalType
          in: query
          schema: { type: string, enum: [person, service-account, system-admin-account] }
        - name: roleId
          in: query
          schema: { $ref: '#/components/schemas/RoleId' }
        - name: source
          in: query
          schema: { type: string, enum: [local, idp, system-admin-account] }
        - name: privilegedOnly
          in: query
          schema: { type: boolean, default: false }
        - name: sodConflictsOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Access review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/property-visibility/override-roles:
    get:
      operationId: getPropertyVisibilityOverride
      summary: Property visibility override role list (REQ-128)
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["visibility:configure"]}
      responses:
        '200':
          description: Override role list (empty by default)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyVisibilityOverride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updatePropertyVisibilityOverride
      summary: Change the override role list (REQ-128, SoD-6)
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["visibility:configure"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyVisibilityOverride' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyVisibilityOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Unknown role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  AUDIT (Schema: audit.*, ADR-024, SCR-026/054)                        ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: Compliance audit log (SCR-054)
      description: |
        Reads from `audit.events` + `audit.event_changes` (ADR-024, ADR-033).
        Actor names are resolved at read time (`actorDisplayName`); restricted property
        values are decrypted only if the caller may read the property, otherwise the
        change is returned with `redacted: true` (REQ-160).
        Read-only: there is no operation that modifies or deletes audit records.
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "permissions": ["audit:read"]}
      parameters:
        - name: entityId
          in: query
          schema: { type: integer }
        - name: actorType
          in: query
          schema: { $ref: '#/components/schemas/AuditActorType' }
        - name: actorRef
          in: query
          schema: { type: string }
          description: Pseudonymous actor key (see `AuditEvent.actorRef`)
        - name: agentId
          in: query
          schema: { type: string, format: uuid }
          description: "`client_id` of a service account"
        - name: eventType
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string, enum: [change, security, access, system] }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, high, critical] }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: source
          in: query
          schema: { type: string, enum: [UI, API, Job, Import] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit/events/{id}/changes:
    get:
      operationId: getAuditEventChanges
      summary: Change detail of an audit event (SCR-027)
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "permissions": ["audit:read"]}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Change detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /audit/events/export:
    get:
      operationId: exportAuditEvents
      summary: SIEM export of the audit hash chain as JSON Lines (ADR-033 §9)
      description: |
        Returns chain links ordered by `chainSeq`, one `AuditExportRecord` per line,
        starting after `afterSeq`. Intended for incremental polling by a SIEM collector
        or a service account with the role `auditor`: the next request uses the value of
        the response header `OEA-Last-Chain-Seq` as `afterSeq`. Checkpoints
        (`audit.checkpoint`) are part of the stream.
        If links after `afterSeq` have been removed by the retention purge, the response
        starts at the first retained link; the gap is documented by the
        `audit.retention-purged` event.
        Contains no names, no e-mail addresses and no decrypted restricted values. Every
        export request is itself audited (`audit.exported`, REQ-175 AC4).
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "permissions": ["audit:read"]}
      parameters:
        - name: afterSeq
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
          description: Cursor; only links with `chainSeq` greater than this value are returned
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
          description: Maximum number of lines
      responses:
        '200':
          description: JSON Lines stream (UTF-8, one JSON object per line, `\n` separated)
          headers:
            OEA-Last-Chain-Seq:
              description: "`chainSeq` of the last line returned; equals `afterSeq` if no line was returned"
              schema: { type: integer, format: int64 }
            OEA-Has-More:
              description: "`true` if further links exist after the last line returned"
              schema: { type: boolean }
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/jsonl:
              schema:
                type: string
                description: Each line is one JSON object that validates against `AuditExportRecord`
                contentMediaType: application/json
                contentSchema: { $ref: '#/components/schemas/AuditExportRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /audit/integrity:
    get:
      operationId: getAuditIntegrity
      summary: Last audit chain verification result and latest checkpoint (ADR-033 §5)
      description: |
        Returns the result of the latest scheduled verification of the hash chain
        (incremental, daily) and the latest checkpoint. Does not trigger a verification;
        full verification runs with the command `oea audit verify`.
      tags: [Audit]
      x-oea-authorization: {"access": "permission", "permissions": ["audit:read"]}
      responses:
        '200':
          description: Integrity status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrityStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  ANALYTICS (ADR-034, REQ-179)                                          ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /analytics/query:
    post:
      operationId: runAnalyticsQuery
      summary: Run a raw SQL analytics query on the reporting schema (ADR-034)
      description: |
        Executes one read-only `SELECT` statement against the views of the schema
        `reporting` under the database role `oea_analytics`. Restricted property values
        are masked for the caller in the views (REQ-160). Synchronous only; no saved
        queries, no file export in v1. Disabled by default (`analytics.enabled`).
        Every authenticated request is audited (`analytics.query.executed` or
        `analytics.query.rejected`); the result is not returned if the audit write
        fails. Missing permission is audited as `authz.denied`.
        Limits (instance settings, request values can only lower them): statement
        timeout 30 s, 10,000 rows, 10 MB result, 200 columns, 2 concurrent queries and
        30 queries per minute per principal.
      tags: [Analytics]
      x-oea-authorization: {"access": "permission", "permissions": ["analytics:query"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQueryRequest' }
      responses:
        '200':
          description: Result (possibly truncated, see `truncated`)
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsQueryResult' }
        '400':
          description: Malformed body, unsupported `language` or SQL parse error (with position)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AnalyticsProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Query text longer than 20,000 characters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AnalyticsProblem' }
        '422':
          description: Validation rule violated (V1–V7), statement timeout, execution error or too many result columns
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AnalyticsProblem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Raw analytics disabled on this instance (`analytics.enabled = false`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /analytics/schema:
    get:
      operationId: getAnalyticsSchema
      summary: Reporting views and columns for the caller (ADR-034 §3.1)
      tags: [Analytics]
      x-oea-authorization: {"access": "permission", "permissions": ["analytics:query"]}
      responses:
        '200':
          description: Reporting schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Raw analytics disabled on this instance (`analytics.enabled = false`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  EXTERNAL INTEGRATION – WRITING (ADR-026, optional)                    ║
  # ╚═════════════════════════════════════════════════════════════════════════╝

  /entities:
    post:
      operationId: createEntity
      summary: Create entity
      description: |
        Creates a new entity. For idempotent create-or-update
        (with a known `externalId`) please use `PUT /entities/by-external-id/{externalId}`.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`externalId` already taken"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/ValidationError' }

  /entities/{id}:
    put:
      operationId: replaceEntity
      summary: Replace entity (full update)
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: version
          in: query
          schema: { type: integer }
          description: Optimistic lock version; if missing → no conflict check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      operationId: patchEntity
      summary: Partially update entity
      description: |
        Only the supplied fields are changed.
        Missing fields remain unchanged.
        `properties` array: only supplied properties are updated.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: version
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteEntity
      summary: Soft-delete entity
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:delete"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '204':
          description: Soft-deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /entities/by-external-id/{externalId}:
    put:
      operationId: upsertEntityByExternalId
      summary: Create or update entity (upsert by externalId)
      description: |
        Idempotent create-or-update. Core endpoint for external systems (ADR-026).
        Returns `201 Created` on creation, `200 OK` on update.
        Repeated calls with identical data are safe.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"]}
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
          description: "Stable source identifier (URL-encoded, e.g. `git%3Aorg%2Frepo%2Fsvc`)"
        - $ref: '#/components/parameters/AgentIdHeader'
        - $ref: '#/components/parameters/AgentRunHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '201':
          description: Newly created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /entities/validate:
    post:
      operationId: validateEntity
      summary: Validate entity without persisting
      description: |
        Performs all validations (metatype check, mandatory properties,
        pattern checks, connection constraints) without persisting.
        Useful for external systems before the actual write.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /entities/batch:
    post:
      operationId: batchWriteEntities
      summary: Create/update entities and connections in batch
      description: |
        Writes up to 500 entities and 500 connections in one request.
        The preferred endpoint for external systems with `strategy: upsert`
        (ADR-026). `?dryRun=true` → validation without persisting.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"], "conditions": [{"when": "a connection of a type used as scopingConnectionType is written", "permissions": ["visibility-scope:assign"]}]}
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/AgentIdHeader'
        - $ref: '#/components/parameters/AgentRunHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchWriteRequest' }
      responses:
        '200':
          description: Batch result (also for partial errors if atomic=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchWriteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Entire batch invalid (e.g. empty body, atomic=true with error)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /connections:
    post:
      operationId: createConnection
      summary: Create connection between two entities
      description: |
        Creates a connection entity (metatype.is_connection=true).
        Validates against `metatype_connection_constraints`.
        Source/target can be referenced via internal ID or `externalId`.
      tags: [Entities – Write]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write"], "conditions": [{"when": "a connection of a type used as scopingConnectionType is written", "permissions": ["visibility-scope:assign"]}]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionWrite' }
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Source or target entity not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Connection constraint violated
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/ValidationError' }

  # ── Metamodel discovery (ADR-026) ─────────────────────────────────────────
  /metamodel/allowed-connections:
    get:
      operationId: getAllowedConnections
      summary: Allowed connections between two metatypes
      description: |
        Answers: "Which connection metatypes are allowed between metatype A and B?"
        Writing systems use this endpoint to validate connection writes
        in advance. Source: `metatype_connection_constraints`.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - name: sourceMetatypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: targetMetatypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Allowed connection metatypes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowedConnectionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Metamodel package import/export (ADR-026) ───────────────────────────────
  /admin/metamodel/export:
    get:
      operationId: exportMetamodelPackage
      summary: Export metamodel package (ADR-026)
      description: |
        Exports the complete metamodel as a portable JSON package:
        metatypes, property definitions, viewpoints, shape assignments, i18n labels.
        Serves as the basis for metamodel libraries and the upsert workflow
        of external systems (externalId namespace, metatype IDs).
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - name: configId
          in: query
          schema: { type: string, format: uuid }
          description: "Specific metamodel config; without parameter → instance-wide configuration"
        - name: includeI18n
          in: query
          schema: { type: boolean, default: true }
          description: "Include i18n bundles in the package"
      responses:
        '200':
          description: Metamodel package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetamodelPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/metamodel/import:
    post:
      operationId: importMetamodelPackage
      summary: Import metamodel package (ADR-026)
      description: |
        Imports a metamodel package (e.g. ArchiMate 3.2 base metamodel).
        `merge`: adds missing metatypes/properties, updates existing ones.
        `replace`: replaces the metamodel completely (only if no entities
        of the old metamodel exist).
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MetamodelPackage'
                - type: object
                  properties:
                    strategy:
                      type: string
                      enum: [merge, replace]
                      default: merge
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`replace` not possible (existing entities of the old metamodel)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Invalid package format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── Shape palette per viewpoint ─────────────────────────────────────────────
  /admin/viewpoints/{id}/shape-palette:
    get:
      operationId: getShapePalette
      summary: Shape palette for a viewpoint (ADR-026)
      description: |
        Which shape/icon does which metatype get in this viewpoint?
        Writing systems and the diagram editor load this palette to
        display entities correctly without hard-coding shape knowledge.
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "viewpoint:manage"]}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Viewpoint key (slug)
      responses:
        '200':
          description: Shape palette
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShapeAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Viewpoint not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: updateShapePalette
      summary: Update shape palette
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["viewpoint:manage"]}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ShapeAssignment' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShapeAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  PORTAL (Read-only, SCR-050–054)                                       ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /portal/catalog:
    get:
      operationId: getPortalCatalogView
      summary: Portal catalog (SCR-050)
      description: |
        Read-only version of `/views/catalog` for portal users (`portal:read`, held
        by the built-in role `portal-reader` among others). Properties the caller may
        not read are redacted according to the property visibility configuration
        (REQ-124, REQ-160).
      tags: [Portal]
      x-oea-authorization: {"access": "permission", "permissions": ["portal:read"]}
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[metatypeId]
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: false
      responses:
        '200':
          description: Entity list (reduced properties)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntityListItem' }
                  page:          { $ref: '#/components/schemas/PageMeta' }
                  filterOptions: { $ref: '#/components/schemas/CatalogFilterOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/catalog/{id}:
    get:
      operationId: getPortalEntityDetail
      summary: Portal entity detail (SCR-051)
      description: Read-only. No edit button; properties according to the visibility configuration.
      tags: [Portal]
      x-oea-authorization: {"access": "permission", "permissions": ["portal:read"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
      responses:
        '200':
          description: Entity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/diagrams/{id}:
    get:
      operationId: getPortalDiagramView
      summary: Portal diagram viewer (SCR-052)
      description: Read-only. No editing; shapes cannot be selected or moved.
      tags: [Portal]
      x-oea-authorization: {"access": "permission", "permissions": ["portal:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Diagram
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/dashboards/{id}/data:
    get:
      operationId: getPortalDashboardData
      summary: Portal dashboard data (SCR-053)
      description: Read-only. No widget configuration; data points only.
      tags: [Portal]
      x-oea-authorization: {"access": "permission", "permissions": ["portal:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/audit/events:
    get:
      operationId: getPortalAuditEvents
      summary: Portal change history (SCR-054)
      description: |
        Read-only view of audit events for the portal. No restore button.
        Requires `audit:read` like `/audit/events`; property values the caller may not
        read are redacted (REQ-160).
      tags: [Portal]
      x-oea-authorization: {"access": "permission", "permissions": ["audit:read"]}
      parameters:
        - name: entityId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  SSE – invalidation channel (ADR-025)                                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /events/stream:
    get:
      operationId: getEventStream
      summary: Server-Sent Events — cache invalidation (ADR-025)
      description: |
        Persistent SSE connection for cache invalidation and session signals.
        Events:
        - `i18n_invalidated`, `metamodel_updated`: cache invalidation (ADR-025)
        - `access_changed`: the caller's effective roles or permissions changed (role
          assignment, IdP group re-evaluation, visibility configuration). The client
          re-reads `GET /me` and re-synchronizes its offline cache so that values the
          caller can no longer read do not survive (ADR-035 §8). If no effective role
          remains, `purgeLocalData: true` is set and the client deletes its offline
          cache and stored tokens.
        - `session_ended`: sent immediately before the server closes the stream because
          the session ended (logout, revocation within 60 s per REQ-164, refresh token
          reuse, idle timeout or absolute lifetime per REQ-165). The client deletes its
          offline cache and stored tokens for this server (ADR-035 §8, REQ-181 AC4);
          equivalent to `OEA-Purge-Local-Data: session-ended`.
        Clients must treat the header `OEA-Purge-Local-Data` on any response as the
        authoritative signal; the stream events are a fast path and may be missed
        (stream disabled or disconnected).
        Authenticated via the session cookie or the bearer header; tokens are never
        passed in the URL. Streams are closed when the session is revoked.
        Can be disabled via `oea.sse.enabled=false`.
      tags: [Events]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Each `data:` line is a JSON event; security-relevant event types are specified in `contentSchema`.
                contentMediaType: application/json
                contentSchema:
                  oneOf:
                    - $ref: '#/components/schemas/SessionEndedEvent'
                    - $ref: '#/components/schemas/AccessChangedEvent'
                example: |
                  data: {"type":"i18n_invalidated","locale":"de"}

                  data: {"type":"metamodel_updated"}

                  data: {"type":"access_changed","purgeLocalData":false}

                  data: {"type":"session_ended","reason":"revoked","purgeLocalData":true}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

