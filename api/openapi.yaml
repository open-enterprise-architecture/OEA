      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      responses:
        '200':
          description: Global setting of the instance metamodel configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReimportPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: updateReimportPolicy
      summary: Change the global re-import setting
      description: |
        Applies to every metatype whose own setting and those of its base types are `inherit`.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimportPolicy' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReimportPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

