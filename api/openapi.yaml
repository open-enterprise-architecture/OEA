# TAGS
# ═════════════════════════════════════════════════════════════════════════════
tags:
  - name: Catalogs
    description: Catalog definitions – create, list and read (UC-06, US-046) – and the catalog query (US-049)
  - name: Views – Navigation
    description: Explorer / navigation tree (SCR-010/011)
  - name: Views – Editors
    description: Diagram, lineage, dashboard and roadmap editors (SCR-021–025)
  - name: Entities
    description: Entity history and restore (UC-14/15/16)
  - name: Entities – Write
    description: |
      Write endpoints for entities and connections (ADR-026). Require the permission
      `entity:write` for persons and service accounts alike (`entity:delete` for
      deletion); connections of scoping types additionally require
      `visibility-scope:assign`. Properties the caller may not write are rejected
      (REQ-162). `?dryRun=true` available on batch and validate endpoints.
  - name: Metamodel
    description: Metatypes, property definitions and mappings (SCR-030)
  - name: Admin
    description: Administration screens (SCR-031–038)
  - name: Audit
    description: Compliance audit log, SIEM export, integrity status and retention (ADR-024, ADR-033, SCR-054)
  - name: Portal
    description: Web portal read-only endpoints (SCR-050–054)
  - name: I18N
    description: Dynamic labels with ETag caching (ADR-025)
  - name: Events
    description: Server-Sent Events for cache invalidation and session signals
  - name: Analytics
    description: Secured raw SQL analytics on the masked reporting schema (ADR-034, REQ-179)
  - name: Access Control
    description: Permission catalog, authorization roles, role assignments, four-eyes approval, IdP group mappings and access review (ADR-032, UC-23)
  - name: Identity
    description: Current principal and OAuth2 token endpoint for service accounts
  - name: Operations
    description: Health and operational endpoints (REQ-075)
  - name: Setup
    description: Local bootstrapping of a fresh instance (UC-02, US-013)
