  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  ENTITY HISTORY & RESTORE (UC-14/15/16, SCR-026/027)                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /entities/{id}/history:
    get:
      operationId: getEntityHistory
      summary: Change history of an entity (SCR-026)
      description: |
        Returns all versions with delta-based changes.
        Source: `entity_version_headers` + `entity_system_field_history`
        + `entity_property_value_history` (ADR-022).
      tags: [Entities]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      x-oea-status: planned
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Entity not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /entities/{id}/restore:
    post:
      operationId: restoreEntity
      summary: Restore entity (SCR-027, UC-15/16)
      description: |
        Restores an entity to an earlier version.
        Soft-deleted entities can also be restored.
        Properties the caller may not write are not restored and are reported
        (REQ-162).
      tags: [Entities]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write", "entity:restore"]}
      x-oea-status: planned
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Entity restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Entity or target version not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict (version outdated)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  METAMODEL (SCR-030)                                                   ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /metamodel/metatypes:
    get:
      operationId: listMetatypes
      summary: List all metatypes
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - name: configId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Metatype list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetatypeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createMetatype
      summary: Create new metatype
      description: |
        Creates a metatype with `scope=organization` in the instance configuration (US-032).
        `isConnection: true` is rejected with 422 until connection metatypes are supported.
        A name already used by any metatype, compared case-insensitively, gives 409 with
        problem type `urn:oea:problem:name-taken`.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypeWrite' }
      responses:
        '201':
          description: Metatype created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MetamodelConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metamodel/metatypes/{id}:
    get:
      operationId: getMetatype
      summary: Metatype detail
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Metatype
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: updateMetatype
      summary: Update metatype
      description: |
        Changes a metatype with `scope=organization`, including its base type; built-in and
        imported metatypes give 409 `read-only-metatype`. A changed base type removes the
        values of properties no longer inherited and marks entities that miss a newly
        inherited mandatory property.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypeWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/MetamodelConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteMetatype
      summary: Delete metatype
      description: |
        Only for `scope=organization`, and only while no entities of the metatype exist (also
        deleted ones), no catalog uses it as primary metatype and no metatype has it as base
        type (409 `in-use` with `count`, the number of entities).
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MetamodelConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metamodel/metatypes/{id}/property-mappings:
    get:
      operationId: listPropertyMappings
      summary: Property mappings of a metatype
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: |
            Mappings (current state, latest valid_from per property), including the mappings
            inherited from the base types (`inheritedFrom`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetatypePropertyMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createPropertyMapping
      summary: Create property mapping
      description: |
        Maps an organization property definition to any metatype, also an imported or built-in
        one. A property already mapped in the base type chain of the metatype or its subtypes
        gives 409 `urn:oea:problem:conflict`; a package definition gives 409
        `read-only-metatype`. A mandatory mapping marks every existing entity of the metatype
        and its subtypes without a value (`markedEntityCount`); such an entity is rejected
        when written again without the value. Changing the necessity by effective date
        follows (US-137).
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypePropertyMappingWrite' }
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypePropertyMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MetamodelConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metamodel/metatypes/{id}/property-mappings/{mappingId}:
    delete:
      operationId: deletePropertyMapping
      summary: Remove property mapping
      description: |
        Removes an organization mapping at any time; mappings of a package give 409
        `read-only-metatype`. The values of the property are deleted from the entities of the
        metatype and its subtypes; each affected entity gets a new version in its history.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MetamodelConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metamodel/metatypes/{id}/reimport-policy:
    put:
      operationId: updateMetatypeReimportPolicy
      summary: Set the re-import setting of a metatype
      description: |
        Whether a package re-import removes the organization mappings of this metatype:
        `inherit` takes the setting of the base type, at the top of the chain the global
        setting. Possible for every scope; a re-import never changes it.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypeReimportPolicy' }
      responses:
        '200':
          description: Metatype with the new setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metamodel/settings/reimport-policy:
    get:
      operationId: getReimportPolicy
