  # ── Service accounts (ADR-026, REQ-155) ───────────────────────────────────
  /admin/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: All service accounts of the instance (person_type=service-account).
      tags: [Admin]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Service account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createServiceAccount
      summary: Create service account (REQ-155)
      description: |
        Creates a service account (`persons.person_type=service-account`)
        and returns `clientSecret` once in plaintext.
        Afterwards only retrievable via rotation.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountWrite' }
      responses:
        '201':
          description: Service account created; clientSecret returned once in the response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountCreated' }
        '422':
          description: Invalid role or name already taken
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/service-accounts/{id}:
    get:
      operationId: getServiceAccount
      summary: Service account detail
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Service account (without clientSecret)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: updateServiceAccount
      summary: Update service account (name, description, roles)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteServiceAccount
      summary: Deactivate service account
      description: Soft deactivation (active=false). Credentials invalid.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '204':
          description: Deactivated
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/service-accounts/{id}/credentials/rotate:
    post:
      operationId: rotateServiceAccountCredentials
      summary: Rotate service account credentials (REQ-155)
      description: |
        Generates a new `clientSecret`. The old secret is invalid immediately.
        The new secret is returned once in plaintext.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: New secret; old one immediately invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountCreated' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/settings:
    get:
      operationId: getSystemSettings
      summary: System settings (SCR-038)
      tags: [Admin]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateSystemSettings
      summary: Update system settings (SCR-038)
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  AUDIT (Schema: audit.*, ADR-024, SCR-026/054)                        ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: Compliance audit log (SCR-054)
      description: |
        Reads from `audit.events` + `audit.event_changes` (ADR-024).
        Requires role `Auditor` or `Admin`.
      tags: [Audit]
      parameters:
        - name: entityId
          in: query
          schema: { type: integer }
        - name: actorId
          in: query
          schema: { type: integer }
        - name: eventType
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [UI, API, Job, Import] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: Insufficient permissions
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /audit/events/{id}/changes:
    get:
      operationId: getAuditEventChanges
      summary: Change detail of an audit event (SCR-027)
      tags: [Audit]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Change detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  EXTERNAL INTEGRATION – WRITING (ADR-026, optional)                    ║
  # ╚═════════════════════════════════════════════════════════════════════════╝

  /entities:
    post:
      operationId: createEntity
      summary: Create entity
      description: |
        Creates a new entity. For idempotent create-or-update
        (with a known `externalId`) please use `PUT /entities/by-external-id/{externalId}`.
      tags: [Entities – Write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '409':
          description: "`externalId` already taken"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/ValidationError' }

  /entities/{id}:
    put:
      operationId: replaceEntity
      summary: Replace entity (full update)
      tags: [Entities – Write]
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: version
          in: query
          schema: { type: integer }
          description: Optimistic lock version; if missing → no conflict check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      operationId: patchEntity
      summary: Partially update entity
      description: |
        Only the supplied fields are changed.
        Missing fields remain unchanged.
        `properties` array: only supplied properties are updated.
      tags: [Entities – Write]
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: version
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteEntity
      summary: Soft-delete entity
      tags: [Entities – Write]
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '204':
          description: Soft-deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /entities/by-external-id/{externalId}:
    put:
      operationId: upsertEntityByExternalId
      summary: Create or update entity (upsert by externalId)
      description: |
        Idempotent create-or-update. Core endpoint for external systems (ADR-026).
        Returns `201 Created` on creation, `200 OK` on update.
        Repeated calls with identical data are safe.
      tags: [Entities – Write]
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
          description: "Stable source identifier (URL-encoded, e.g. `git%3Aorg%2Frepo%2Fsvc`)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '201':
          description: Newly created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /entities/validate:
    post:
      operationId: validateEntity
      summary: Validate entity without persisting
      description: |
        Performs all validations (metatype check, mandatory properties,
        pattern checks, connection constraints) without persisting.
        Useful for external systems before the actual write.
      tags: [Entities – Write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityWrite' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /entities/batch:
    post:
      operationId: batchWriteEntities
      summary: Create/update entities and connections in batch
      description: |
        Writes up to 500 entities and 500 connections in one request.
        The preferred endpoint for external systems with `strategy: upsert`
        (ADR-026). `?dryRun=true` → validation without persisting.
      tags: [Entities – Write]
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchWriteRequest' }
      responses:
        '200':
          description: Batch result (also for partial errors if atomic=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchWriteResponse' }
        '422':
          description: Entire batch invalid (e.g. empty body, atomic=true with error)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /connections:
    post:
      operationId: createConnection
      summary: Create connection between two entities
      description: |
        Creates a connection entity (metatype.is_connection=true).
        Validates against `metatype_connection_constraints`.
        Source/target can be referenced via internal ID or `externalId`.
      tags: [Entities – Write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionWrite' }
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '404':
          description: Source or target entity not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Connection constraint violated
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/ValidationError' }

  # ── Metamodel discovery (ADR-026) ─────────────────────────────────────────
  /metamodel/allowed-connections:
    get:
      operationId: getAllowedConnections
      summary: Allowed connections between two metatypes
      description: |
        Answers: "Which connection metatypes are allowed between metatype A and B?"
        Writing systems use this endpoint to validate connection writes
        in advance. Source: `metatype_connection_constraints`.
      tags: [Metamodel]
      parameters:
        - name: sourceMetatypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: targetMetatypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Allowed connection metatypes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowedConnectionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Metamodel package import/export (ADR-026) ───────────────────────────────
  /admin/metamodel/export:
    get:
      operationId: exportMetamodelPackage
      summary: Export metamodel package (ADR-026)
      description: |
        Exports the complete metamodel as a portable JSON package:
        metatypes, property definitions, viewpoints, shape assignments, i18n labels.
        Serves as the basis for metamodel libraries and the upsert workflow
        of external systems (externalId namespace, metatype IDs).
      tags: [Admin]
      parameters:
        - name: configId
          in: query
          schema: { type: string, format: uuid }
          description: "Specific metamodel config; without parameter → instance-wide configuration"
        - name: includeI18n
          in: query
          schema: { type: boolean, default: true }
          description: "Include i18n bundles in the package"
      responses:
        '200':
          description: Metamodel package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetamodelPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/metamodel/import:
    post:
      operationId: importMetamodelPackage
      summary: Import metamodel package (ADR-026)
      description: |
        Imports a metamodel package (e.g. ArchiMate 3.2 base metamodel).
        `merge`: adds missing metatypes/properties, updates existing ones.
        `replace`: replaces the metamodel completely (only if no entities
        of the old metamodel exist).
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MetamodelPackage'
                - type: object
                  properties:
                    strategy:
                      type: string
                      enum: [merge, replace]
                      default: merge
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '409':
          description: "`replace` not possible (existing entities of the old metamodel)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Invalid package format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── Shape palette per viewpoint ─────────────────────────────────────────────
  /admin/viewpoints/{id}/shape-palette:
    get:
      operationId: getShapePalette
      summary: Shape palette for a viewpoint (ADR-026)
      description: |
        Which shape/icon does which metatype get in this viewpoint?
        Writing systems and the diagram editor load this palette to
        display entities correctly without hard-coding shape knowledge.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Viewpoint key (slug)
      responses:
        '200':
          description: Shape palette
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShapeAssignment' }
        '404':
          description: Viewpoint not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: updateShapePalette
      summary: Update shape palette
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ShapeAssignment' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShapeAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  PORTAL (Read-only, SCR-050–054)                                       ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /portal/catalog:
    get:
      operationId: getPortalCatalogView
      summary: Portal catalog (SCR-050)
      description: |
        Read-only version of `/views/catalog`. Reduced auth scope (portal-reader).
        Certain properties are hidden according to the property visibility configuration
        (SCR-032) (visibility `always` / `default` / `hidden`).
      tags: [Portal]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[metatypeId]
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: false
      responses:
        '200':
          description: Entity list (reduced properties)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntityListItem' }
                  page:          { $ref: '#/components/schemas/PageMeta' }
                  filterOptions: { $ref: '#/components/schemas/CatalogFilterOptions' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/catalog/{id}:
    get:
      operationId: getPortalEntityDetail
      summary: Portal entity detail (SCR-051)
      description: Read-only. No edit button; properties according to the visibility configuration.
      tags: [Portal]
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
      responses:
        '200':
          description: Entity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/diagrams/{id}:
    get:
      operationId: getPortalDiagramView
      summary: Portal diagram viewer (SCR-052)
      description: Read-only. No editing; shapes cannot be selected or moved.
      tags: [Portal]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Diagram
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramView' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/dashboards/{id}/data:
    get:
      operationId: getPortalDashboardData
      summary: Portal dashboard data (SCR-053)
      description: Read-only. No widget configuration; data points only.
      tags: [Portal]
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardData' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /portal/audit/events:
    get:
      operationId: getPortalAuditEvents
      summary: Portal change history (SCR-054)
      description: |
        Read-only view of audit events. No restore button.
        Filtered to publicly visible event types.
      tags: [Portal]
      parameters:
        - name: entityId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  SSE – invalidation channel (ADR-025)                                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /events/stream:
    get:
      operationId: getEventStream
      summary: Server-Sent Events — cache invalidation (ADR-025)
      description: |
        Persistent SSE connection for cache invalidation.
        Events: `i18n_invalidated`, `metamodel_updated`.
        Can be disabled via `oea.sse.enabled=false`.
      tags: [Events]
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"i18n_invalidated","locale":"de"}

                  data: {"type":"metamodel_updated"}
        '401': { $ref: '#/components/responses/Unauthorized' }

# ═════════════════════════════════════════════════════════════════════════════
# TAGS
# ═════════════════════════════════════════════════════════════════════════════
tags:
  - name: Views – Catalog
    description: Catalog browser and entity detail (SCR-020/012)
  - name: Views – Navigation
    description: Explorer / navigation tree (SCR-010/011)
  - name: Views – Editoren
    description: Diagram, lineage, dashboard and roadmap editors (SCR-021–025)
  - name: Entities
    description: Entity history and restore (UC-14/15/16)
  - name: Entities – Write
    description: |
      Write endpoints for entities and connections (ADR-026, optional).
      Requires feature flag `oea.integration.enabled=true` and role `integration-writer`.
      `?dryRun=true` available on batch and validate endpoints.
  - name: Metamodel
    description: Metatypes, property definitions and mappings (SCR-030)
  - name: Admin
    description: Administration screens (SCR-031–038)
  - name: Audit
    description: Compliance-Audit-Log (ADR-024, SCR-054)
  - name: Portal
    description: Web portal read-only endpoints (SCR-050–054)
  - name: I18N
    description: Dynamic labels with ETag caching (ADR-025)
  - name: Events
    description: Server-Sent Events for cache invalidation
