openapi: 3.1.0

info:
  title: OEA – Open Enterprise Architecture API
  version: 0.1.0-SNAPSHOT
  description: |
    REST API for OEA. Three layers:
    - **Resource API** (`/api/v1/...`): CRUD and automation (REQ-147)
    - **View API** (`/api/v1/views/...`): aggregated, screen-optimized endpoints (BFF pattern)
    - **Portal API** (`/api/v1/portal/...`): read-only endpoints of the web portal
      for curated, instance-scope content (permission `portal:read`)

    **Authorization** (ADR-032): every operation declares its required permissions
    in the vendor extension `x-oea-authorization`; permissions are never derived from
    role names, OAuth scopes or IdP claims. The extension has the fields:
    - `access`: `public` (no principal; only the allowlisted token endpoint),
      `authenticated` (any authenticated principal; object-level ownership checks apply)
      or `permission`
    - `permissions`: all listed permissions are required
    - `anyOfPermissions`: at least one of the listed permissions is required (used for
      reading configuration objects that a managing permission includes, ADR-032 §3)
    - `conditions`: additional permissions required only when the stated condition
      applies to the request (e.g. `deleted=true` requires `entity:restore`)

    The permission catalog is the top-level extension `x-oea-permissions`; the built-in
    roles and their permission sets are `x-oea-builtin-roles` (both fixed per release,
    also returned by `GET /admin/permissions` and `GET /admin/roles`). Operations
    without a declaration are denied for all principals (REQ-158).
    `scripts/check_openapi_authorization.py` checks the declarations.

    Responses: `401` = not authenticated; `403` = a required permission is missing or a
    separation-of-duties rule forbids the action (generic problem body); `404` is also
    returned for existence-sensitive objects the caller may not see (REQ-159).
    Property values the caller may not read are returned as `null` with `redacted: true`
    (REQ-160).

    There is no anonymous access (REQ-163). Clients authenticate with
    - `bearerAuth`: OEA access token of the Electron client
    - `cookieAuth`: session cookie of the web portal
    - `oauth2ClientCredentials`: access token of a service account obtained at
      `POST /oauth2/token` (REQ-176); token scopes are not used for OEA permissions

    **External integration** (ADR-026, optional): write access by external systems
    (scanners, CI/CD pipelines, import tools) via upsert endpoints and batch write,
    enabled by feature flag `oea.integration.enabled=true`. Service accounts and persons
    need the same permission `entity:write` for write operations.
    The request headers `X-Agent-Id` and `X-Agent-Run` are **informational only**
    (ADR-033 §7): `X-Agent-Id` is stored untrusted as `agentLabel` (max. 100 characters,
    control characters removed) and never used for attribution, filtering or
    authorization. `agentId` in the audit log is always the `client_id` of the
    authenticated service account (`null` for persons and the local system admin
    account). JWT claims such as `agent_id` are ignored.

    **Audit trail** (ADR-033): append-only. There is no operation that modifies or
    deletes audit records, for any permission; the only audit operations are reading,
    exporting (`GET /audit/events/export`, JSON Lines) and verifying
    (`GET /audit/integrity`), all requiring `audit:read`. Actors are pseudonymous
    (`actorType` + `actorRef`); names are resolved at read time only. Records are
    deleted solely by the retention purge (`/admin/audit/retention`, floor 365 days).

    **Raw analytics** (ADR-034): `POST /analytics/query` accepts SQL only, executed
    against the masked reporting schema (`GET /analytics/schema`), permission
    `analytics:query`, disabled by default (`analytics.enabled`). There is no
    `/graph/cypher` and no `/analytics/views/{name}` in v1.

    **Local data purge signal** (ADR-035 §8, REQ-164, REQ-181): when a session has
    ended or the principal has lost all access, responses carry the header
    `OEA-Purge-Local-Data`, and the event stream sends `session_ended` before it is
    closed. Clients delete their offline cache and stored tokens on either signal.

    Versioning: URL path (`/api/v1/`). Breaking changes → new major version.
    Error format: RFC 9457 Problem Details (`application/problem+json`).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1
    description: Current version

# Alternatives: exactly one of the schemes authenticates a request.
security:
  - bearerAuth: []
  - cookieAuth: []
  - oauth2ClientCredentials: []

# ═════════════════════════════════════════════════════════════════════════════
# AUTHORIZATION CATALOG (ADR-032 §3, §4) – single source for the contract check
# Kept as JSON (valid YAML flow style) so that tooling can read it without a
# YAML parser. Changing it requires a release and an update of ADR-032.
# ═════════════════════════════════════════════════════════════════════════════
x-oea-permissions: [
  {"id": "portal:read", "adminClass": false, "description": "Read shared (instance-scope) dashboards, catalogs and diagrams through the portal endpoints, including the projected entity data; own personal dashboards"},
  {"id": "entity:read", "adminClass": false, "description": "Read entities, connections, catalogs, diagrams, viewpoints, lineage, roadmap, search, entity history, metamodel and schema introspection"},
  {"id": "entity:write", "adminClass": false, "description": "Create and change entities and connections (UI, upsert, batch, import of content); excludes connections of scoping types"},
  {"id": "entity:delete", "adminClass": false, "description": "Soft-delete entities and connections (ADR-019)"},
  {"id": "entity:restore", "adminClass": false, "description": "See soft-deleted entities, restore entities and versions (UC-15, UC-16)"},
  {"id": "catalog:manage", "adminClass": false, "description": "Create and configure shared catalogs and shared saved filters"},
  {"id": "dashboard:manage", "adminClass": false, "description": "Create and configure shared dashboards"},
  {"id": "viewpoint:manage", "adminClass": false, "description": "Manage viewpoints and the navigation tree (UC-12, UC-13)"},
  {"id": "plateau:go-live", "adminClass": false, "description": "Put a plateau into production (UC-11)"},
  {"id": "webhook:manage", "adminClass": false, "description": "Register and manage webhooks"},
  {"id": "analytics:query", "adminClass": false, "description": "Submit raw SQL analytics queries against the masked reporting schema (REQ-179, ADR-034; Cypher deferred)"},
  {"id": "audit:read", "adminClass": false, "description": "Read, export (SIEM, JSON Lines) and verify the audit log, see resolved actor names and the audit retention, and read the access review"},
  {"id": "metamodel:write", "adminClass": true, "description": "Change the metamodel except visibility fields; metamodel and continuum package import/export"},
  {"id": "visibility:configure", "adminClass": true, "description": "Change visibilityMode, readRoles, writeRoles, scopingConnectionType and the override role list"},
  {"id": "visibility-scope:assign", "adminClass": true, "description": "Create, change and delete connections of types used as scopingConnectionType"},
  {"id": "role:assign", "adminClass": true, "description": "Define custom roles, assign and revoke roles, approve pending assignments, manage IdP group mappings"},
  {"id": "person:manage", "adminClass": true, "description": "Invite persons, change their lifecycle status, reset local credentials, set the account link to a Person entity"},
  {"id": "service-account:manage", "adminClass": true, "description": "Create and deactivate service accounts, issue and rotate client secrets"},
  {"id": "auth-config:manage", "adminClass": true, "description": "Configure authentication providers, 2FA policy, remote system admin mapping"},
  {"id": "settings:manage", "adminClass": true, "description": "Change instance settings"}
  ]

x-oea-builtin-roles: [
  {"id": "portal-reader", "assignableToServiceAccounts": false, "permissions": ["portal:read"]},
  {"id": "viewer", "assignableToServiceAccounts": true, "permissions": ["portal:read", "entity:read"]},
  {"id": "analyst", "assignableToServiceAccounts": false, "permissions": ["portal:read", "entity:read", "analytics:query"]},
  {"id": "enterprise-architect", "assignableToServiceAccounts": false, "permissions": ["portal:read", "entity:read", "entity:write", "entity:delete", "entity:restore", "catalog:manage", "dashboard:manage", "viewpoint:manage", "plateau:go-live", "webhook:manage"]},
  {"id": "integration-writer", "assignableToServiceAccounts": true, "permissions": ["entity:read", "entity:write"]},
  {"id": "auditor", "assignableToServiceAccounts": true, "permissions": ["audit:read"]},
  {"id": "metamodel-admin", "assignableToServiceAccounts": false, "permissions": ["metamodel:write"]},
  {"id": "security-admin", "assignableToServiceAccounts": false, "permissions": ["visibility:configure", "visibility-scope:assign", "role:assign", "person:manage"]},
  {"id": "system-admin", "assignableToServiceAccounts": false, "permissions": ["role:assign", "person:manage", "service-account:manage", "auth-config:manage", "settings:manage"]}
  ]

# ═════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OEA access token of the Electron client. Identifies principal and session only;
        permissions are resolved server-side per request (ADR-032 §7).
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-OEA_SESSION
      description: |
        Session cookie of the web portal (`__Host-` prefix, `HttpOnly`, `Secure`,
        `Path=/`, `SameSite=Strict`, REQ-187). State-changing requests additionally
        require the CSRF token header `X-XSRF-TOKEN` (token from the login response or
        `GET /me`) and an allowed `Origin`. The session identifies principal and session only.
    oauth2ClientCredentials:
      type: oauth2
      description: |
        Service accounts only (REQ-176). Access tokens carry only the `client_id`
        and live at most 15 minutes. Scopes are not used; permissions come from
        the roles assigned to the service account.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth2/token
          scopes: {}
    clientSecretBasic:
      type: http
      scheme: basic
      description: |
        Client authentication at the token endpoint only (`client_id:client_secret`,
        RFC 6749 §2.3.1).

  # ── Headers ─────────────────────────────────────────────────────────────────
  headers:
    PurgeLocalData:
      description: |
        Server signal to delete client-side data (ADR-035 §8, REQ-164, REQ-181 AC4).
        Present only when it applies; absent otherwise. On receipt the Electron client
        (main-process API proxy) deletes the offline cache and the stored tokens of
        the user for this server and returns to the login screen; the web portal
        discards in-memory data and reloads to the login page. Values:
        - `session-ended`: the session or refresh token presented is no longer valid
          because of logout, server-side revocation (lifecycle change, credential or
          password reset, role assignment revoked), refresh token reuse, idle timeout
          or absolute lifetime (REQ-164, REQ-165). Sent with `401`.
        - `access-revoked`: the session is valid, but the principal no longer holds any
          effective role (REQ-164 AC3, all roles lost). Sent with `403` and with every
          further response of that session.
        The value is never sent for a `401` caused by a request without credentials, so
        a client cannot be made to purge data by an unauthenticated response it did
        not provoke with its own session.
      schema:
        type: string
        enum: [session-ended, access-revoked]
    RetryAfter:
      description: Seconds after which the request may be retried (RFC 9110 §10.2.3)
      schema: { type: integer, minimum: 1 }

  # ── Responses ───────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request parameters or malformed body
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |
        Not authenticated (missing, expired or revoked credentials or session). When a
        previously valid session or refresh token was presented and has ended, the
        header `OEA-Purge-Local-Data: session-ended` is set and the problem `type` is
        `urn:oea:problem:session-ended`.
      headers:
        OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, but a permission declared in `x-oea-authorization` is missing,
        a separation-of-duties rule forbids the action (e.g. self-administration, SoD-1),
        or a privileged role is not effective because the session lacks a second factor
        (SoD-8). The problem body is generic and does not reveal the missing permission.
        A session created with a temporary password answers every operation except
        `GET /me`, the logout, `POST /me/password` and `POST /me/password/suggestion` with
        problem type `urn:oea:problem:password-change-required` (REQ-173 AC2). A session that
        must enroll a second factor answers every operation except `GET /me`, the logout,
        `GET /me/second-factors` and the TOTP and passkey enrollment with problem type
        `urn:oea:problem:second-factor-enrollment-required` (US-031 AC2).
        If the principal holds no effective role at all, the header
        `OEA-Purge-Local-Data: access-revoked` is set.
      headers:
        OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: |
        Rate limit or throttling exceeded (REQ-186, REQ-168), problem type
        `urn:oea:problem:too-many-requests`; `Retry-After` gives the seconds until the next
        request is accepted. Nothing was processed.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Resource not found, or an existence-sensitive resource the caller may not see
        (same response for both cases, REQ-159)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        The request conflicts with the current state, e.g. it would remove the last
        administration path (SoD-7), the object is still referenced, or a pending
        request has already been decided
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: |
        Request body larger than the configured limit (problem type
        `urn:oea:problem:request-too-large`, REQ-186); nothing is processed. The limits are
        configurable by the operator – 1 MB by default, 10 MB for the entity batch.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MetamodelConflict:
      description: |
        The metamodel change conflicts with the current state (US-032, ADR-002). Problem
        types: `urn:oea:problem:read-only-metatype` (built-in or imported content),
        `urn:oea:problem:name-taken` (name used already, compared case-insensitively),
        `urn:oea:problem:in-use` (still used; `count` gives the number of entities where
        it applies) and `urn:oea:problem:conflict` (property mapped twice in a base type chain).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotImplemented:
      description: |
        The operation is part of the published contract but not implemented in this release
        (`x-oea-status: planned`, problem type `urn:oea:problem:not-implemented`). The request
        is authenticated and authorized like any other and changes nothing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Request body violates the metamodel or business rules
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # ── Parameters ──────────────────────────────────────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SortParam:
      name: sort
      in: query
      schema: { type: string, example: "name:asc" }
      description: "`{field}:{asc|desc}`, multiple comma-separated"
    LocaleParam:
      name: locale
      in: path
      required: true
      schema: { type: string, enum: [de, en, fr, it] }
    EntityIdParam:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Entity ID
    UuidIdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonIdParam:
      name: personId
      in: path
      required: true
      schema: { type: integer }
      description: "`persons.id` of a person or a service account"
    RoleIdParam:
      name: roleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RoleId' }
    AgentIdHeader:
      name: X-Agent-Id
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: |
        Informational label of the calling tool (ADR-026, ADR-033 §7). Stored untrusted
        as `agentLabel`; never used for attribution, filtering or authorization.
        Longer values are truncated to 100 characters; control characters are removed.
    AgentRunHeader:
      name: X-Agent-Run
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: Informational correlation ID of a run of the calling tool (stored as `agentRun`)

  # ── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ── Base types ────────────────────────────────────────────────────────────
    PageMeta:
      type: object
      required: [page, pageSize, totalElements, totalPages]
      properties:
        page:          { type: integer }
        pageSize:      { type: integer }
        totalElements: { type: integer }
        totalPages:    { type: integer }

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. Problem type URIs follow `urn:oea:problem:<kebab-case-name>`
        (ADR-037 §6); `about:blank` is used where no specific type is defined.
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string, format: uri }

    # ── Catalog (UC-06, US-046) ───────────────────────────────────────────────
    CatalogScope:
      type: string
      enum: [instance, personal]
      description: "`instance` is visible to all users with `entity:read`, `personal` only to the creator"

    JoinMode:
      type: string
      enum: [aggregate, rows]
      description: "`aggregate` shows linked target entities in one cell, `rows` one row per target entity"

    CatalogCreate:
      type: object
      required: [name, primaryMetatypeId, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique within the instance (case-insensitive, trimmed); stored trimmed
        description:
          type: string
          maxLength: 1000
        primaryMetatypeId:
          type: string
          format: uuid
          description: Metatype of the instance metamodel that supplies the rows; referenced by ID, so a rename keeps the catalog intact
        scope: { $ref: '#/components/schemas/CatalogScope' }
        defaultJoinMode:
          allOf:
            - $ref: '#/components/schemas/JoinMode'
          default: aggregate

    CatalogSummary:
      type: object
      required: [id, name, primaryMetatypeId, primaryMetatypeName, scope, createdBy, createdAt]
      properties:
        id:                  { type: string, format: uuid }
        name:                { type: string }
        primaryMetatypeId:   { type: string, format: uuid }
        primaryMetatypeName: { type: string, description: Current name of the primary metatype }
        scope:               { $ref: '#/components/schemas/CatalogScope' }
        createdBy:           { $ref: '#/components/schemas/PrincipalRef' }
        createdAt:           { type: string, format: date-time }

    Catalog:
      allOf:
        - $ref: '#/components/schemas/CatalogSummary'
        - type: object
          required: [description, defaultJoinMode, lastModifiedAt, columns, joinDefinitions, savedFilters, savedViews]
          properties:
            description:     { type: string }
            defaultJoinMode: { $ref: '#/components/schemas/JoinMode' }
            lastModifiedAt:  { type: string, format: date-time }
            columns:
              type: array
              description: Column configuration; follows with US-047 and is always empty until then
              items: { type: object }
            joinDefinitions:
              type: array
              description: Joins via connections; follow with US-048 and are always empty until then
              items: { type: object }
            savedFilters:
              type: array
              description: Saved filters; follow later and are always empty until then
              items: { type: object }
            savedViews:
              type: array
              description: Saved views; follow later and are always empty until then
              items: { type: object }

    CatalogValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [invalidFields]
          properties:
            invalidFields:
              type: array
              items: { type: string, enum: [name, description, primaryMetatypeId, scope, defaultJoinMode] }

    CatalogColumn:
      type: object
      required: [key, label, sortable]
      properties:
        key:
          type: string
          description: Key of the column in `CatalogRow.values` and in the `sort` parameter (`name` or the `sqlColumnName` of a property)
        label:    { type: string, description: Column header }
        sortable: { type: boolean }

    CatalogRow:
      type: object
      required: [entityId, values]
      properties:
        entityId: { type: integer }
        values:
          type: object
          description: Text form of the value per column key; `null` if the entity has no value
          additionalProperties: { type: [string, 'null'] }

    CatalogSort:
      type: object
      required: [column, direction]
      properties:
        column:    { type: string, description: Key of the sort column }
        direction: { type: string, enum: [asc, desc] }

    CatalogQueryResult:
      type: object
      required: [columns, rows, page]
      properties:
        columns:
          type: array
          description: The columns of the catalog in display order
          items: { $ref: '#/components/schemas/CatalogColumn' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CatalogRow' }
        page: { $ref: '#/components/schemas/PageMeta' }
        sort:
          oneOf:
            - $ref: '#/components/schemas/CatalogSort'
            - type: 'null'
          description: The applied sort; `null` for the default order (name ascending)

    CatalogQueryProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [invalidFields]
          properties:
            invalidFields:
              type: array
              items: { type: string, enum: [page, pageSize, sort] }

    # ── Metatype ───────────────────────────────────────────────────────────────
    MetamodelScope:
      type: string
      enum: [built-in, imported, organization]
      description: |
        Scope of metamodel content (ADR-002): `built-in` is part of the software and read-only,
        `imported` comes from a package and changes only by re-importing that package,
        `organization` is maintained by the organization.

    SourcePackage:
      type: object
      required: [packageId, version]
      description: Package that imported content comes from
      properties:
        packageId: { type: string }
        version:   { type: string }

    MetatypeSummary:
      type: object
      required: [id, name, abbreviation]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        abbreviation: { type: string, example: "AC" }

    MetatypeDetail:
      allOf:
        - $ref: '#/components/schemas/MetatypeSummary'
        - type: object
          properties:
            isConnection:       { type: boolean }
            architectureLayer:  { type: [string, 'null'] }
            sortOrder:          { type: integer }
            scope:              { $ref: '#/components/schemas/MetamodelScope' }
            baseMetatypeId:
              type: [string, 'null']
              format: uuid
              description: |
                Base type; the metatype inherits its property mappings. In a package: a metatype
                of the same package or a built-in one.
            reimportPolicy:
              type: string
              enum: [inherit, keep, remove]
              readOnly: true
              description: Own re-import setting for organization mappings (`updateMetatypeReimportPolicy`); ignored in packages
            effectiveReimportPolicy:
              type: string
              enum: [keep, remove]
              readOnly: true
              description: Setting that applies, resolved along the base types up to the global setting
            sourcePackage:
              oneOf:
                - $ref: '#/components/schemas/SourcePackage'
                - type: 'null'
            propertyMappings:
              type: array
              items: { $ref: '#/components/schemas/MetatypePropertyMapping' }
            connectionConstraints:
              type: array
              items:
                type: object
                properties:
                  direction:       { type: string, enum: [source, target] }
                  allowedMetatype: { $ref: '#/components/schemas/MetatypeSummary' }

    MetatypeWrite:
      type: object
      required: [name, configId]
      properties:
        name:                 { type: string }
        abbreviation:         { type: string }
        isConnection:         { type: boolean, default: false, description: "Must be `false` until connection metatypes are supported (422); cannot change" }
        architectureLayerId:  { type: [string, 'null'] }
        sortOrder:            { type: integer, default: 0 }
        configId:             { type: string, format: uuid, description: The instance configuration }
        baseMetatypeId:       { type: [string, 'null'], format: uuid, description: "Base type; no cycles (422)" }

    MetatypeReimportPolicy:
      type: object
      required: [organizationMappings]
      properties:
        organizationMappings:
          type: string
          enum: [inherit, keep, remove]
          description: Whether a package re-import keeps or removes the organization mappings of the metatype; `inherit` follows the base type

    ReimportPolicy:
      type: object
      required: [organizationMappings]
      description: Global re-import setting of the instance metamodel configuration
      properties:
        organizationMappings:
          type: string
          enum: [keep, remove]
          default: keep
          description: Whether a package re-import keeps or removes organization mappings of imported metatypes; removing deletes their values

    # ── Property categories ───────────────────────────────────────────────────
    PropertyCategory:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: [string, 'null'] }
        sortOrder:   { type: integer }

    PropertyCategoryWrite:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }
        sortOrder:   { type: integer, default: 0 }

    # ── Property definitions ─────────────────────────────────────────────────
    PropertyEnumValue:
      type: object
      required: [id, value, sortOrder]
      properties:
        id:        { type: string, format: uuid }
        value:     { type: string }
        sortOrder: { type: integer }
        label:     { type: string, description: "Translated label (session locale)" }

    PropertyDefinitionDetail:
      type: object
      required: [id, name, dataType]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string }
        label:          { type: string, description: "Translated label (session locale)" }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
        category:       { oneOf: [ { $ref: '#/components/schemas/PropertyCategory' }, { type: 'null' } ] }
        refMetatype:    { oneOf: [ { $ref: '#/components/schemas/MetatypeSummary' }, { type: 'null' } ] }
        sqlColumnName:  { type: string, readOnly: true, description: Storage name derived from the name; never changes }
        maxLength:      { type: [integer, 'null'] }
        minValue:       { type: [number, 'null'] }
        maxValue:       { type: [number, 'null'] }
        pattern:        { type: [string, 'null'] }
        enumValues:
          type: array
          items: { $ref: '#/components/schemas/PropertyEnumValue' }
        scope:          { $ref: '#/components/schemas/MetamodelScope' }
        sourcePackage:
          oneOf:
            - $ref: '#/components/schemas/SourcePackage'
            - type: 'null'
        visibility:
          allOf:
            - $ref: '#/components/schemas/PropertyVisibility'
          readOnly: true
          description: |
            Visibility configuration (REQ-124). Read-only in the metamodel endpoints;
            changed only via `PUT /admin/property-visibility` with `visibility:configure`
            (SoD-2). Ignored in metamodel package imports.

    PropertyDefinitionWrite:
      type: object
      required: [name, dataType]
      properties:
        name:           { type: string }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
          description: "`reference` is rejected with 422 until connection metatypes are supported"
        categoryId:     { type: [string, 'null'], format: uuid }
        refMetatypeId:  { type: [string, 'null'], format: uuid }
        maxLength:      { type: [integer, 'null'] }
        minValue:       { type: [number, 'null'] }
        maxValue:       { type: [number, 'null'] }
        pattern:        { type: [string, 'null'] }

    # ── Metatype property mapping ───────────────────────────────────────────────
    MetatypePropertyMapping:
      type: object
      required: [id, propertyDefinition, necessity, validFrom, sortOrder]
      properties:
        id:                 { type: string, format: uuid }
        propertyDefinition: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        necessity:
          type: string
          enum: [mandatory, warning, optional]
        validFrom:          { type: string, format: date }
        sortOrder:          { type: integer }
        scope:
          allOf:
            - $ref: '#/components/schemas/MetamodelScope'
          readOnly: true
          description: "`organization` for a mapping of an organization property definition, otherwise the scope of the package or built-in content"
        inheritedFrom:
          oneOf:
            - $ref: '#/components/schemas/MetatypeSummary'
            - type: 'null'
          readOnly: true
          description: Base type that owns the mapping; null for an own mapping
        markedEntityCount:
          type: integer
          readOnly: true
          description: Only in the response of `createPropertyMapping`; entities marked as missing the new mandatory property
        defaultValue:
          type: [object, 'null']
          description: Optional default value (typed)
          properties:
            valueText:  { type: string }
            valueInt:   { type: integer }
            valueBool:  { type: boolean }
            valueDate:  { type: string, format: date }
            valueEnum:  { type: string }

    MetatypePropertyMappingWrite:
      type: object
      required: [propertyDefId, necessity]
      properties:
        propertyDefId: { type: string, format: uuid }
        necessity:
          type: string
          enum: [mandatory, warning, optional]
        validFrom:     { type: string, format: date, description: Defaults to today }
        sortOrder:     { type: integer, default: 0 }
        defaultValue:
          type: [object, 'null']
          properties:
            valueText:  { type: string }
            valueInt:   { type: integer }
            valueBool:  { type: boolean }
            valueDate:  { type: string, format: date }
            valueEnum:  { type: string }

    # ── Entity ───────────────────────────────────────────────────────────────
    PropertyValue:
      type: object
      required: [propertyDefId, propertyName, dataType, redacted]
      description: |
        If the caller may not read the property (REQ-124 to REQ-127), all `value*`
        fields are `null` and `redacted` is `true` (REQ-160).
      properties:
        redacted:
          type: boolean
          default: false
          description: "`true` = value masked by property visibility; `false` = value shown (may be empty)"
        propertyDefId: { type: string, format: uuid }
        propertyName:  { type: string }
        label:         { type: string }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
        valueText:  { type: [string, 'null'] }
        valueInt:   { type: [integer, 'null'] }
        valueBool:  { type: [boolean, 'null'] }
        valueDate:  { type: [string, 'null'], format: date }
        valueEnum:  { type: [string, 'null'] }
        valueRef:
          type: [object, 'null']
          properties:
            id:           { type: integer }
            name:         { type: string }
            metatypeAbbr: { type: string }

    RelationSummary:
      type: object
      required: [id, metatype, direction, relatedEntity]
      properties:
        id:        { type: integer }
        metatype:  { $ref: '#/components/schemas/MetatypeSummary' }
        direction:
          type: string
          enum: [outgoing, incoming]
        relatedEntity:
          type: object
          required: [id, name, metatype]
          properties:
            id:       { type: integer }
            name:     { type: string }
            metatype: { $ref: '#/components/schemas/MetatypeSummary' }

    EntityListItem:
      type: object
      required: [id, name, metatype, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        metatype:    { $ref: '#/components/schemas/MetatypeSummary' }
        isLogical:   { type: boolean }
        lifecycle:   { type: [string, 'null'] }
        deletedAt:   { type: [string, 'null'], format: date-time }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    EntityDetail:
      allOf:
        - $ref: '#/components/schemas/EntityListItem'
        - type: object
          properties:
            version:    { type: integer }
            properties:
              type: array
              items: { $ref: '#/components/schemas/PropertyValue' }
            relations:
              type: array
              items: { $ref: '#/components/schemas/RelationSummary' }
            parentEntity:
              type: [object, 'null']
              properties:
                id:   { type: integer }
                name: { type: string }

    CatalogFilterOptions:
      type: object
      properties:
        metatypes:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MetatypeSummary'
              - type: object
                properties:
                  count: { type: integer }
        lifecycleValues:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              count: { type: integer }

    # ── Explorer / navigation tree ────────────────────────────────────────────
    TreeNodeItem:
      type: object
      required: [id, itemType, referenceId, displayLabel, sortOrder]
      properties:
        id:           { type: string, format: uuid }
        itemType:
          type: string
          enum: [tree-node, entity, diagram, catalog]
        referenceId:  { type: string }
        displayLabel: { type: string }
        sortOrder:    { type: integer }
        metatype:     { oneOf: [ { $ref: '#/components/schemas/MetatypeSummary' }, { type: 'null' } ] }
        isDeleted:    { type: boolean, default: false }

    TreeNode:
      type: object
      required: [id, name, sortOrder, items, children]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        sortOrder: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/TreeNodeItem' }
        children:
          type: array
          items: { $ref: '#/components/schemas/TreeNode' }
          description: Recursive child nodes

    # ── Diagram ──────────────────────────────────────────────────────────────
    DiagramShape:
      type: object
      required: [id, entityId, entityName, metatype, x, y, width, height]
      properties:
        id:         { type: string, format: uuid }
        entityId:   { type: integer }
        entityName: { type: string }
        metatype:   { $ref: '#/components/schemas/MetatypeSummary' }
        x:          { type: number }
        y:          { type: number }
        width:      { type: number }
        height:     { type: number }
        styleOverrides:
          type: [object, 'null']
          additionalProperties: true

    DiagramView:
      type: object
      required: [id, name, viewpoint, shapes, connections]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        viewpoint:   { type: [string, 'null'] }
        description: { type: string }
        shapes:
          type: array
          items: { $ref: '#/components/schemas/DiagramShape' }
        connections:
          type: array
          description: Connection entities between shapes
          items:
            type: object
            required: [id, sourceShapeId, targetShapeId, metatype]
            properties:
              id:            { type: string, format: uuid }
              sourceShapeId: { type: string, format: uuid }
              targetShapeId: { type: string, format: uuid }
              metatype:      { $ref: '#/components/schemas/MetatypeSummary' }
        updatedAt:   { type: string, format: date-time }

    # ── Data Lineage ──────────────────────────────────────────────────────────
    LineageNode:
      type: object
      required: [id, name, nodeType, metatype]
      properties:
        id:       { type: integer }
        name:     { type: string }
        nodeType:
          type: string
          enum: [source, transform, target]
        metatype: { $ref: '#/components/schemas/MetatypeSummary' }
        metrics:
          type: [object, 'null']
          properties:
            recordsPerDay: { type: integer }
            latencyMs:     { type: integer }

    LineageView:
      type: object
      required: [id, name, nodes, edges]
      properties:
        id:    { type: string, format: uuid }
        name:  { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LineageNode' }
        edges:
          type: array
          items:
            type: object
            required: [sourceId, targetId]
            properties:
              sourceId: { type: integer }
              targetId: { type: integer }
              label:    { type: [string, 'null'] }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    WidgetConfig:
      type: object
      required: [id, widgetType, title, position]
      properties:
        id:         { type: string, format: uuid }
        widgetType:
          type: string
          enum: [kpi, bar-chart, donut-chart, table, diagram-embed]
        title:      { type: string }
        position:
          type: object
          properties:
            col:    { type: integer }
            row:    { type: integer }
            width:  { type: integer }
            height: { type: integer }
        queryConfig:
          type: [object, 'null']
          description: Endpoint and filter parameters for widget data
          additionalProperties: true

    DashboardConfig:
      type: object
      required: [id, name, widgets]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetConfig' }

    WidgetData:
      type: object
      required: [widgetId, widgetType]
      properties:
        widgetId:   { type: string, format: uuid }
        widgetType: { type: string }
        data:
          description: Type-specific data points
          oneOf:
            - type: object
              description: KPI
              properties:
                value:     { type: string }
                delta:     { type: string }
                trendType: { type: string, enum: [up, down, neutral] }
            - type: array
              description: Bar / donut chart
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: number }
            - type: array
              description: Table
              items:
                type: object
                additionalProperties: true

    DashboardData:
      type: object
      required: [dashboardId, widgets, generatedAt]
      properties:
        dashboardId:  { type: string, format: uuid }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetData' }
        generatedAt:  { type: string, format: date-time }

    # ── Plateau-Roadmap ───────────────────────────────────────────────────────
    RoadmapEntityCard:
      type: object
      required: [entityId, name, metatype, plateauId, lifecycleState]
      properties:
        entityId:      { type: integer }
        name:          { type: string }
        metatype:      { $ref: '#/components/schemas/MetatypeSummary' }
        plateauId:     { type: string, format: uuid }
        lifecycleState:
          type: string
          enum: [planned, active, retiring, retired]
        isDeprecated:  { type: boolean, default: false }
        successorId:   { type: [integer, 'null'] }

    PlateauBand:
      type: object
      required: [plateau, entities]
      properties:
        plateau:
          type: object
          required: [id, name, status, validFrom, validTo]
          properties:
            id:        { type: string, format: uuid }
            name:      { type: string }
            status:    { type: string, enum: [baseline, transition, target, realized] }
            validFrom: { type: [string, 'null'], format: date }
            validTo:   { type: [string, 'null'], format: date }
        entities:
          type: array
          items: { $ref: '#/components/schemas/RoadmapEntityCard' }

    RoadmapView:
      type: object
      required: [id, name, plateaus]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        plateaus:
          type: array
          items: { $ref: '#/components/schemas/PlateauBand' }

    # ── Entity history ───────────────────────────────────────────────────────
    FieldDiff:
      type: object
      required: [fieldName, isSystemField]
      properties:
        fieldName:    { type: string, description: "Property name or system field (name, lifecycle, …)" }
        label:        { type: string, description: "Translated label" }
        isSystemField: { type: boolean }
        oldValue:     { type: [string, 'null'], description: "`null` if redacted" }
        newValue:     { type: [string, 'null'], description: "`null` if redacted" }
        redacted:
          type: boolean
          default: false
          description: "`true` = old and new value masked by property visibility (REQ-160)"

    EntityVersionSummary:
      type: object
      required: [version, changedAt, changedBy, changes]
      properties:
        version:    { type: integer }
        changedAt:  { type: string, format: date-time }
        changedBy:
          type: object
          properties:
            id:   { type: integer }
            name: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/FieldDiff' }

    EntityHistoryResponse:
      type: object
      required: [entityId, entityName, versions, page]
      properties:
        entityId:   { type: integer }
        entityName: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/EntityVersionSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }

    RestoreRequest:
      type: object
      required: [targetVersion]
      properties:
        targetVersion:
          type: integer
          description: Version number to restore to
        reason:
          type: string
          description: Reason (recorded in the audit log)

    # ── External integration – write schemas (ADR-026) ─────────────────────────
    PropertyWriteValue:
      type: object
      required: [propertyDefId, value]
      description: |
        Flat write schema: `value` is always a string.
        The backend converts according to `property_definitions.data_type`.
      properties:
        propertyDefId: { type: string, format: uuid }
        value:
          type: string
          description: |
            Serialized as text regardless of data type:
            boolean → "true"/"false", integer → "42",
            date → "2026-06-29", reference → "<entityId>",
            enum → enum value string

    EntityWrite:
      type: object
      required: [name, metatypeId]
      properties:
        name:
          type: string
        metatypeId:
          type: string
          format: uuid
        externalId:
          type: string
          description: |
            Stable identifier from the source system (e.g. "git:org/repo/svc",
            "k8s:prod/order-service"). Namespace convention: `{system}:{id}`.
            Must be unique for the OEA instance.
        description:  { type: string }
        isLogical:
          type: boolean
          description: Defaults to true when an entity is created; unchanged on update if omitted
        lifecycle:    { type: [string, 'null'] }
        parentId:     { type: [integer, 'null'], description: "Parent entity" }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertyWriteValue' }

    ConnectionWrite:
      type: object
      required: [connectionMetatypeId]
      description: |
        Exactly one of the pairs (sourceId/targetId) or
        (sourceExternalId/targetExternalId) must be provided.
      properties:
        connectionMetatypeId: { type: string, format: uuid }
        sourceId:         { type: integer }
        targetId:         { type: integer }
        sourceExternalId: { type: string, description: "external_id of the source entity" }
        targetExternalId: { type: string, description: "external_id of the target entity" }
        externalId:       { type: string, description: "external_id of the connection itself" }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertyWriteValue' }

    BatchWriteRequest:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityWrite' }
          maxItems: 500
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionWrite' }
          maxItems: 500
          description: |
            Not supported yet (US-141 AC2): a batch with connections is rejected with 422.
        strategy:
          type: string
          enum: [upsert, create-only, skip-existing]
          default: upsert
          description: |
            `upsert`: create-or-update by externalId; an item without externalId is always created.
            `create-only`: error if the entity already exists.
            `skip-existing`: skip existing ones, only create new ones.
            On update, fields and properties missing in the item stay unchanged;
            an empty property value removes the value.
        atomic:
          type: boolean
          default: false
          description: |
            true → all or nothing (a single DB transaction).
            false → partial success possible; the response contains the status per item.

    BatchWriteItemResult:
      type: object
      required: [index, status]
      properties:
        index:      { type: integer, description: "0-based index in the request array" }
        itemType:   { type: string, enum: [entity, connection] }
        status:
          type: string
          enum: [created, updated, unchanged, skipped, error]
          description: |
            `unchanged`: the entity exists with identical values; no new version is written.
        id:         { type: [integer, 'null'], description: "Internal ID after create/update" }
        externalId: { type: [string, 'null'] }
        error:      { type: [string, 'null'], description: "Error message for status=error" }
        errors:
          type: array
          description: Validation errors of the item (status=error); fields relative to the item
          items: { $ref: '#/components/schemas/ValidationError' }
        warnings:
          type: array
          description: Warnings of the item (e.g. necessity=warning without value, REQ-149)
          items: { $ref: '#/components/schemas/ValidationError' }

    BatchWriteResponse:
      type: object
      required: [strategy, atomic, summary, items]
      properties:
        strategy:  { type: string }
        atomic:    { type: boolean }
        summary:
          type: object
          properties:
            created:   { type: integer }
            updated:   { type: integer }
            unchanged: { type: integer }
            skipped:   { type: integer }
            errors:    { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchWriteItemResult' }

    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:    { type: string, description: "Path to the faulty field (e.g. properties[2].value)" }
        message:  { type: string }
        code:     { type: string, example: "REQUIRED", description: "Machine-readable error code" }

    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid:  { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
        preview:
          type: [object, 'null']
          description: Only for dryRun=true; shows what would be persisted
          properties:
            wouldCreate: { type: integer }
            wouldUpdate: { type: integer }
            wouldSkip:   { type: integer }

    AllowedConnectionResult:
      type: object
      required: [allowed, options]
      properties:
        allowed: { type: boolean }
        options:
          type: array
          items:
            type: object
            required: [connectionMetatype, direction]
            properties:
              connectionMetatype: { $ref: '#/components/schemas/MetatypeSummary' }
              direction:
                type: string
                enum: [source-to-target, target-to-source, bidirectional]

    MetamodelPackage:
      type: object
      required: [formatVersion, exportedAt, packageId, packageVersion, publisher, metatypes, propertyCategories, propertyDefinitions]
      description: |
        Portable metamodel package for import/export (ADR-026). Elements carry stable UUIDs;
        a re-import of the same `packageId` updates its own content (ADR-002, REQ-114).
        In `propertyMappings` only `propertyDefinition.id` is used; the definitions come from
        `propertyDefinitions`.
      properties:
        formatVersion:       { type: string, example: "1.0" }
        packageId:           { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', example: oea-starter-togaf-classic }
        packageVersion:      { type: string, maxLength: 32, example: "1.0.0" }
        publisher:           { type: string, maxLength: 100, example: OEA }
        name:                { type: string, maxLength: 200, description: "Display name of the package" }
        description:         { type: string, maxLength: 2000 }
        exportedAt:          { type: string, format: date-time }
        sourceInstanceId:    { type: [string, 'null'] }
        metatypes:
          type: array
          items: { $ref: '#/components/schemas/MetatypeDetail' }
        propertyCategories:
          type: array
          items: { $ref: '#/components/schemas/PropertyCategory' }
        propertyDefinitions:
          type: array
          items: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        viewpoints:
          type: array
          items: { $ref: '#/components/schemas/ViewpointConfig' }
        shapeAssignments:
          type: array
          items: { $ref: '#/components/schemas/ShapeAssignment' }
        i18nBundles:
          type: object
          description: "Locale → I18nBundle"
          additionalProperties: { $ref: '#/components/schemas/I18nBundle' }

    ShapeAssignment:
      type: object
      required: [viewpointKey, metatypeId, shapeKey]
      properties:
        viewpointKey:  { type: string, description: "Slug of the viewpoint in config.viewpoints[]" }
        metatypeId:    { type: string, format: uuid }
        shapeKey:      { type: string, description: "Icon/shape key in the design system" }
        fillColor:     { type: [string, 'null'] }
        borderColor:   { type: [string, 'null'] }
        iconKey:       { type: [string, 'null'] }

    # ── Service-Accounts (ADR-026) ────────────────────────────────────────────
    ServiceAccount:
      type: object
      required: [id, personId, name, status, createdAt]
      properties:
        id:          { type: string, format: uuid, description: "client_id; stable; = agent_id in the audit log" }
        personId:    { type: integer, description: "persons.id (person_type=service-account)" }
        name:        { type: string }
        description: { type: [string, 'null'] }
        roles:
          type: array
          description: Active authorization roles (IDs) of the service account
          items: { $ref: '#/components/schemas/RoleId' }
        status:      { type: string, enum: [active, inactive], description: "Lifecycle status of the service account (persons.status)" }
        createdAt:   { type: string, format: date-time }
        lastUsedAt:  { type: [string, 'null'], format: date-time }
        rotatedAt:   { type: [string, 'null'], format: date-time }

    ServiceAccountWrite:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }
        roles:
          type: array
          maxItems: 20
          uniqueItems: true
          description: |
            Authorization role IDs. Only roles flagged `assignableToServiceAccounts`
            (built-in: `viewer`, `integration-writer`, `auditor`) are accepted; roles with
            an admin-class permission are never assignable (SoD-4, REQ-176) → `422`.
            Setting or changing roles additionally requires `role:assign`.
          items: { $ref: '#/components/schemas/RoleId' }
          default: ["integration-writer"]

    ServiceAccountCreated:
      allOf:
        - $ref: '#/components/schemas/ServiceAccount'
        - type: object
          required: [clientSecret]
          properties:
            clientSecret:
              type: string
              description: |
                Plaintext secret, returned **only once**.
                Not retrievable after this response (only the hash is stored).
                Store securely — e.g. as a CI/CD secret.

    # ── Audit ─────────────────────────────────────────────────────────────────
    AuditActorType:
      type: string
      enum: [person, service-account, system-admin-account, system, unauthenticated]
      description: Kind of principal that caused the event (ADR-033 §3)

    AuditEventChange:
      type: object
      required: [propertyName, isSystemField, redacted]
      properties:
        propertyDefinitionId:
          type: [string, 'null']
          format: uuid
          description: Property definition (soft reference); visibility is evaluated on it, not on `propertyName`
        propertyName:  { type: string }
        isSystemField: { type: boolean }
        oldValue:      { type: [string, 'null'], description: "`null` if redacted" }
        newValue:      { type: [string, 'null'], description: "`null` if redacted" }
        redacted:
          type: boolean
          default: false
          description: |
            `true` = old and new value withheld. Values of properties that were restricted
            at the time of the event are stored encrypted and decrypted only for callers
            who may read the property under the current visibility configuration
            (ADR-033 §3, REQ-160 AC4).

    AuditEvent:
      type: object
      required: [id, chainSeq, recordHash, eventType, category, severity, outcome, actorType, source, occurredAt]
      description: |
        Audit record (ADR-033). Contains no names or e-mail addresses of OEA users;
        actors are pseudonymous references resolved at read time.
      properties:
        id:          { type: integer, format: int64 }
        chainSeq:    { type: integer, format: int64, description: Position in the audit hash chain }
        recordHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hash of this chain link (hex)
        eventType:
          type: string
          example: "entity.property-changed"
          description: Stable event type name from the event catalog (`docs/audit-event-catalog.md`, follow-up)
        category:
          type: string
          enum: [change, security, access, system]
        severity:
          type: string
          enum: [info, warning, high, critical]
        outcome:
          type: string
          enum: [success, failure, denied]
        occurredAt:  { type: string, format: date-time }
        actorType:   { $ref: '#/components/schemas/AuditActorType' }
        actorRef:
          type: [string, 'null']
          description: |
            Pseudonymous key of the actor: `persons.id` (decimal) for `person` and
            `service-account`, `system_admin_accounts.id` (UUID) for
            `system-admin-account`; `null` for `system` and `unauthenticated`.
        actorDisplayName:
          type: [string, 'null']
          description: |
            Name resolved at read time from the identity tables (caller holds `audit:read`).
            `null` for anonymized persons (REQ-189), `system` and `unauthenticated`.
            Never part of the export.
        agentId:
          type: [string, 'null']
          format: uuid
          description: "`client_id` of the authenticated service account; `null` for persons and the system admin account"
        agentLabel:
          type: [string, 'null']
          maxLength: 100
          description: Untrusted value of the `X-Agent-Id` request header; informational only
        agentRun:    { type: [string, 'null'], description: "Value of `X-Agent-Run`; informational only" }
        source:
          type: string
          enum: [UI, API, Job, Import, CLI]
        sourceIp:    { type: [string, 'null'], description: IPv4 or IPv6 address of the client }
        requestId:   { type: [string, 'null'] }
        targetType:
          type: [string, 'null']
          example: "entity"
          description: Kind of the affected object (entity, person, role, assignment, setting, service-account, …)
        targetId:    { type: [string, 'null'] }
        entityId:    { type: [integer, 'null'] }
        entityName:
          type: [string, 'null']
          description: Denormalized for completeness; `null` for entities of metatype `person`
        details:
          type: [object, 'null']
          additionalProperties: true
          description: Event-type-specific supplementary fields (e.g. role, validity, `sodConflict`)
        changes:
          type: array
          items: { $ref: '#/components/schemas/AuditEventChange' }

    AuditExportRecord:
      type: object
      description: |
        One line of the JSON Lines export (ADR-033 §9): exactly one link of the audit hash
        chain, with all chain fields, so that consumers can check continuity and recompute
        `recordHash` without OEA secrets. The ordered field list per table, the
        `tableTag` values and the canonical serialization are specified in
        `docs/audit-hash-chain.md` (follow-up). Actors are pseudonymous keys; restricted
        values are exported as ciphertext (base64) with `keyId`; no names, no e-mail
        addresses, no decrypted values.
      required: [chainSeq, hashVersion, prevHash, recordHash, table, fields]
      properties:
        chainSeq:    { type: integer, format: int64 }
        hashVersion: { type: integer, minimum: 1 }
        prevHash:    { type: string, pattern: '^[0-9a-f]{64}$' }
        recordHash:  { type: string, pattern: '^[0-9a-f]{64}$' }
        table:
          type: string
          enum: [events, event_changes, retention_settings]
        fields:
          type: object
          additionalProperties: true
          description: Column values of the link as hashed (`hash_version` field list)
        checkpointSignature:
          type: [string, 'null']
          description: Ed25519 signature (base64) for `audit.checkpoint` links, if a signing key is configured

    AuditCheckpoint:
      type: object
      required: [chainSeq, recordHash, createdAt]
      properties:
        chainSeq:   { type: integer, format: int64 }
        recordHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt:  { type: string, format: date-time }
        signature:  { type: [string, 'null'], description: Ed25519 signature (base64); `null` if unsigned }

    AuditIntegrityStatus:
      type: object
      required: [status, headSeq]
      description: Result of the latest chain verification (ADR-033 §5) and the latest checkpoint
      properties:
        status:
          type: string
          enum: [verified, violation, not-yet-verified]
        headSeq:          { type: integer, format: int64, description: Highest `chainSeq` in the database }
        verifiedAt:       { type: [string, 'null'], format: date-time }
        verifiedFromSeq:  { type: [integer, 'null'], format: int64, description: Start of the verified range (purge anchor or genesis) }
        verifiedToSeq:    { type: [integer, 'null'], format: int64 }
        firstBrokenLink:
          type: [object, 'null']
          description: Present only for `violation`
          required: [chainSeq, table]
          properties:
            chainSeq:     { type: integer, format: int64 }
            table:        { type: string, enum: [events, event_changes, retention_settings] }
            expectedHash: { type: [string, 'null'] }
            actualHash:   { type: [string, 'null'] }
            reason:       { type: string, enum: [hash-mismatch, sequence-gap, prev-hash-mismatch] }
        purgeAnchor:
          type: [object, 'null']
          description: Last link deleted by the retention purge; verification starts after it
          properties:
            chainSeq:   { type: integer, format: int64 }
            recordHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        latestCheckpoint:
          oneOf:
            - $ref: '#/components/schemas/AuditCheckpoint'
            - type: 'null'

    AuditRetentionValue:
      type: object
      required: [retentionDays, effectiveFrom, recordedAt]
      properties:
        retentionDays: { type: integer, minimum: 365 }
        effectiveFrom: { type: string, format: date-time }
        recordedAt:    { type: string, format: date-time }
        recordedByType: { $ref: '#/components/schemas/AuditActorType' }
        recordedByRef:  { type: [string, 'null'], description: Pseudonymous actor key as in `AuditEvent.actorRef` }

    AuditRetention:
      type: object
      required: [floorDays, inForce]
      description: |
        Audit retention (ADR-033 §4); stored as an append-only series. A reduction takes
        effect 30 days after it is recorded; an increase takes effect immediately and
        cancels a pending reduction (ADR-037 §6).
      properties:
        floorDays:
          type: integer
          const: 365
          description: Fixed floor, not configurable (owner decision Q10)
        inForce: { $ref: '#/components/schemas/AuditRetentionValue' }
        pending:
          description: A recorded reduction that is not yet effective (`effectiveFrom` = recording + 30 days)
          oneOf:
            - $ref: '#/components/schemas/AuditRetentionValue'
            - type: 'null'

    AuditRetentionWrite:
      type: object
      required: [retentionDays]
      properties:
        retentionDays:
          type: integer
          minimum: 365
          description: Days; values below 365 are rejected with `422`. Default of a new installation is 2555 (7 years).

    # ── Analytics (ADR-034) ─────────────────────────────────────────────────
    AnalyticsQueryRequest:
      type: object
      required: [language, query]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [sql]
          description: Only `sql` in v1; other values (e.g. `cypher`) are rejected with `400`
        query:
          type: string
          minLength: 1
          maxLength: 20000
          description: Exactly one `SELECT` statement over views of the schema `reporting`; longer text → `413`
        parameters:
          type: array
          maxItems: 50
          description: Values bound to `$1` … `$n`, in order
          items:
            type: [string, number, integer, boolean, 'null']
        maxRows:
          type: integer
          minimum: 1
          maximum: 100000
          description: Lowers the instance row limit for this request; higher values are capped
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Lowers the instance statement timeout for this request; higher values are capped

    AnalyticsColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: PostgreSQL type name of the result column, example: "text" }

    AnalyticsQueryResult:
      type: object
      required: [columns, rows, rowCount, truncated, durationMs, requestId]
      properties:
        columns:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsColumn' }
        rows:
          type: array
          description: Result rows; each row is an array in the order of `columns`. Restricted values are `null`.
          items:
            type: array
            items: {}
        rowCount:   { type: integer }
        truncated:  { type: boolean }
        truncatedReason:
          type: [string, 'null']
          enum: [rows, size, null]
        durationMs: { type: integer }
        requestId:  { type: string }

    AnalyticsProblem:
      description: Problem details of a rejected or failed analytics query (no internal object names, no raw database messages)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reasonCode:
              type: string
              enum: [V1, V2, V3, V4, V5, V6, V7, syntax-error, timeout, execution-error, too-many-columns]
              description: Validation rule (ADR-034 §4) or execution failure
            position:
              type: [integer, 'null']
              description: Character position in the query text, if applicable
            requestId: { type: string }

    AnalyticsSchema:
      type: object
      required: [views]
      description: Reporting schema introspection for the caller (same content as `reporting.columns`)
      properties:
        views:
          type: array
          items:
            type: object
            required: [name, generated, columns]
            properties:
              name:        { type: string, example: "entities" }
              description: { type: [string, 'null'] }
              generated:
                type: boolean
                description: "`true` for generated per-metatype views (`reporting.<metatype>`)"
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, readable]
                  properties:
                    name:     { type: string }
                    type:     { type: string }
                    readable:
                      type: boolean
                      description: "`false` = values of this column are always masked for the caller"

    AnalyticsSettings:
      type: object
      description: Instance settings `analytics.*` (ADR-034 §5, §7)
      properties:
        enabled:
          type: boolean
          default: false
          description: Raw analytics enabled; requires provisioned `oea_analytics` credentials
        statementTimeoutSeconds: { type: integer, minimum: 1, maximum: 120, default: 30 }
        maxRows:                 { type: integer, minimum: 1, maximum: 100000, default: 10000 }
        maxResultBytes:          { type: integer, minimum: 1, default: 10485760 }
        maxConcurrentPerPrincipal: { type: integer, minimum: 1, default: 2 }
        queriesPerMinute:        { type: integer, minimum: 1, default: 30 }
        poolSize:
          type: integer
          minimum: 1
          default: 4
          description: Size of the separate analytics connection pool; takes effect after restart

    # ── Admin – Viewpoints ────────────────────────────────────────────────────
    ViewpointConfig:
      type: object
      required: [id, name]
      properties:
        id:               { type: string }
        name:             { type: string }
        description:      { type: string }
        allowedMetatypes:
          type: array
          items: { $ref: '#/components/schemas/MetatypeSummary' }
        allowedRelations:
          type: array
          items: { $ref: '#/components/schemas/MetatypeSummary' }

    # ── Admin – Property visibility (REQ-124, REQ-128, REQ-161) ───────────────
    PropertyVisibility:
      type: object
      required: [visibilityMode, readRoles, writeRoles]
      description: |
        Visibility configuration of a property definition (REQ-124). Role lists contain
        authorization role IDs (ADR-032 §5); business roles of the EA model are never used.
        - `public`: readable for every principal that can read the object
        - `role-restricted`: readable only with a role in `readRoles`, writable only with
          a role in `writeRoles` (`writeRoles` ⊆ `readRoles`; `readRoles` not empty)
        - `connection-scoped`: readable/writable only with a path to the entity via
          `scopingConnectionType` from the caller's linked Person entity (REQ-127)
      properties:
        visibilityMode:
          type: string
          enum: [public, role-restricted, connection-scoped]
          default: public
        readRoles:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []
        writeRoles:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []
        scopingConnectionType:
          type: [string, 'null']
          format: uuid
          description: Connection metatype ID; mandatory for `connection-scoped`

    PropertyVisibilityEntry:
      description: Visibility configuration of one property definition (SCR-032)
      allOf:
        - type: object
          required: [propertyDefId]
          properties:
            propertyDefId: { type: string, format: uuid }
            propertyName:  { type: string, readOnly: true }
            label:         { type: string, readOnly: true, description: "Translated label (session locale)" }
        - $ref: '#/components/schemas/PropertyVisibility'

    PropertyVisibilityOverride:
      type: object
      required: [roles]
      description: |
        Roles whose holders read all properties of objects they can already read,
        regardless of `visibilityMode` (REQ-128). Empty by default (owner decision Q14).
        Every change is audited (`visibility.override-changed`); a change that adds a
        role the acting principal holds is flagged as self-benefiting (SoD-6).
      properties:
        roles:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []

    # ── Access control (ADR-032, UC-23) ───────────────────────────────────────
    PermissionId:
      type: string
      pattern: '^[a-z][a-z-]*:[a-z][a-z-]*$'
      maxLength: 64
      description: Identifier from the permission catalog `x-oea-permissions`
      example: "entity:write"

    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9-]{1,62}$'
      description: Stable identifier of an authorization role (built-in or custom); immutable
      example: "enterprise-architect"

    Permission:
      type: object
      required: [id, category, adminClass, description]
      properties:
        id:          { $ref: '#/components/schemas/PermissionId' }
        category:    { type: string, description: "Resource part of the identifier", example: "entity" }
        adminClass:  { type: boolean, description: "A role containing it is privileged (MFA, REQ-171) and never assignable to service accounts" }
        description: { type: string }

    RoleRef:
      type: object
      required: [id, name, privileged]
      properties:
        id:         { $ref: '#/components/schemas/RoleId' }
        name:       { type: string }
        privileged: { type: boolean }

    PrincipalRef:
      type: object
      required: [principalType, displayName]
      properties:
        principalType:
          type: string
          enum: [person, service-account, system-admin-account]
        id:
          type: [integer, 'null']
          description: "`persons.id`; `null` for the local system admin account"
        displayName: { type: string }

    AuthorizationRole:
      type: object
      required: [id, name, isBuiltin, privileged, assignableToServiceAccounts, overridesPropertyVisibility, permissions]
      description: |
        Authorization role (ADR-032 §4/§5). Not related to business roles of the EA model.
        The list of all roles with their permissions is the permission matrix (REQ-157 AC1).
      properties:
        id:          { $ref: '#/components/schemas/RoleId' }
        name:        { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        isBuiltin:
          type: boolean
          description: Built-in roles cannot be changed or deleted (SoD-5)
        privileged:
          type: boolean
          readOnly: true
          description: Derived; `true` if the role contains an admin-class permission
        assignableToServiceAccounts: { type: boolean }
        overridesPropertyVisibility:
          type: boolean
          readOnly: true
          description: Derived from the override role list (`/admin/property-visibility/override-roles`)
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionId' }
        usage:
          type: object
          readOnly: true
          description: References that prevent deletion
          properties:
            activeAssignments:            { type: integer }
            idpGroupMappings:             { type: integer }
            propertyVisibilityReferences: { type: integer }

    AuthorizationRoleWrite:
      type: object
      required: [name, permissions]
      description: |
        Custom role definition. Rejected with `422` if a permission is unknown, if
        `metamodel:write` is combined with `visibility:configure` or
        `visibility-scope:assign` (SoD-2), or if `assignableToServiceAccounts` is set
        for a role with an admin-class permission (SoD-4). Changing the permission set
        of a role the caller holds is rejected with `403` (SoD-1).
      properties:
        name:        { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        permissions:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionId' }
          description: Explicit list; an empty list grants no permissions (REQ-157 AC3)
        assignableToServiceAccounts: { type: boolean, default: false }

    AuthorizationRoleCreate:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/RoleId' }
        - $ref: '#/components/schemas/AuthorizationRoleWrite'

    RoleAssignment:
      type: object
      required: [id, personId, role, source, status, validFrom, grantedBy, grantedAt, sodConflict]
      description: |
        Local role assignment (ADR-032 §7). Never hard-deleted; revocation sets
        `revokedAt`/`revokedBy`.
      properties:
        id:          { type: string, format: uuid }
        personId:    { type: integer }
        role:        { $ref: '#/components/schemas/RoleRef' }
        source:      { type: string, enum: [local] }
        status:
          type: string
          enum: [scheduled, active, expired, revoked]
          description: "`scheduled` = `validFrom` in the future; assignments to `invited` persons become effective when the person is `active`"
        validFrom:   { type: string, format: date-time }
        validTo:     { type: [string, 'null'], format: date-time }
        reason:      { type: [string, 'null'] }
        grantedBy:   { $ref: '#/components/schemas/PrincipalRef' }
        grantedAt:   { type: string, format: date-time }
        approvedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          description: Second administrator if the assignment went through four-eyes approval
        revokedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        revokedAt:   { type: [string, 'null'], format: date-time }
        sodConflict:
          type: boolean
          description: The person's roles combine `metamodel:write` with visibility permissions (SoD-3)

    RoleAssignmentWrite:
      type: object
      required: [roleId]
      properties:
        roleId:    { $ref: '#/components/schemas/RoleId' }
        validFrom: { type: string, format: date-time, description: "Default: now" }
        validTo:   { type: [string, 'null'], format: date-time, description: "Optional end of a time-boxed assignment" }
        reason:    { type: [string, 'null'], maxLength: 500, example: "Ticket SEC-1234" }
        acknowledgeSodConflict:
          type: boolean
          default: false
          description: |
            Must be `true` if the assignment combines `metamodel:write` with visibility
            permissions for the person (SoD-3); otherwise the request is rejected with
            `409` so that the client can show the warning first.

    RoleAssignmentRevoke:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }

    ApprovalRequest:
      type: object
      required: [id, kind, status, requestedBy, requestedAt, sodConflict]
      description: |
        Privileged change awaiting four-eyes approval (setting `privilegedAssignmentApproval`,
        owner decisions Q15/Q18). Kinds: assignment of a privileged role to a person
        (`role-assignment`), IdP group mapping to a privileged role (`idp-group-mapping`),
        and adding an admin-class permission to a custom role (`role-permission`).
      properties:
        id:          { type: string, format: uuid }
        kind:        { type: string, enum: [role-assignment, idp-group-mapping, role-permission] }
        person:
          description: Assignee (kind `role-assignment` only)
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        role:        { $ref: '#/components/schemas/RoleRef' }
        idpGroupMappingId:
          type: [string, 'null']
          format: uuid
          description: Pending mapping (kind `idp-group-mapping` only)
        permission:
          type: [string, 'null']
          description: Admin-class permission to be added to `role` (kind `role-permission` only)
        status:      { type: string, enum: [pending, approved, rejected, expired] }
        validFrom:   { type: [string, 'null'], format: date-time }
        validTo:     { type: [string, 'null'], format: date-time }
        reason:      { type: [string, 'null'] }
        requestedBy: { $ref: '#/components/schemas/PrincipalRef' }
        requestedAt: { type: string, format: date-time }
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        decidedAt:      { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        assignmentId:
          type: [string, 'null']
          format: uuid
          description: Resulting assignment after approval (kind `role-assignment`)
        sodConflict: { type: boolean }

    ApprovalDecision:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }

    IdpGroupMapping:
      type: object
      required: [id, authProviderId, issuer, groupIdentifier, roleId, active, createdBy, createdAt]
      description: |
        Binds an immutable, provider-controlled group identifier of one issuer to an
        authorization role (ADR-032 §7, REQ-167). Group claims are re-evaluated at login
        and at every token refresh, at the latest every 15 minutes (owner decision Q16);
        a missing or truncated groups claim yields no IdP-derived roles.
      properties:
        id:              { type: string, format: uuid }
        authProviderId:  { type: string, format: uuid }
        issuer:          { type: string, readOnly: true, description: "Issuer of the provider; claims of other issuers are ignored" }
        groupIdentifier: { type: string, description: "Entra ID group object ID or app role ID, Authentik group UUID; never a display name" }
        roleId:          { $ref: '#/components/schemas/RoleId' }
        active:          { type: boolean }
        createdBy:       { $ref: '#/components/schemas/PrincipalRef' }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: [string, 'null'], format: date-time }
        lastMatchedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            Last time the mapping granted its role effectively in a login or re-evaluation
            (recorded at most once per hour); `null` if it never did (US-018, SoD-7)
        warnings:
          type: array
          readOnly: true
          description: |
            Empty except in the responses of create and update; never blocks the change (US-018).
            `group-not-seen`: the mapping targets `system-admin`, has never matched, and no
            current session of its provider carries the group – it grants access to nobody known.
          items: { $ref: '#/components/schemas/MappingWarning' }

    MappingWarning:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, enum: [group-not-seen] }
        message: { type: string }

    SystemAdminAccountState:
      type: object
      required: [loginName, status, createdAt]
      description: Local system admin account (business object system-admin-account)
      properties:
        loginName:     { type: string }
        status:        { type: string, enum: [bootstrapped, active, deactivated] }
        createdAt:     { type: string, format: date-time }
        firstLoginAt:  { type: [string, 'null'], format: date-time }
        lastUsedAt:    { type: [string, 'null'], format: date-time }
        deactivatedAt: { type: [string, 'null'], format: date-time }

    IdpGroupMappingWrite:
      type: object
      required: [authProviderId, groupIdentifier, roleId]
      description: |
        Rejected with `422` if `groupIdentifier` does not match the identifier format of
        the provider (REQ-167) and with `403` (problem property `reason: self-administration`)
        if the group is contained in the groups claim of the caller's own current session (SoD-1).
      properties:
        authProviderId:  { type: string, format: uuid }
        groupIdentifier: { type: string, minLength: 1, maxLength: 256 }
        roleId:          { $ref: '#/components/schemas/RoleId' }
        active:          { type: boolean, default: true }

    PersonEntityLink:
      type: object
      required: [entityId]
      description: |
        Account link from a person to the Person entity of the EA model, used for
        connection-scoped visibility (REQ-127). `null` removes the link.
      properties:
        entityId: { type: [integer, 'null'] }

    PersonEntityLinkResult:
      type: object
      required: [personId, entityId]
      properties:
        personId:   { type: integer }
        entityId:   { type: [integer, 'null'] }
        entityName: { type: [string, 'null'] }
        linkedBy:   { $ref: '#/components/schemas/PrincipalRef' }
        linkedAt:   { type: string, format: date-time }

    RoleGrant:
      type: object
      required: [role, source]
      description: One role held by a principal and where it comes from
      properties:
        role:   { $ref: '#/components/schemas/RoleRef' }
        source:
          type: string
          enum: [local, idp, system-admin-account]
        assignmentId:    { type: [string, 'null'], format: uuid, description: "For `local`" }
        mappingId:       { type: [string, 'null'], format: uuid, description: "For `idp`" }
        groupIdentifier: { type: [string, 'null'], description: "For `idp`" }
        validFrom:       { type: [string, 'null'], format: date-time }
        validTo:         { type: [string, 'null'], format: date-time }
        grantedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        grantedAt:       { type: [string, 'null'], format: date-time }

    AccessReviewEntry:
      type: object
      required: [principal, roles, privileged, sodConflict]
      properties:
        principal: { $ref: '#/components/schemas/PrincipalRef' }
        status:
          type: [string, 'null']
          enum: [invited, active, inactive, offboarded, null]
          description: Lifecycle status of the person or service account
        lastLoginAt: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          description: Current local assignments, IdP-derived roles of the last login and the system admin account
          items: { $ref: '#/components/schemas/RoleGrant' }
        privileged:  { type: boolean }
        mfaEnrolled: { type: [boolean, 'null'] }
        sodConflict: { type: boolean }
        pendingRequests:     { type: integer, description: "Pending four-eyes requests for this principal" }
        secretExpiresAt:     { type: [string, 'null'], format: date-time, description: "Service accounts only" }

    AccessReview:
      type: object
      required: [generatedAt, items, page]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessReviewEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }

    EffectivePermission:
      type: object
      required: [permission, grantedBy]
      properties:
        permission: { $ref: '#/components/schemas/PermissionId' }
        grantedBy:
          type: array
          items:
            type: object
            required: [roleId, source]
            properties:
              roleId: { $ref: '#/components/schemas/RoleId' }
              source: { type: string, enum: [local, idp, system-admin-account] }

    LocalLoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName: { type: string, maxLength: 64 }
        password:  { type: string, format: password, maxLength: 128 }

    LocalLoginTotpRequest:
      type: object
      required: [loginTransaction, code]
      properties:
        loginTransaction: { type: string, maxLength: 128 }
        code:             { type: string, pattern: '^[0-9]{6}$' }

    LoginProvider:
      type: object
      required: [id, name]
      description: An enabled OIDC provider as offered on the login page
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    LoginResult:
      type: object
      required: [principal, mfaSatisfied, csrfToken]
      properties:
        principal:    { $ref: '#/components/schemas/PrincipalRef' }
        mfaSatisfied: { type: boolean }
        csrfToken:    { type: string, description: "Value for the `X-XSRF-TOKEN` header" }
        requiredAction: { $ref: '#/components/schemas/RequiredAction' }

    RequiredAction:
      type: [string, 'null']
      enum: [change-password, enroll-second-factor, null]
      description: |
        `change-password`: the session was created with a temporary or expired password; only
        `GET /me`, the logout, `POST /me/password` and `POST /me/password/suggestion` are
        allowed until the password is changed (REQ-173 AC2, REQ-028 AC2)
        `enroll-second-factor`: the enforcement of a second factor is on and the person has none
        (US-031 AC2); only `GET /me`, the logout, `GET /me/second-factors` and the TOTP and
        passkey enrollment are allowed until a second factor is confirmed

    InitialPassword:
      type: object
      description: "Exactly one of `password` and `generate: true`; otherwise `422`"
      properties:
        password: { type: string, writeOnly: true, description: "Must satisfy the password policy; otherwise `422` with problem type `urn:oea:problem:password-policy-violation`" }
        generate: { type: boolean, default: false, description: "`true`: the system generates a password that satisfies the policy and returns it once (REQ-027)" }

    InitialPasswordResult:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time, description: The initial password must be used and changed before this time }
        password:  { type: string, description: "Only for `generate: true`; returned this once and never again" }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128, writeOnly: true }
        newPassword:     { type: string, writeOnly: true, description: "Must satisfy the password policy including its history and differ from the current password; otherwise `422`" }

    PasswordSuggestion:
      type: object
      required: [password]
      properties:
        password: { type: string, description: A generated password that satisfies the password policy; not stored }

    PasswordReset:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Recorded in the audit event }

    GeneratedPassword:
      type: object
      required: [password, expiresAt]
      properties:
        password:  { type: string, description: The generated temporary password; returned this once and never again }
        expiresAt: { type: string, format: date-time, description: The temporary password must be used and changed before this time }

    PasswordPolicy:
      type: object
      description: |
        Password policy for local passwords (REQ-028, US-027). The effective value of every rule
        is the stricter of the stored value and the operator floor in `floors`
        (`oea.auth.password-policy.*`). Special characters are all printable ASCII characters
        that are neither letters nor digits.
      required: [minLength, requireUppercase, requireLowercase, requireDigits, requireSpecialChars,
        expiryDays, historyCount, personPasswordLogin]
      properties:
        minLength:           { type: integer, minimum: 12, maximum: 128, description: Must not be below the floor and not below the number of required character types }
        requireUppercase:    { type: boolean }
        requireLowercase:    { type: boolean }
        requireDigits:       { type: boolean }
        requireSpecialChars: { type: boolean }
        expiryDays:          { type: integer, minimum: 0, maximum: 3650, description: "Days after which a self-set password must be changed at the next login; `0` = no expiry" }
        historyCount:        { type: integer, minimum: 0, maximum: 24, description: "Number of previous passwords, including the current one, that must not be reused" }
        personPasswordLogin:
          type: boolean
          description: |
            Password login of persons (US-011). Effective only while the operator permits it
            (`personPasswordLoginPermitted`); it cannot be switched on without that permission.
        personPasswordLoginPermitted: { type: boolean, readOnly: true, description: "Operator setting `oea.auth.person-password.enabled`" }
        floors: { $ref: '#/components/schemas/PasswordPolicyFloors' }

    SecondFactorPolicy:
      type: object
      description: |
        Enforcement of a second factor at the password login of persons (US-031, US-028, REQ-020,
        REQ-029). IdP logins and the system admin account are not covered.
      required: [enforced, exemptRoles]
      properties:
        enforced:
          type: boolean
          description: |
            A person without second factor who is not exempt must enroll one after the password
            login (required action `enroll-second-factor`). Cannot be `false` while
            `enforcedByOperator` is `true`.
        exemptRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleId' }
          description: |
            Roles that need no second factor. A person is exempt only if they hold at least one
            role through a local role assignment and every such role is exempt. A role with an
            admin-class permission cannot be exempt.
        enforcedByOperator: { type: boolean, readOnly: true, description: "Operator setting `oea.auth.second-factor.enforced`" }

    PasswordPolicyFloors:
      type: object
      readOnly: true
      description: Floors set by the operator (`oea.auth.password-policy.*`); the stored policy cannot go below them
      required: [minLength, requireUppercase, requireLowercase, requireDigits, requireSpecialChars,
        maxExpiryDays, minHistoryCount]
      properties:
        minLength:           { type: integer }
        requireUppercase:    { type: boolean }
        requireLowercase:    { type: boolean }
        requireDigits:       { type: boolean }
        requireSpecialChars: { type: boolean }
        maxExpiryDays:       { type: integer, description: "Ceiling of the expiry in days; `0` = no ceiling" }
        minHistoryCount:     { type: integer }

    LoginProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            loginTransaction:
              type: string
              description: "Only with `second-factor-required`: opaque, valid 5 minutes"
            secondFactors:
              type: array
              items: { type: string, enum: [totp, passkey] }
              description: "Only with `second-factor-required`: the methods that complete the login transaction"

    WebAuthnJson:
      type: object
      additionalProperties: true
      description: |
        An object of the WebAuthn Level 3 JSON encoding (binary values as Base64URL), passed
        to or taken from the browser unchanged, for example
        `PublicKeyCredentialCreationOptionsJSON` or `RegistrationResponseJSON` (ADR-048).

    PasskeyRegistrationStart:
      type: object
      properties:
        label: { type: string, maxLength: 64 }

    PasskeyRegistration:
      type: object
      required: [registrationId, options, expiresAt]
      properties:
        registrationId: { type: string, format: uuid }
        options:        { $ref: '#/components/schemas/WebAuthnJson' }
        expiresAt:      { type: string, format: date-time }

    PasskeyChallenge:
      type: object
      required: [challengeId, options]
      properties:
        challengeId: { type: string, format: uuid }
        options:     { $ref: '#/components/schemas/WebAuthnJson' }

    PasskeyLoginRequest:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { type: string, format: uuid }
        credential:  { $ref: '#/components/schemas/WebAuthnJson' }

    LocalLoginPasskeyOptionsRequest:
      type: object
      required: [loginTransaction]
      properties:
        loginTransaction: { type: string, maxLength: 128 }

    LocalLoginPasskeyRequest:
      type: object
      required: [loginTransaction, challengeId, credential]
      properties:
        loginTransaction: { type: string, maxLength: 128 }
        challengeId:      { type: string, format: uuid }
        credential:       { $ref: '#/components/schemas/WebAuthnJson' }

    TotpEnrollmentRequest:
      type: object
      properties:
        label: { type: string, maxLength: 64 }

    TotpEnrollment:
      type: object
      required: [credentialId, secret, otpauthUri, expiresAt]
      description: Shown once; the secret is never returned again (REQ-188)
      properties:
        credentialId: { type: string, format: uuid }
        secret:       { type: string, description: Base32 secret for manual entry }
        otpauthUri:   { type: string, description: "`otpauth://totp/…` for QR codes rendered by the client" }
        expiresAt:    { type: string, format: date-time }

    TotpConfirmation:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    SecondFactor:
      type: object
      required: [credentialId, type, createdAt]
      properties:
        credentialId: { type: string, format: uuid }
        type:         { type: string, enum: [totp, passkey] }
        label:        { type: [string, 'null'] }
        createdAt:    { type: string, format: date-time }
        lastUsedAt:   { type: [string, 'null'], format: date-time }

    SecondFactorReset:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Recorded in the audit event }

    SecondFactorResetResult:
      type: object
      required: [credentialsRevoked]
      properties:
        credentialsRevoked: { type: integer, description: Number of revoked second factors }

    Person:
      type: object
      required: [id, personType, name, status, createdAt]
      properties:
        id:         { type: integer }
        personType: { type: string, enum: [human, service-account] }
        name:       { type: string }
        email:      { type: [string, 'null'], format: email }
        status:     { type: string, enum: [invited, active, inactive, offboarded] }
        createdAt:  { type: string, format: date-time }

    PersonWrite:
      type: object
      required: [name, email]
      properties:
        name:  { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }

    PersonStatusChange:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive, offboarded] }
        reason: { type: [string, 'null'], maxLength: 500, example: "Left the company" }

    PersonIdentity:
      type: object
      required: [id, authProviderId, issuer, subject, linkMethod, linkedAt]
      properties:
        id:             { type: string, format: uuid }
        authProviderId: { type: string, format: uuid }
        issuer:         { type: string }
        subject:        { type: string }
        linkMethod:     { type: string, enum: [admin-entered, email-match] }
        linkedAt:       { type: string, format: date-time }
        lastLoginAt:    { type: [string, 'null'], format: date-time }

    PersonIdentityWrite:
      type: object
      required: [authProviderId, subject]
      properties:
        authProviderId: { type: string, format: uuid }
        subject:        { type: string, minLength: 1, maxLength: 255, description: "Immutable `sub` of the provider (Entra ID: `oid`)" }

    Me:
      type: object
      required: [principal, mfaSatisfied, roles, permissions]
      description: |
        The caller and its effective permissions, resolved server-side at request time.
        Clients use it only to hide or disable UI elements (ADR-032 §9).
      properties:
        principal: { $ref: '#/components/schemas/PrincipalRef' }
        email:     { type: [string, 'null'] }
        mfaSatisfied:
          type: boolean
          description: The session was established with a second factor (SoD-8)
        requiredAction: { $ref: '#/components/schemas/RequiredAction' }
        roles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RoleGrant'
              - type: object
                required: [effective]
                properties:
                  effective: { type: boolean }
                  notEffectiveReason:
                    type: [string, 'null']
                    enum: [mfa-required, not-yet-valid, person-not-active, null]
        permissions:
          type: array
          description: Union of the permissions of all effective roles, with their sources
          items: { $ref: '#/components/schemas/EffectivePermission' }
        csrfToken:
          type: [string, 'null']
          description: "Web sessions: value for the `X-XSRF-TOKEN` header (REQ-187)"

    # ── Event stream payloads (`GET /events/stream`) ─────────────────────────
    SessionEndedEvent:
      type: object
      required: [type, reason, purgeLocalData]
      description: Last event of a stream before the server closes it (ADR-035 §8, REQ-164)
      properties:
        type:   { type: string, const: session_ended }
        reason:
          type: string
          enum: [logout, revoked, refresh-reuse, idle-timeout, lifetime-expired]
          description: "`revoked` covers lifecycle changes, credential or password resets and revoked role assignments"
        purgeLocalData: { type: boolean, description: "Always `true`: the client must clear its offline cache" }

    AccessChangedEvent:
      type: object
      required: [type, purgeLocalData]
      description: Effective roles or permissions of the caller changed; re-read `GET /me` and re-synchronize
      properties:
        type: { type: string, const: access_changed }
        purgeLocalData:
          type: boolean
          description: "`true` if the caller holds no effective role any more"

    # ── OAuth2 token endpoint (REQ-176) ───────────────────────────────────────
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [client_credentials] }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type:   { type: string, enum: [Bearer] }
        expires_in:   { type: integer, maximum: 900 }

    OAuthError:
      type: object
      required: [error]
      description: RFC 6749 §5.2 error response
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type]
        error_description: { type: string }

    # ── Admin – TRM ───────────────────────────────────────────────────────────
    TRMEntry:
      type: object
      required: [id, name, category, status]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        category:    { type: string }
        status:
          type: string
          enum: [approved, tolerated, prohibited, under-evaluation]
        version:     { type: [string, 'null'] }
        validUntil:  { type: [string, 'null'], format: date }
        notes:       { type: [string, 'null'] }

    TRMEntryWrite:
      type: object
      required: [name, category, status]
      properties:
        name:       { type: string }
        category:   { type: string }
        status:
          type: string
          enum: [approved, tolerated, prohibited, under-evaluation]
        version:    { type: string }
        validUntil: { type: string, format: date }
        notes:      { type: string }

    # ── Admin – Conformance ────────────────────────────────────────────────────
    ConformanceViolation:
      type: object
      required: [entityId, entityName, ruleId, severity, message]
      properties:
        entityId:   { type: integer }
        entityName: { type: string }
        metatype:   { $ref: '#/components/schemas/MetatypeSummary' }
        ruleId:     { type: string }
        severity:
          type: string
          enum: [critical, high, medium, info]
        message:    { type: string }
        propertyName: { type: [string, 'null'] }

    ConformanceResult:
      type: object
      required: [checkedAt, totalEntities, violationCount, violations]
      properties:
        checkedAt:      { type: string, format: date-time }
        totalEntities:  { type: integer }
        violationCount: { type: integer }
        violations:
          type: array
          items: { $ref: '#/components/schemas/ConformanceViolation' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── Admin – Auth-Provider ─────────────────────────────────────────────────
    AuthProvider:
      type: object
      required: [id, name, type, enabled]
      description: |
        A stored identity provider. The stored, enabled providers are the only source of the
        OIDC login (owner decision 2026-10-15); outside the profile `dev` the issuer must use
        `https` and must not be a loopback address, which is also checked at startup
        (ADR-036 G2/G3). The redirect URI to register at the provider is
        `<public URL>/api/v1/auth/oidc/callback`.
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        type:
          type: string
          enum: [oidc, local]
        enabled:   { type: boolean }
        vendor:
          type: string
          enum: [entra-id, authentik, generic-oidc]
        issuerUrl: { type: [string, 'null'] }
        clientId:  { type: [string, 'null'] }
        scopes:    { type: [string, 'null'] }
        clientSecretSet: { type: boolean, description: "Whether a client secret is stored; the secret is never returned (REQ-188)" }

    AuthProviderWrite:
      type: object
      required: [name, type]
      properties:
        name:         { type: string }
        type:
          type: string
          enum: [oidc, local]
        enabled:      { type: boolean, default: true }
        vendor:
          type: string
          enum: [entra-id, authentik, generic-oidc]
          default: generic-oidc
        issuerUrl:    { type: string, description: "Outside the profile dev `https` and no loopback address (ADR-036 G2/G3)" }
        clientId:     { type: string }
        clientSecret: { type: string, description: "Write-only; never returned in responses" }
        scopes:       { type: string, example: "openid profile email", description: "Must include `openid`; Entra ID needs `offline_access` for the refresh token used by the 15-minute group re-evaluation (REQ-165)" }
        claimMappings:
          type: object
          additionalProperties: { type: string }

    AuthProviderTestResult:
      type: object
      required: [success, steps]
      properties:
        success: { type: boolean }
        steps:
          type: array
          items:
            type: object
            properties:
              step:    { type: string }
              status:  { type: string, enum: [ok, error, skipped] }
              message: { type: [string, 'null'] }

    # ── Admin – System settings ──────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN] }

    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean, description: "true until the local bootstrapping has completed" }

    SetupRequest:
      type: object
      required: [setupToken, loginName, password, instanceSlug]
      properties:
        setupToken:
          type: string
          minLength: 1
          maxLength: 128
          description: One-time setup token from the container file (REQ-017)
        loginName:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,63}$'
          description: Login name of the local system admin account
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Password of the system admin account, stored only as argon2id hash (REQ-169)
        instanceSlug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          description: Instance part of external URNs `urn:oea:{instance-slug}:{id}`; immutable afterwards (ADR-001)

    SetupResult:
      type: object
      required: [loginName, instanceSlug]
      properties:
        loginName:    { type: string }
        instanceSlug: { type: string }

    SetupValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [invalidFields]
          properties:
            invalidFields:
              type: array
              items: { type: string, enum: [loginName, password, instanceSlug] }

    ClientCompatibility:
      type: object
      required: [clientUpdateMode, minClientVersion, apiVersion]
      properties:
        clientUpdateMode: { type: string, enum: [public, server, managed] }
        minClientVersion: { type: string, description: "Semantic version; older clients refuse to connect" }
        recommendedClientVersion: { type: [string, 'null'], description: "Older clients show a non-blocking notice" }
        apiVersion: { type: string }
        updateFeedUrl:
          type: [string, 'null']
          format: uri
          description: Update metadata URL on this server (mode `server` only)

    SystemSettings:
      type: object
      description: |
        Generic instance settings. The audit retention is not part of them; it is changed
        only through `/admin/audit/retention` (ADR-033 §4).
      properties:
        instanceName:       { type: string }
        defaultLocale:      { type: string, enum: [de, en, fr, it] }
        sessionTimeoutMin:  { type: integer }
        maxUploadMb:        { type: integer }
        privilegedAssignmentApproval:
          type: boolean
          default: false
          description: |
            Four-eyes approval for privileged changes (owner decisions Q15, Q18): assignments
            of privileged roles, IdP group mappings to privileged roles, and adding an
            admin-class permission to a custom role. When `true`, such changes stay pending
            (`202` with an `ApprovalRequest`) until a second principal with `role:assign`, who
            is neither the requester nor the assignee, approves them.
        allowReactivationOfOffboarded:
          type: boolean
          default: false
          description: |
            Whether persons in status `offboarded` may be reactivated (owner decision Q19).
            A reactivated person returns to `invited` without roles and without factors.
        clientUpdateMode:
          type: string
          enum: [public, server, managed]
          default: public
          description: Update mode for desktop clients (REQ-195); a device policy on the client always takes precedence
        minClientVersion:
          type: [string, 'null']
          description: Minimum desktop client version allowed to connect (REQ-195)
        recommendedClientVersion:
          type: [string, 'null']
          description: Desktop client version recommended to users (REQ-195)
        sessionRetentionDays:
          type: integer
          minimum: 0
          default: 30
          description: |
            Days an ended session record (principal, times, client IP, user agent, end
            reason) is kept before deletion (owner decision Q20). Tokens and token hashes
            are deleted immediately when a session ends.
        licenseKey:         { type: [string, 'null'] }
        sseEnabled:         { type: boolean }
        analytics: { $ref: '#/components/schemas/AnalyticsSettings' }

    # ── I18N ─────────────────────────────────────────────────────────────────
    I18nBundle:
      type: object
      description: "Flat key-value map: `{entity_type}.{slug_or_uuid}.{field}` → translated text"
      additionalProperties: { type: string }
      example:
        "metatype.ac.name": "Application Component"
        "property-def.abc123.label": "Version"
        "enum-value.def456.label": "Planned"

    StarterPackage:
      type: object
      required: [packageId, name, version, publisher, description, metatypeCount, propertyDefinitionCount, metatypeNames, imported]
      description: A metamodel package shipped with OEA (ADR-005)
      properties:
        packageId:               { type: string, example: oea-starter-togaf-classic }
        name:                    { type: string }
        version:                 { type: string }
        publisher:               { type: string }
        description:             { type: string }
        metatypeCount:           { type: integer }
        propertyDefinitionCount: { type: integer }
        metatypeNames:
          type: array
          items: { type: string }
        imported:                { type: boolean, description: "Imported into this instance (any version)" }

    # ── Import ────────────────────────────────────────────────────────────────
    ImportResult:
      type: object
      required: [status, created, updated, conflicts]
      properties:
        batchId:
          type: [string, 'null']
          format: uuid
          description: Shared by the audit events of a metamodel package import (US-033 AC1)
        conflictList:
          type: array
          description: Conflicting elements of a rejected metamodel package import (REQ-114)
          items:
            type: object
            required: [element, reason]
            properties:
              element: { type: string, description: "Type and name of the element, e.g. `metatype Application Component`" }
              reason:  { type: string, enum: [other-package, organization, built-in] }
        status:
          type: string
          enum: [completed, completed-with-conflicts, failed]
        created:   { type: integer }
        updated:   { type: integer }
        conflicts: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row:     { type: integer }
              message: { type: string }


# ═════════════════════════════════════════════════════════════════════════════
# PATHS
# ═════════════════════════════════════════════════════════════════════════════
paths:

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  OPERATIONS (REQ-075)                                                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝

  /health:
    get:
      operationId: getHealth
      summary: Liveness and readiness of the instance (REQ-075)
      description: |
        Public, because orchestrators and load balancers probe it without credentials.
        Returns only the aggregated status – no component details, versions or instance data.
      tags: [Operations]
      security: []
      x-oea-authorization: {"access": "public"}
      responses:
        '200':
          description: Instance is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '429':
          description: Too many requests (rate limit for public endpoints, REQ-186)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Instance is not ready (e.g. database unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  SETUP (UC-02, US-013, REQ-013 to REQ-017)                             ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the instance still needs its local bootstrapping (US-013)
      description: |
        Public, because no principal exists before the bootstrapping. Returns only whether
        setup is required – no token, account or instance data.
      tags: [Setup]
      security: []
      x-oea-authorization: {"access": "public"}
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /setup:
    post:
      operationId: completeSetup
      summary: Local bootstrapping – create the system admin account and the instance slug (US-013)
      description: |
        Public, but only effective with the one-time setup token, which the backend writes
        to a file inside its container and never returns or logs (REQ-017, REQ-175). Exactly
        one bootstrapping can succeed per instance (REQ-015); every attempt is audited as
        `system.bootstrapped` or `system.bootstrap-rejected` (REQ-016). The request body is
        never logged.
      tags: [Setup]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: System admin account created; the instance is bootstrapped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupResult' }
        '400':
          description: |
            Invalid input (problem type `urn:oea:problem:validation-failed`); `invalidFields`
            names the rejected fields. Only checked after a valid setup token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SetupValidationProblem' }
        '401':
          description: Setup token missing, wrong or expired (problem type `urn:oea:problem:invalid-setup-token`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The instance is already bootstrapped (problem type `urn:oea:problem:already-bootstrapped`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  IDENTITY (ADR-032 §9, REQ-176)                                        ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session server-side (REQ-164 AC1, ADR-037)
      description: |
        Revokes the current session and its refresh tokens; the response carries
        `OEA-Purge-Local-Data: session-ended` so that the Electron client clears its
        offline cache. For OIDC sessions the response includes the IdP end-session URL
        if the provider supports RP-initiated logout.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Session ended
          headers:
            OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  endSessionUrl:
                    type: [string, 'null']
                    format: uri
                    description: IdP RP-initiated logout URL (OIDC sessions only)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login:
    post:
      operationId: localLogin
      summary: Local login of the system admin account and of persons (US-013 AC2, US-011, ADR-042)
      description: |
        Login name and password. A `loginName` containing `@` is the e-mail address of a
        person; it is accepted only while the operator has switched on password login of
        persons (`oea.auth.person-password.enabled`), for persons in status `invited` or
        `active` with an unexpired password. The first login of an invited person makes it
        `active`. A person without an active second factor gets a session that is not
        second-factor-verified (SoD-8), with `requiredAction: enroll-second-factor` while the
        enforcement of a second factor is on and the person is not exempt (US-031); a person with one gets `401` with problem type
        `urn:oea:problem:second-factor-required`, a `loginTransaction` and `secondFactors`
        (`totp`, `passkey`), as below, and is activated only after the second step (REQ-010,
        us-022-passkeys). A temporary or expired password yields
        `requiredAction: change-password` (REQ-173 AC2), after the TOTP step if there is one
        (REQ-031 AC8).

        For the system admin account: during the setup phase (ADR-042) a correct password
        creates the session. Afterwards the response is `401` with problem type
        `urn:oea:problem:second-factor-required` and a `loginTransaction`, which
        `POST /auth/local/login/totp` completes with a TOTP code. Wrong login name and
        wrong password produce the same `401 urn:oea:problem:invalid-credentials`;
        repeated failures are throttled (REQ-168). Every failed login runs one password hash
        verification, so response times reveal no account (REQ-006). Protected by an origin
        check (REQ-187).
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalLoginRequest' }
      responses:
        '201':
          description: Session created; the cookie `__Host-OEA_SESSION` is set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: Invalid credentials, or a second factor is required (with `loginTransaction`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: Origin not allowed (problem type `urn:oea:problem:csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login/totp:
    post:
      operationId: localLoginTotp
      summary: Second step of the local login with a TOTP code (REQ-171, REQ-010)
      description: |
        Completes a login transaction of the system admin account or of a person with a TOTP
        code of any active TOTP credential of the owner (REQ-030). The session is
        second-factor-verified. Five wrong codes invalidate the transaction (REQ-168 AC2); a
        code is never accepted twice (REQ-170). Audited as `auth.login` with method
        `password-totp`.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalLoginTotpRequest' }
      responses:
        '201':
          description: Session created with a second factor; the cookie is set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: Wrong code, or the transaction is unknown, expired or invalidated (`invalid-credentials`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: Origin not allowed (`csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login/passkey/options:
    post:
      operationId: startLocalLoginPasskey
      summary: Passkey challenge for the second step of a local login (us-022-passkeys)
      description: |
        For a login transaction of a person whose `secondFactors` contain `passkey`: request
        options limited to the passkeys of that person, valid 5 minutes. An unknown, expired or
        invalidated transaction is answered with `401` (`invalid-credentials`).
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalLoginPasskeyOptionsRequest' }
      responses:
        '200':
          description: Request options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyChallenge' }
        '401':
          description: Unknown or invalid login transaction (`invalid-credentials`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: Origin not allowed (`csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login/passkey:
    post:
      operationId: localLoginPasskey
      summary: Second step of a local login with a passkey (us-022-passkeys)
      description: |
        Completes the login transaction of a person with one of the person's passkeys, with user
        verification. The session is second-factor-verified; audited as `auth.login` with method
        `password-passkey`. A failure counts like a wrong code: five invalidate the transaction.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalLoginPasskeyRequest' }
      responses:
        '201':
          description: Session created with a second factor; the cookie is set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: Verification failed, or the transaction is unknown, expired or invalidated (`invalid-credentials`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: Origin not allowed (`csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/passkey/options:
    post:
      operationId: startPasskeyLogin
      summary: Challenge for a passwordless login with a passkey (US-009, REQ-009)
      description: |
        Request options without `allowCredentials`, so that the browser offers the discoverable
        passkeys of the device; valid 5 minutes. `409` (problem type
        `urn:oea:problem:passkeys-unavailable`) if the instance has no relying party (no
        `oea.web.public-url` and no `oea.auth.passkey.*`).
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      responses:
        '200':
          description: Request options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyChallenge' }
        '403':
          description: Origin not allowed (`csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Passkeys unavailable (`passkeys-unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/passkey/login:
    post:
      operationId: passkeyLogin
      summary: Passwordless login with a passkey (US-009, REQ-009)
      description: |
        Verifies the assertion against the challenge, the relying party and the stored passkey,
        with user verification required. Only while password login of persons is possible, for
        persons in status `invited` or `active`; an invited person becomes `active`. The session
        is second-factor-verified (SoD-8, owner decision 2026-10-30); a temporary or expired
        password still yields `requiredAction: change-password`. Every failure – unknown
        passkey, wrong signature, missing user verification, signature counter going backwards,
        person not allowed – gives the same `401 urn:oea:problem:invalid-credentials`, is
        audited as `auth.login-failed` and counts for the throttling per source address
        (REQ-168 AC3). Audited as `auth.login` with method `passkey`.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginRequest' }
      responses:
        '201':
          description: Session created; the cookie `__Host-OEA_SESSION` is set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: Login failed (`invalid-credentials`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: Origin not allowed (`csrf-rejected`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Passkeys unavailable (`passkeys-unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/oidc/providers:
    get:
      operationId: listLoginProviders
      summary: Enabled OIDC providers offered on the login page (US-001)
      description: |
        Lists the enabled providers stored through the admin API, the only source of the
        OIDC login. Returns identifiers and names only, never client settings.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoginProvider' }

  /auth/oidc/{providerId}/start:
    get:
      operationId: startOidcLogin
      summary: Start the OIDC login through a provider (US-001, REQ-166)
      description: |
        Redirects the browser to the provider's authorization endpoint (authorization code
        flow with PKCE `S256`, `state` and `nonce`) and sets the login cookie
        `__Host-OEA_LOGIN` (`HttpOnly`, `Secure`, `Path=/`, `SameSite=Lax`, 10 minutes),
        which binds the running login to the browser. A provider that is unknown, disabled
        or unreachable redirects to `<public URL>/login?error=provider-unavailable`.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: returnTo
          in: query
          required: false
          description: Relative path inside the portal to open after the login (default `/`)
          schema: { type: string, pattern: '^/(?!/).*$', maxLength: 512 }
      responses:
        '302':
          description: Redirect to the provider, or to the login page if the provider is unavailable
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      summary: Callback of the OIDC login (US-001, REQ-004, REQ-166)
      description: |
        Redirect URI `<public URL>/api/v1/auth/oidc/callback`. Accepts the callback only
        with the `state` of a running login and the matching login cookie (single use),
        redeems the code with the PKCE verifier, validates the ID token, finds the person
        through the binding (`iss`, `sub`) and creates the session cookie
        `__Host-OEA_SESSION`. Every failure redirects to `<public URL>/login?error=login-failed`
        without revealing the reason; the reason is audited (REQ-005, REQ-006).
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        '302':
          description: Redirect to the portal (`returnTo` of the login) or to the login page with an error
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me:
    get:
      operationId: getCurrentPrincipal
      summary: Caller and effective permissions
      description: |
        Effective permissions with their sources, resolved server-side at request time.
        Privileged roles are listed with `effective: false` while the session lacks a
        second factor (SoD-8). For UI adaptation only; every operation is enforced
        server-side.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }



  /me/password:
    post:
      operationId: changeOwnPassword
      summary: Change the own local password (REQ-173 AC2, UC-03)
      description: |
        For persons with a local password and the system admin account. Requires the current
        password; the new one must differ from it and satisfy the password policy including
        its history (REQ-028), otherwise `422` with problem type
        `urn:oea:problem:password-policy-violation` whose `invalidFields` name every unmet rule
        (`minLength`, `maxLength`, `requireUppercase`, `requireLowercase`, `requireDigits`,
        `requireSpecialChars`, `historyCount`). Stores it as self-set
        without expiry, lifts `requiredAction: change-password` of the session and revokes
        every other session of the principal. A wrong current password → `403` with problem
        type `urn:oea:problem:invalid-credentials`, counted by the login throttling (REQ-168).
        Audited as `auth.password-changed`.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204':
          description: Password changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Wrong current password (`invalid-credentials`), or the principal has no local password
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/password/suggestion:
    post:
      operationId: suggestPassword
      summary: Suggest a password for the own change (US-026, REQ-027)
      description: |
        For principals with a local password. Generates a password with a cryptographically
        secure random source from the printable ASCII characters that satisfies the password
        policy; it is not stored. Allowed while the session must change its password. A
        policy that cannot be satisfied → `409` with problem type
        `urn:oea:problem:password-policy-unsatisfiable`.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Suggested password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The principal has no local password
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The policy cannot be satisfied (`password-policy-unsatisfiable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/second-factors:
    get:
      operationId: listOwnSecondFactors
      summary: Active second factors of the current principal (US-029 AC3, REQ-030 AC3)
      description: |
        Type, label and times of every active second factor of the principal, ordered by
        creation; never a secret. Empty for principals without local credentials.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Second factors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecondFactor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/second-factors/{credentialId}:
    delete:
      operationId: removeOwnSecondFactor
      summary: Remove an own second factor (owner decision 2026-10-30)
      description: |
        Requires an authentication within the last 5 minutes (REQ-172), otherwise `401`
        with problem type `urn:oea:problem:reauthentication-required`. Revokes the
        credential, ends every other session of the principal and is audited as
        `auth.factor-removed`. The last TOTP credential of the system admin account cannot
        be removed after the setup phase (`409`, problem type
        `urn:oea:problem:last-second-factor`, ADR-042); neither can the last second factor of a
        person who is not exempt while the enforcement of a second factor is on (REQ-020).
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Second factor removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Last TOTP credential of the system admin account (`last-second-factor`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/second-factors/passkey:
    post:
      operationId: startPasskeyRegistration
      summary: Start the registration of a passkey (US-022, REQ-023)
      description: |
        For persons with a local password; other principals get `403`. Requires an
        authentication within the last 5 minutes (REQ-172), otherwise `401` with problem type
        `urn:oea:problem:reauthentication-required`. Returns creation options for a
        discoverable credential with user verification and attestation `none`; the
        registration expires after 10 minutes. `409` (`passkeys-unavailable`) without a relying
        party.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRegistrationStart' }
      responses:
        '201':
          description: Registration started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Passkeys unavailable (`passkeys-unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/second-factors/passkey/{registrationId}/confirm:
    post:
      operationId: confirmPasskeyRegistration
      summary: Confirm a passkey registration with the response of the authenticator (US-022)
      description: |
        Verifies challenge, origin, relying party ID, user verification and signature; stores the
        passkey, marks the session as confirmed with a second factor and writes
        `auth.factor-added`. A failed verification (`400`, problem type
        `urn:oea:problem:invalid-passkey`) uses up the registration; an unknown, foreign or
        expired registration is answered with `404`. Both failures are audited as
        `auth.factor-enrollment-failed`.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      parameters:
        - name: registrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnJson' }
      responses:
        '200':
          description: Passkey active; the session is confirmed with it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactor' }
        '400':
          description: Verification failed (`invalid-passkey`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/second-factors/totp:
    post:
      operationId: startTotpEnrollment
      summary: Start the enrollment of a TOTP second factor (REQ-171, REQ-022, ADR-042)
      description: |
        For the system admin account and for persons with a local password; other
        principals get `403`. Requires an authentication within the last 5 minutes
        (REQ-172), otherwise `401` with problem type
        `urn:oea:problem:reauthentication-required`. Returns the secret once; the credential
        stays `pending` until confirmed (10 minutes). Several active TOTP credentials per
        owner are allowed (REQ-030); a blank label becomes `Authenticator app (YYYY-MM-DD)`.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpEnrollmentRequest' }
      responses:
        '201':
          description: Enrollment started
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/second-factors/totp/{credentialId}/confirm:
    post:
      operationId: confirmTotpEnrollment
      summary: Confirm a TOTP enrollment with a valid code
      description: |
        Activates the credential and marks the current session as confirmed with a
        second factor; an audit event `auth.factor-added` is written (REQ-172 AC3). A wrong
        code (`400`) keeps the enrollment pending; an unknown, foreign or expired enrollment
        is answered with `404`. Both failures are audited as
        `auth.factor-enrollment-failed` (REQ-025).
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpConfirmation' }
      responses:
        '200':
          description: Second factor active; the session is confirmed with it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactor' }
        '400':
          description: Invalid code (problem type `urn:oea:problem:invalid-totp-code`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /client-compatibility:
    get:
      operationId: getClientCompatibility
      summary: Client update mode and version compatibility (REQ-195, ADR-035 §10a)
      description: |
        Public, because the desktop client must check compatibility before login.
        Returns only version information and the update mode – no instance data.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      x-oea-status: planned
      responses:
        '200':
          description: Compatibility information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCompatibility' }
        '429':
          description: Too many requests (rate limit for public endpoints, REQ-186)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /oauth2/token:
    post:
      operationId: issueClientCredentialsToken
      summary: OAuth2 token endpoint for service accounts (client credentials, REQ-176)
      description: |
        Issues an access token (lifetime ≤ 900 s) carrying only the `client_id`.
        Client authentication via HTTP Basic (`clientSecretBasic`). Expired or wrong
        secrets → `401` and an audit event. Rate-limited.
      tags: [Identity]
      security:
        - clientSecretBasic: []
      x-oea-authorization: {"access": "public"}
      x-oea-status: planned
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Access token
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Invalid request or unsupported grant type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Client authentication failed (unknown client, wrong or expired secret, deactivated account)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  I18N                                                                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /i18n/{locale}:
    get:
      operationId: getI18nBundle
      summary: Dynamic labels for a locale (ADR-025)
      description: |
        ETag-cached (`MAX(updated_at)` over `i18n_entries`).
        `Cache-Control: max-age=300, stale-while-revalidate=3600`
      tags: [I18N]
      x-oea-authorization: {"access": "authenticated"}
      x-oea-status: planned
      parameters:
        - $ref: '#/components/parameters/LocaleParam'
      responses:
        '200':
          description: Labels
          headers:
            ETag:          { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/I18nBundle' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Locale not supported
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  CATALOGS (UC-06, US-046, REQ-043, SCR-020/028)                         ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /catalogs:
    get:
      operationId: listCatalogs
      summary: Catalog overview (US-046, SCR-020)
      description: |
        All catalogs with scope `instance` and the caller's own catalogs with scope
        `personal`, ordered by name (case-insensitive).
      tags: [Catalogs]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      responses:
        '200':
          description: Visible catalogs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createCatalog
      summary: Create a catalog (US-046, REQ-043)
      description: |
        Creates a catalog without columns, joins, saved filters and saved views. A catalog
        with scope `instance` additionally requires `catalog:manage` (ADR-032 §3); a
        catalog with scope `personal` is visible only to its creator. The name is unique
        within the instance across both scopes, compared case-insensitively after trimming,
        and stored trimmed. Writes the audit event `catalog.created`.
      tags: [Catalogs]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"], "conditions": [{"when": "body field scope is 'instance'", "permissions": ["catalog:manage"]}]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Catalog created
          headers:
            Location:
              schema: { type: string }
              description: URL of the catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            Invalid input (problem type `urn:oea:problem:validation-failed`, e.g. an unknown
            primary metatype) or a name that is already taken (problem type
            `urn:oea:problem:catalog-name-taken`, detail "A catalog with this name already
            exists"); `invalidFields` names the rejected fields. Nothing is stored.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CatalogValidationProblem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalogs/{id}:
    get:
      operationId: getCatalog
      summary: Read a catalog (US-046)
      description: |
        A personal catalog of another person is answered with 404, like a catalog that does
        not exist (ADR-032 §8 L3).
      tags: [Catalogs]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalogs/{id}/query:
    get:
      operationId: queryCatalog
      summary: Query a catalog (US-049, REQ-046, SCR-020)
      description: |
        One page of rows: the active entities of the catalog's primary metatype with the
        values of the catalog's columns. Until columns can be configured (US-047), the
        columns are `name` and, if the primary metatype maps a property named `Status` with
        visibility `public`, that property. Only properties with visibility `public` appear
        (REQ-160 follows). Soft-deleted entities are not returned (ADR-019).

        `sort` accepts exactly one `{column}:{asc|desc}` pair whose column is a key of
        `columns`. Without `sort` the rows are ordered by name ascending; rows without a
        value in the sort column come last. Sorting applies before paging; a page beyond
        the last one answers with no rows. A personal catalog of another person is answered
        with 404, like a catalog that does not exist (ADR-032 §8 L3).
      tags: [Catalogs]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: One page of catalog rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogQueryResult' }
        '400':
          description: |
            Invalid paging or sort parameters (problem type `urn:oea:problem:validation-failed`),
            e.g. an unknown sort column, several sort pairs or a page size above 200;
            `invalidFields` names the rejected parameters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CatalogQueryProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – EXPLORER (SCR-010/011)                                         ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /views/explorer:
