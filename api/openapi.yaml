  /admin/system-admin-account:
    get:
      operationId: getSystemAdminAccount
      summary: State of the local system admin account
      description: |
        The local account created by the bootstrapping (UC-02). It is reactivated only by the
        break-glass command `admin recover` inside the backend container.
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["auth-config:manage"]}
      responses:
        '200':
          description: Account state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemAdminAccountState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/system-admin-account/deactivate:
    post:
      operationId: deactivateSystemAdminAccount
      summary: Deactivate the local system admin account (US-019)
      description: |
        Revokes the account's sessions and ends its password login; IdP logins are not
        affected. Rejected with `409` and problem type `urn:oea:problem:last-admin-path` if no
        other usable path to `system-admin` remains (ADR-032 SoD-7): an active, approved, not
        deleted IdP group mapping to `system-admin` of an enabled provider that has matched at
        least once (`lastMatchedAt`). An already deactivated account is answered with `200`
        unchanged. Audited as `system-admin-account.deactivated` (outcome `success` or
        `denied`).
      tags: [Admin]
      x-oea-authorization: {"access": "permission", "permissions": ["auth-config:manage"]}
      responses:
        '200':
          description: Account deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemAdminAccountState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The account is the last usable path to `system-admin` (problem type `urn:oea:problem:last-admin-path`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

