            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        name:        { type: string }
                        description: { type: string }
                        sortOrder:   { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateContinuumConfig
      summary: Update continuum configuration (SCR-034)
