openapi: 3.1.0

info:
  title: OEA – Open Enterprise Architecture API
  version: 0.1.0-SNAPSHOT
  description: |
    REST API for OEA. Three layers:
    - **Resource API** (`/api/v1/...`): CRUD and automation (REQ-147)
    - **View API** (`/api/v1/views/...`): aggregated, screen-optimized endpoints (BFF pattern)
    - **Portal API** (`/api/v1/portal/...`): read-only endpoints of the web portal
      for curated, instance-scope content (permission `portal:read`)

    **Authorization** (ADR-032): every operation declares its required permissions
    in the vendor extension `x-oea-authorization`; permissions are never derived from
    role names, OAuth scopes or IdP claims. The extension has the fields:
    - `access`: `public` (no principal; only the allowlisted token endpoint),
      `authenticated` (any authenticated principal; object-level ownership checks apply)
      or `permission`
    - `permissions`: all listed permissions are required
    - `anyOfPermissions`: at least one of the listed permissions is required (used for
      reading configuration objects that a managing permission includes, ADR-032 §3)
    - `conditions`: additional permissions required only when the stated condition
      applies to the request (e.g. `deleted=true` requires `entity:restore`)

    The permission catalog is the top-level extension `x-oea-permissions`; the built-in
    roles and their permission sets are `x-oea-builtin-roles` (both fixed per release,
    also returned by `GET /admin/permissions` and `GET /admin/roles`). Operations
    without a declaration are denied for all principals (REQ-158).
    `scripts/check_openapi_authorization.py` checks the declarations.

    Responses: `401` = not authenticated; `403` = a required permission is missing or a
    separation-of-duties rule forbids the action (generic problem body); `404` is also
    returned for existence-sensitive objects the caller may not see (REQ-159).
    Property values the caller may not read are returned as `null` with `redacted: true`
    (REQ-160).

    There is no anonymous access (REQ-163). Clients authenticate with
    - `bearerAuth`: OEA access token of the Electron client
    - `cookieAuth`: session cookie of the web portal
    - `oauth2ClientCredentials`: access token of a service account obtained at
      `POST /oauth2/token` (REQ-176); token scopes are not used for OEA permissions

    **External integration** (ADR-026, optional): write access by external systems
    (scanners, CI/CD pipelines, import tools) via upsert endpoints and batch write,
    enabled by feature flag `oea.integration.enabled=true`. Service accounts and persons
    need the same permission `entity:write` for write operations.
    The request headers `X-Agent-Id` and `X-Agent-Run` are **informational only**
    (ADR-033 §7): `X-Agent-Id` is stored untrusted as `agentLabel` (max. 100 characters,
    control characters removed) and never used for attribution, filtering or
    authorization. `agentId` in the audit log is always the `client_id` of the
    authenticated service account (`null` for persons and the local system admin
    account). JWT claims such as `agent_id` are ignored.

    **Audit trail** (ADR-033): append-only. There is no operation that modifies or
    deletes audit records, for any permission; the only audit operations are reading,
    exporting (`GET /audit/events/export`, JSON Lines) and verifying
    (`GET /audit/integrity`), all requiring `audit:read`. Actors are pseudonymous
    (`actorType` + `actorRef`); names are resolved at read time only. Records are
    deleted solely by the retention purge (`/admin/audit/retention`, floor 365 days).

    **Raw analytics** (ADR-034): `POST /analytics/query` accepts SQL only, executed
    against the masked reporting schema (`GET /analytics/schema`), permission
    `analytics:query`, disabled by default (`analytics.enabled`). There is no
    `/graph/cypher` and no `/analytics/views/{name}` in v1.

    **Local data purge signal** (ADR-035 §8, REQ-164, REQ-181): when a session has
    ended or the principal has lost all access, responses carry the header
    `OEA-Purge-Local-Data`, and the event stream sends `session_ended` before it is
    closed. Clients delete their offline cache and stored tokens on either signal.

    Versioning: URL path (`/api/v1/`). Breaking changes → new major version.
    Error format: RFC 9457 Problem Details (`application/problem+json`).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1
    description: Current version

# Alternatives: exactly one of the schemes authenticates a request.
security:
  - bearerAuth: []
  - cookieAuth: []
  - oauth2ClientCredentials: []

# ═════════════════════════════════════════════════════════════════════════════
# AUTHORIZATION CATALOG (ADR-032 §3, §4) – single source for the contract check
# Kept as JSON (valid YAML flow style) so that tooling can read it without a
# YAML parser. Changing it requires a release and an update of ADR-032.
# ═════════════════════════════════════════════════════════════════════════════
x-oea-permissions: [
  {"id": "portal:read", "adminClass": false, "description": "Read shared (instance-scope) dashboards, catalogs and diagrams through the portal endpoints, including the projected entity data; own personal dashboards"},
  {"id": "entity:read", "adminClass": false, "description": "Read entities, connections, catalogs, diagrams, viewpoints, lineage, roadmap, search, entity history, metamodel and schema introspection"},
  {"id": "entity:write", "adminClass": false, "description": "Create and change entities and connections (UI, upsert, batch, import of content); excludes connections of scoping types"},
  {"id": "entity:delete", "adminClass": false, "description": "Soft-delete entities and connections (ADR-019)"},
  {"id": "entity:restore", "adminClass": false, "description": "See soft-deleted entities, restore entities and versions (UC-15, UC-16)"},
  {"id": "catalog:manage", "adminClass": false, "description": "Create and configure shared catalogs and shared saved filters"},
  {"id": "dashboard:manage", "adminClass": false, "description": "Create and configure shared dashboards"},
  {"id": "viewpoint:manage", "adminClass": false, "description": "Manage viewpoints and the navigation tree (UC-12, UC-13)"},
  {"id": "plateau:go-live", "adminClass": false, "description": "Put a plateau into production (UC-11)"},
  {"id": "webhook:manage", "adminClass": false, "description": "Register and manage webhooks"},
  {"id": "analytics:query", "adminClass": false, "description": "Submit raw SQL analytics queries against the masked reporting schema (REQ-179, ADR-034; Cypher deferred)"},
  {"id": "audit:read", "adminClass": false, "description": "Read, export (SIEM, JSON Lines) and verify the audit log, see resolved actor names and the audit retention, and read the access review"},
  {"id": "metamodel:write", "adminClass": true, "description": "Change the metamodel except visibility fields; metamodel and continuum package import/export"},
  {"id": "visibility:configure", "adminClass": true, "description": "Change visibilityMode, readRoles, writeRoles, scopingConnectionType and the override role list"},
  {"id": "visibility-scope:assign", "adminClass": true, "description": "Create, change and delete connections of types used as scopingConnectionType"},
  {"id": "role:assign", "adminClass": true, "description": "Define custom roles, assign and revoke roles, approve pending assignments, manage IdP group mappings"},
  {"id": "person:manage", "adminClass": true, "description": "Invite persons, change their lifecycle status, reset local credentials, set the account link to a Person entity"},
  {"id": "service-account:manage", "adminClass": true, "description": "Create and deactivate service accounts, issue and rotate client secrets"},
  {"id": "auth-config:manage", "adminClass": true, "description": "Configure authentication providers, 2FA policy, remote system admin mapping"},
  {"id": "settings:manage", "adminClass": true, "description": "Change instance settings"}
  ]

x-oea-builtin-roles: [
  {"id": "portal-reader", "assignableToServiceAccounts": false, "permissions": ["portal:read"]},
  {"id": "viewer", "assignableToServiceAccounts": true, "permissions": ["portal:read", "entity:read"]},
  {"id": "analyst", "assignableToServiceAccounts": false, "permissions": ["portal:read", "entity:read", "analytics:query"]},
  {"id": "enterprise-architect", "assignableToServiceAccounts": false, "permissions": ["portal:read", "entity:read", "entity:write", "entity:delete", "entity:restore", "catalog:manage", "dashboard:manage", "viewpoint:manage", "plateau:go-live", "webhook:manage"]},
  {"id": "integration-writer", "assignableToServiceAccounts": true, "permissions": ["entity:read", "entity:write"]},
  {"id": "auditor", "assignableToServiceAccounts": true, "permissions": ["audit:read"]},
  {"id": "metamodel-admin", "assignableToServiceAccounts": false, "permissions": ["metamodel:write"]},
  {"id": "security-admin", "assignableToServiceAccounts": false, "permissions": ["visibility:configure", "visibility-scope:assign", "role:assign", "person:manage"]},
  {"id": "system-admin", "assignableToServiceAccounts": false, "permissions": ["role:assign", "person:manage", "service-account:manage", "auth-config:manage", "settings:manage"]}
  ]

# ═════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OEA access token of the Electron client. Identifies principal and session only;
        permissions are resolved server-side per request (ADR-032 §7).
    cookieAuth:
      type: apiKey
      in: cookie
      name: OEA_SESSION
      description: |
        Session cookie of the web portal (`HttpOnly`, `Secure`, `SameSite=Strict`).
        State-changing requests additionally require the CSRF token header
        `X-XSRF-TOKEN`. The session identifies principal and session only.
    oauth2ClientCredentials:
      type: oauth2
      description: |
        Service accounts only (REQ-176). Access tokens carry only the `client_id`
        and live at most 15 minutes. Scopes are not used; permissions come from
        the roles assigned to the service account.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth2/token
          scopes: {}
    clientSecretBasic:
      type: http
      scheme: basic
      description: |
        Client authentication at the token endpoint only (`client_id:client_secret`,
        RFC 6749 §2.3.1).

  # ── Headers ─────────────────────────────────────────────────────────────────
  headers:
    PurgeLocalData:
      description: |
        Server signal to delete client-side data (ADR-035 §8, REQ-164, REQ-181 AC4).
        Present only when it applies; absent otherwise. On receipt the Electron client
        (main-process API proxy) deletes the offline cache and the stored tokens of
        the user for this server and returns to the login screen; the web portal
        discards in-memory data and reloads to the login page. Values:
        - `session-ended`: the session or refresh token presented is no longer valid
          because of logout, server-side revocation (lifecycle change, credential or
          password reset, role assignment revoked), refresh token reuse, idle timeout
          or absolute lifetime (REQ-164, REQ-165). Sent with `401`.
        - `access-revoked`: the session is valid, but the principal no longer holds any
          effective role (REQ-164 AC3, all roles lost). Sent with `403` and with every
          further response of that session.
        The value is never sent for a `401` caused by a request without credentials, so
        a client cannot be made to purge data by an unauthenticated response it did
        not provoke with its own session.
      schema:
        type: string
        enum: [session-ended, access-revoked]
    RetryAfter:
      description: Seconds after which the request may be retried (RFC 9110 §10.2.3)
      schema: { type: integer, minimum: 1 }

  # ── Responses ───────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request parameters or malformed body
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |
        Not authenticated (missing, expired or revoked credentials or session). When a
        previously valid session or refresh token was presented and has ended, the
        header `OEA-Purge-Local-Data: session-ended` is set and the problem `type` is
        `urn:oea:problem:session-ended`.
      headers:
        OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, but a permission declared in `x-oea-authorization` is missing,
        a separation-of-duties rule forbids the action (e.g. self-administration, SoD-1),
        or a privileged role is not effective because the session lacks a second factor
        (SoD-8). The problem body is generic and does not reveal the missing permission.
        If the principal holds no effective role at all, the header
        `OEA-Purge-Local-Data: access-revoked` is set.
      headers:
        OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate or concurrency limit exceeded (REQ-186)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Resource not found, or an existence-sensitive resource the caller may not see
        (same response for both cases, REQ-159)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        The request conflicts with the current state, e.g. it would remove the last
        administration path (SoD-7), the object is still referenced, or a pending
        request has already been decided
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Request body violates the metamodel or business rules
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # ── Parameters ──────────────────────────────────────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SortParam:
      name: sort
      in: query
      schema: { type: string, example: "name:asc" }
      description: "`{field}:{asc|desc}`, multiple comma-separated"
    LocaleParam:
      name: locale
      in: path
      required: true
      schema: { type: string, enum: [de, en, fr, it] }
    EntityIdParam:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Entity ID
    UuidIdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonIdParam:
      name: personId
      in: path
      required: true
      schema: { type: integer }
      description: "`persons.id` of a person or a service account"
    RoleIdParam:
      name: roleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RoleId' }
    AgentIdHeader:
      name: X-Agent-Id
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: |
        Informational label of the calling tool (ADR-026, ADR-033 §7). Stored untrusted
        as `agentLabel`; never used for attribution, filtering or authorization.
        Longer values are truncated to 100 characters; control characters are removed.
    AgentRunHeader:
      name: X-Agent-Run
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: Informational correlation ID of a run of the calling tool (stored as `agentRun`)

  # ── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ── Base types ────────────────────────────────────────────────────────────
    PageMeta:
      type: object
      required: [page, pageSize, totalElements, totalPages]
      properties:
        page:          { type: integer }
        pageSize:      { type: integer }
        totalElements: { type: integer }
        totalPages:    { type: integer }

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. Problem type URIs follow `urn:oea:problem:<kebab-case-name>`
        (ADR-037 §6); `about:blank` is used where no specific type is defined.
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string, format: uri }

    # ── Metatype ───────────────────────────────────────────────────────────────
    MetatypeSummary:
      type: object
      required: [id, name, abbreviation]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        abbreviation: { type: string, example: "AC" }

    MetatypeDetail:
      allOf:
        - $ref: '#/components/schemas/MetatypeSummary'
        - type: object
          properties:
            isConnection:       { type: boolean }
            architectureLayer:  { type: [string, 'null'] }
            sortOrder:          { type: integer }
            isBuiltin:          { type: boolean }
            propertyMappings:
              type: array
              items: { $ref: '#/components/schemas/MetatypePropertyMapping' }
            connectionConstraints:
              type: array
              items:
                type: object
                properties:
                  direction:       { type: string, enum: [source, target] }
                  allowedMetatype: { $ref: '#/components/schemas/MetatypeSummary' }

    MetatypeWrite:
      type: object
      required: [name, configId]
      properties:
        name:                 { type: string }
        abbreviation:         { type: string }
        isConnection:         { type: boolean, default: false }
        architectureLayerId:  { type: [string, 'null'] }
        sortOrder:            { type: integer, default: 0 }
        configId:             { type: string, format: uuid }

    # ── Property categories ───────────────────────────────────────────────────
    PropertyCategory:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: [string, 'null'] }
        sortOrder:   { type: integer }

    PropertyCategoryWrite:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }
        sortOrder:   { type: integer, default: 0 }

    # ── Property definitions ─────────────────────────────────────────────────
    PropertyEnumValue:
      type: object
      required: [id, value, sortOrder]
      properties:
        id:        { type: string, format: uuid }
        value:     { type: string }
        sortOrder: { type: integer }
        label:     { type: string, description: "Translated label (session locale)" }

    PropertyDefinitionDetail:
      type: object
      required: [id, name, dataType]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string }
        label:          { type: string, description: "Translated label (session locale)" }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
        category:       { oneOf: [ { $ref: '#/components/schemas/PropertyCategory' }, { type: 'null' } ] }
        refMetatype:    { oneOf: [ { $ref: '#/components/schemas/MetatypeSummary' }, { type: 'null' } ] }
        maxLength:      { type: [integer, 'null'] }
        minValue:       { type: [number, 'null'] }
        maxValue:       { type: [number, 'null'] }
        pattern:        { type: [string, 'null'] }
        enumValues:
          type: array
          items: { $ref: '#/components/schemas/PropertyEnumValue' }
        visibility:
          allOf:
            - $ref: '#/components/schemas/PropertyVisibility'
          readOnly: true
          description: |
            Visibility configuration (REQ-124). Read-only in the metamodel endpoints;
            changed only via `PUT /admin/property-visibility` with `visibility:configure`
            (SoD-2). Ignored in metamodel package imports.

    PropertyDefinitionWrite:
      type: object
      required: [name, dataType]
      properties:
        name:           { type: string }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
        categoryId:     { type: [string, 'null'], format: uuid }
        refMetatypeId:  { type: [string, 'null'], format: uuid }
        maxLength:      { type: [integer, 'null'] }
        minValue:       { type: [number, 'null'] }
        maxValue:       { type: [number, 'null'] }
        pattern:        { type: [string, 'null'] }

    # ── Metatype property mapping ───────────────────────────────────────────────
    MetatypePropertyMapping:
      type: object
      required: [id, propertyDefinition, necessity, validFrom, sortOrder]
      properties:
        id:                 { type: string, format: uuid }
        propertyDefinition: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        necessity:
          type: string
          enum: [mandatory, warning, optional]
        validFrom:          { type: string, format: date }
        sortOrder:          { type: integer }
        defaultValue:
          type: [object, 'null']
          description: Optional default value (typed)
          properties:
            valueText:  { type: string }
            valueInt:   { type: integer }
            valueBool:  { type: boolean }
            valueDate:  { type: string, format: date }
            valueEnum:  { type: string }

    MetatypePropertyMappingWrite:
      type: object
      required: [propertyDefId, necessity, validFrom]
      properties:
        propertyDefId: { type: string, format: uuid }
        necessity:
          type: string
          enum: [mandatory, warning, optional]
        validFrom:     { type: string, format: date }
        sortOrder:     { type: integer, default: 0 }
        defaultValue:
          type: [object, 'null']
          properties:
            valueText:  { type: string }
            valueInt:   { type: integer }
            valueBool:  { type: boolean }
            valueDate:  { type: string, format: date }
            valueEnum:  { type: string }

    # ── Entity ───────────────────────────────────────────────────────────────
    PropertyValue:
      type: object
      required: [propertyDefId, propertyName, dataType, redacted]
      description: |
        If the caller may not read the property (REQ-124 to REQ-127), all `value*`
        fields are `null` and `redacted` is `true` (REQ-160).
      properties:
        redacted:
          type: boolean
          default: false
          description: "`true` = value masked by property visibility; `false` = value shown (may be empty)"
        propertyDefId: { type: string, format: uuid }
        propertyName:  { type: string }
        label:         { type: string }
        dataType:
          type: string
          enum: [string, integer, boolean, enum, reference, date, url, text]
        valueText:  { type: [string, 'null'] }
        valueInt:   { type: [integer, 'null'] }
        valueBool:  { type: [boolean, 'null'] }
        valueDate:  { type: [string, 'null'], format: date }
        valueEnum:  { type: [string, 'null'] }
        valueRef:
          type: [object, 'null']
          properties:
            id:           { type: integer }
            name:         { type: string }
            metatypeAbbr: { type: string }

    RelationSummary:
      type: object
      required: [id, metatype, direction, relatedEntity]
      properties:
        id:        { type: integer }
        metatype:  { $ref: '#/components/schemas/MetatypeSummary' }
        direction:
          type: string
          enum: [outgoing, incoming]
        relatedEntity:
          type: object
          required: [id, name, metatype]
          properties:
            id:       { type: integer }
            name:     { type: string }
            metatype: { $ref: '#/components/schemas/MetatypeSummary' }

    EntityListItem:
      type: object
      required: [id, name, metatype, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        metatype:    { $ref: '#/components/schemas/MetatypeSummary' }
        isLogical:   { type: boolean }
        lifecycle:   { type: [string, 'null'] }
        deletedAt:   { type: [string, 'null'], format: date-time }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    EntityDetail:
      allOf:
        - $ref: '#/components/schemas/EntityListItem'
        - type: object
          properties:
            version:    { type: integer }
            properties:
              type: array
              items: { $ref: '#/components/schemas/PropertyValue' }
            relations:
              type: array
              items: { $ref: '#/components/schemas/RelationSummary' }
            parentEntity:
              type: [object, 'null']
              properties:
                id:   { type: integer }
                name: { type: string }

    CatalogFilterOptions:
      type: object
      properties:
        metatypes:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MetatypeSummary'
              - type: object
                properties:
                  count: { type: integer }
        lifecycleValues:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              count: { type: integer }

    # ── Explorer / navigation tree ────────────────────────────────────────────
    TreeNodeItem:
      type: object
      required: [id, itemType, referenceId, displayLabel, sortOrder]
      properties:
        id:           { type: string, format: uuid }
        itemType:
          type: string
          enum: [tree-node, entity, diagram, catalog]
        referenceId:  { type: string }
        displayLabel: { type: string }
        sortOrder:    { type: integer }
        metatype:     { oneOf: [ { $ref: '#/components/schemas/MetatypeSummary' }, { type: 'null' } ] }
        isDeleted:    { type: boolean, default: false }

    TreeNode:
      type: object
      required: [id, name, sortOrder, items, children]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        sortOrder: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/TreeNodeItem' }
        children:
          type: array
          items: { $ref: '#/components/schemas/TreeNode' }
          description: Recursive child nodes

    # ── Diagram ──────────────────────────────────────────────────────────────
    DiagramShape:
      type: object
      required: [id, entityId, entityName, metatype, x, y, width, height]
      properties:
        id:         { type: string, format: uuid }
        entityId:   { type: integer }
        entityName: { type: string }
        metatype:   { $ref: '#/components/schemas/MetatypeSummary' }
        x:          { type: number }
        y:          { type: number }
        width:      { type: number }
        height:     { type: number }
        styleOverrides:
          type: [object, 'null']
          additionalProperties: true

    DiagramView:
      type: object
      required: [id, name, viewpoint, shapes, connections]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        viewpoint:   { type: [string, 'null'] }
        description: { type: string }
        shapes:
          type: array
          items: { $ref: '#/components/schemas/DiagramShape' }
        connections:
          type: array
          description: Connection entities between shapes
          items:
            type: object
            required: [id, sourceShapeId, targetShapeId, metatype]
            properties:
              id:            { type: string, format: uuid }
              sourceShapeId: { type: string, format: uuid }
              targetShapeId: { type: string, format: uuid }
              metatype:      { $ref: '#/components/schemas/MetatypeSummary' }
        updatedAt:   { type: string, format: date-time }

    # ── Data Lineage ──────────────────────────────────────────────────────────
    LineageNode:
      type: object
      required: [id, name, nodeType, metatype]
      properties:
        id:       { type: integer }
        name:     { type: string }
        nodeType:
          type: string
          enum: [source, transform, target]
        metatype: { $ref: '#/components/schemas/MetatypeSummary' }
        metrics:
          type: [object, 'null']
          properties:
            recordsPerDay: { type: integer }
            latencyMs:     { type: integer }

    LineageView:
      type: object
      required: [id, name, nodes, edges]
      properties:
        id:    { type: string, format: uuid }
        name:  { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LineageNode' }
        edges:
          type: array
          items:
            type: object
            required: [sourceId, targetId]
            properties:
              sourceId: { type: integer }
              targetId: { type: integer }
              label:    { type: [string, 'null'] }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    WidgetConfig:
      type: object
      required: [id, widgetType, title, position]
      properties:
        id:         { type: string, format: uuid }
        widgetType:
          type: string
          enum: [kpi, bar-chart, donut-chart, table, diagram-embed]
        title:      { type: string }
        position:
          type: object
          properties:
            col:    { type: integer }
            row:    { type: integer }
            width:  { type: integer }
            height: { type: integer }
        queryConfig:
          type: [object, 'null']
          description: Endpoint and filter parameters for widget data
          additionalProperties: true

    DashboardConfig:
      type: object
      required: [id, name, widgets]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetConfig' }

    WidgetData:
      type: object
      required: [widgetId, widgetType]
      properties:
        widgetId:   { type: string, format: uuid }
        widgetType: { type: string }
        data:
          description: Type-specific data points
          oneOf:
            - type: object
              description: KPI
              properties:
                value:     { type: string }
                delta:     { type: string }
                trendType: { type: string, enum: [up, down, neutral] }
            - type: array
              description: Bar / donut chart
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: number }
            - type: array
              description: Table
              items:
                type: object
                additionalProperties: true

    DashboardData:
      type: object
      required: [dashboardId, widgets, generatedAt]
      properties:
        dashboardId:  { type: string, format: uuid }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetData' }
        generatedAt:  { type: string, format: date-time }

    # ── Plateau-Roadmap ───────────────────────────────────────────────────────
    RoadmapEntityCard:
      type: object
      required: [entityId, name, metatype, plateauId, lifecycleState]
      properties:
        entityId:      { type: integer }
        name:          { type: string }
        metatype:      { $ref: '#/components/schemas/MetatypeSummary' }
        plateauId:     { type: string, format: uuid }
        lifecycleState:
          type: string
          enum: [planned, active, retiring, retired]
        isDeprecated:  { type: boolean, default: false }
        successorId:   { type: [integer, 'null'] }

    PlateauBand:
      type: object
      required: [plateau, entities]
      properties:
        plateau:
          type: object
          required: [id, name, status, validFrom, validTo]
          properties:
            id:        { type: string, format: uuid }
            name:      { type: string }
            status:    { type: string, enum: [baseline, transition, target, realized] }
            validFrom: { type: [string, 'null'], format: date }
            validTo:   { type: [string, 'null'], format: date }
        entities:
          type: array
          items: { $ref: '#/components/schemas/RoadmapEntityCard' }

    RoadmapView:
      type: object
      required: [id, name, plateaus]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        plateaus:
          type: array
          items: { $ref: '#/components/schemas/PlateauBand' }

    # ── Entity history ───────────────────────────────────────────────────────
    FieldDiff:
      type: object
      required: [fieldName, isSystemField]
      properties:
        fieldName:    { type: string, description: "Property name or system field (name, lifecycle, …)" }
        label:        { type: string, description: "Translated label" }
        isSystemField: { type: boolean }
        oldValue:     { type: [string, 'null'], description: "`null` if redacted" }
        newValue:     { type: [string, 'null'], description: "`null` if redacted" }
        redacted:
          type: boolean
          default: false
          description: "`true` = old and new value masked by property visibility (REQ-160)"

    EntityVersionSummary:
      type: object
      required: [version, changedAt, changedBy, changes]
      properties:
        version:    { type: integer }
        changedAt:  { type: string, format: date-time }
        changedBy:
          type: object
          properties:
            id:   { type: integer }
            name: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/FieldDiff' }

    EntityHistoryResponse:
      type: object
      required: [entityId, entityName, versions, page]
      properties:
        entityId:   { type: integer }
        entityName: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/EntityVersionSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }

    RestoreRequest:
      type: object
      required: [targetVersion]
      properties:
        targetVersion:
          type: integer
          description: Version number to restore to
        reason:
          type: string
          description: Reason (recorded in the audit log)

    # ── External integration – write schemas (ADR-026) ─────────────────────────
    PropertyWriteValue:
      type: object
      required: [propertyDefId, value]
      description: |
        Flat write schema: `value` is always a string.
        The backend converts according to `property_definitions.data_type`.
      properties:
        propertyDefId: { type: string, format: uuid }
        value:
          type: string
          description: |
            Serialized as text regardless of data type:
            boolean → "true"/"false", integer → "42",
            date → "2026-06-29", reference → "<entityId>",
            enum → enum value string

    EntityWrite:
      type: object
      required: [name, metatypeId]
      properties:
        name:
          type: string
        metatypeId:
          type: string
          format: uuid
        externalId:
          type: string
          description: |
            Stable identifier from the source system (e.g. "git:org/repo/svc",
            "k8s:prod/order-service"). Namespace convention: `{system}:{id}`.
            Must be unique for the OEA instance.
        description:  { type: string }
        isLogical:    { type: boolean, default: true }
        lifecycle:    { type: [string, 'null'] }
        parentId:     { type: [integer, 'null'], description: "Parent entity" }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertyWriteValue' }

    ConnectionWrite:
      type: object
      required: [connectionMetatypeId]
      description: |
        Exactly one of the pairs (sourceId/targetId) or
        (sourceExternalId/targetExternalId) must be provided.
      properties:
        connectionMetatypeId: { type: string, format: uuid }
        sourceId:         { type: integer }
        targetId:         { type: integer }
        sourceExternalId: { type: string, description: "external_id of the source entity" }
        targetExternalId: { type: string, description: "external_id of the target entity" }
        externalId:       { type: string, description: "external_id of the connection itself" }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertyWriteValue' }

    BatchWriteRequest:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityWrite' }
          maxItems: 500
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionWrite' }
          maxItems: 500
        strategy:
          type: string
          enum: [upsert, create-only, skip-existing]
          default: upsert
          description: |
            `upsert`: create-or-update by externalId or id.
            `create-only`: error if the entity already exists.
            `skip-existing`: skip existing ones, only create new ones.
        atomic:
          type: boolean
          default: false
          description: |
            true → all or nothing (a single DB transaction).
            false → partial success possible; the response contains the status per item.

    BatchWriteItemResult:
      type: object
      required: [index, status]
      properties:
        index:      { type: integer, description: "0-based index in the request array" }
        itemType:   { type: string, enum: [entity, connection] }
        status:     { type: string, enum: [created, updated, skipped, error] }
        id:         { type: [integer, 'null'], description: "Internal ID after create/update" }
        externalId: { type: [string, 'null'] }
        error:      { type: [string, 'null'], description: "Error message for status=error" }

    BatchWriteResponse:
      type: object
      required: [strategy, atomic, summary, items]
      properties:
        strategy:  { type: string }
        atomic:    { type: boolean }
        summary:
          type: object
          properties:
            created:  { type: integer }
            updated:  { type: integer }
            skipped:  { type: integer }
            errors:   { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchWriteItemResult' }

    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:    { type: string, description: "Path to the faulty field (e.g. properties[2].value)" }
        message:  { type: string }
        code:     { type: string, example: "REQUIRED", description: "Machine-readable error code" }

    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid:  { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
        preview:
          type: [object, 'null']
          description: Only for dryRun=true; shows what would be persisted
          properties:
            wouldCreate: { type: integer }
            wouldUpdate: { type: integer }
            wouldSkip:   { type: integer }

    AllowedConnectionResult:
      type: object
      required: [allowed, options]
      properties:
        allowed: { type: boolean }
        options:
          type: array
          items:
            type: object
            required: [connectionMetatype, direction]
            properties:
              connectionMetatype: { $ref: '#/components/schemas/MetatypeSummary' }
              direction:
                type: string
                enum: [source-to-target, target-to-source, bidirectional]

    MetamodelPackage:
      type: object
      required: [formatVersion, exportedAt, metatypes, propertyCategories, propertyDefinitions]
      description: Portable metamodel package for import/export (ADR-026)
      properties:
        formatVersion:       { type: string, example: "1.0" }
        exportedAt:          { type: string, format: date-time }
        sourceInstanceId:    { type: [string, 'null'] }
        metatypes:
          type: array
          items: { $ref: '#/components/schemas/MetatypeDetail' }
        propertyCategories:
          type: array
          items: { $ref: '#/components/schemas/PropertyCategory' }
        propertyDefinitions:
          type: array
          items: { $ref: '#/components/schemas/PropertyDefinitionDetail' }
        viewpoints:
          type: array
          items: { $ref: '#/components/schemas/ViewpointConfig' }
        shapeAssignments:
          type: array
          items: { $ref: '#/components/schemas/ShapeAssignment' }
        i18nBundles:
          type: object
          description: "Locale → I18nBundle"
          additionalProperties: { $ref: '#/components/schemas/I18nBundle' }

    ShapeAssignment:
      type: object
      required: [viewpointKey, metatypeId, shapeKey]
      properties:
        viewpointKey:  { type: string, description: "Slug of the viewpoint in config.viewpoints[]" }
        metatypeId:    { type: string, format: uuid }
        shapeKey:      { type: string, description: "Icon/shape key in the design system" }
        fillColor:     { type: [string, 'null'] }
        borderColor:   { type: [string, 'null'] }
        iconKey:       { type: [string, 'null'] }

    # ── Service-Accounts (ADR-026) ────────────────────────────────────────────
    ServiceAccount:
      type: object
      required: [id, personId, name, status, createdAt]
      properties:
        id:          { type: string, format: uuid, description: "client_id; stable; = agent_id in the audit log" }
        personId:    { type: integer, description: "persons.id (person_type=service-account)" }
        name:        { type: string }
        description: { type: [string, 'null'] }
        roles:
          type: array
          description: Active authorization roles (IDs) of the service account
          items: { $ref: '#/components/schemas/RoleId' }
        status:      { type: string, enum: [active, inactive], description: "Lifecycle status of the service account (persons.status)" }
        createdAt:   { type: string, format: date-time }
        lastUsedAt:  { type: [string, 'null'], format: date-time }
        rotatedAt:   { type: [string, 'null'], format: date-time }

    ServiceAccountWrite:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }
        roles:
          type: array
          maxItems: 20
          uniqueItems: true
          description: |
            Authorization role IDs. Only roles flagged `assignableToServiceAccounts`
            (built-in: `viewer`, `integration-writer`, `auditor`) are accepted; roles with
            an admin-class permission are never assignable (SoD-4, REQ-176) → `422`.
            Setting or changing roles additionally requires `role:assign`.
          items: { $ref: '#/components/schemas/RoleId' }
          default: ["integration-writer"]

    ServiceAccountCreated:
      allOf:
        - $ref: '#/components/schemas/ServiceAccount'
        - type: object
          required: [clientSecret]
          properties:
            clientSecret:
              type: string
              description: |
                Plaintext secret, returned **only once**.
                Not retrievable after this response (only the hash is stored).
                Store securely — e.g. as a CI/CD secret.

    # ── Audit ─────────────────────────────────────────────────────────────────
    AuditActorType:
      type: string
      enum: [person, service-account, system-admin-account, system, unauthenticated]
      description: Kind of principal that caused the event (ADR-033 §3)

    AuditEventChange:
      type: object
      required: [propertyName, isSystemField, redacted]
      properties:
        propertyDefinitionId:
          type: [string, 'null']
          format: uuid
          description: Property definition (soft reference); visibility is evaluated on it, not on `propertyName`
        propertyName:  { type: string }
        isSystemField: { type: boolean }
        oldValue:      { type: [string, 'null'], description: "`null` if redacted" }
        newValue:      { type: [string, 'null'], description: "`null` if redacted" }
        redacted:
          type: boolean
          default: false
          description: |
            `true` = old and new value withheld. Values of properties that were restricted
            at the time of the event are stored encrypted and decrypted only for callers
            who may read the property under the current visibility configuration
            (ADR-033 §3, REQ-160 AC4).

    AuditEvent:
      type: object
      required: [id, chainSeq, recordHash, eventType, category, severity, outcome, actorType, source, occurredAt]
      description: |
        Audit record (ADR-033). Contains no names or e-mail addresses of OEA users;
        actors are pseudonymous references resolved at read time.
      properties:
        id:          { type: integer, format: int64 }
        chainSeq:    { type: integer, format: int64, description: Position in the audit hash chain }
        recordHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hash of this chain link (hex)
        eventType:
          type: string
          example: "entity.property-changed"
          description: Stable event type name from the event catalog (`docs/audit-event-catalog.md`, follow-up)
        category:
          type: string
          enum: [change, security, access, system]
        severity:
          type: string
          enum: [info, warning, high, critical]
        outcome:
          type: string
          enum: [success, failure, denied]
        occurredAt:  { type: string, format: date-time }
        actorType:   { $ref: '#/components/schemas/AuditActorType' }
        actorRef:
          type: [string, 'null']
          description: |
            Pseudonymous key of the actor: `persons.id` (decimal) for `person` and
            `service-account`, `system_admin_accounts.id` (UUID) for
            `system-admin-account`; `null` for `system` and `unauthenticated`.
        actorDisplayName:
          type: [string, 'null']
          description: |
            Name resolved at read time from the identity tables (caller holds `audit:read`).
            `null` for anonymized persons (REQ-189), `system` and `unauthenticated`.
            Never part of the export.
        agentId:
          type: [string, 'null']
          format: uuid
          description: "`client_id` of the authenticated service account; `null` for persons and the system admin account"
        agentLabel:
          type: [string, 'null']
          maxLength: 100
          description: Untrusted value of the `X-Agent-Id` request header; informational only
        agentRun:    { type: [string, 'null'], description: "Value of `X-Agent-Run`; informational only" }
        source:
          type: string
          enum: [UI, API, Job, Import]
        sourceIp:    { type: [string, 'null'], description: IPv4 or IPv6 address of the client }
        requestId:   { type: [string, 'null'] }
        targetType:
          type: [string, 'null']
          example: "entity"
          description: Kind of the affected object (entity, person, role, assignment, setting, service-account, …)
        targetId:    { type: [string, 'null'] }
        entityId:    { type: [integer, 'null'] }
        entityName:
          type: [string, 'null']
          description: Denormalized for completeness; `null` for entities of metatype `person`
        details:
          type: [object, 'null']
          additionalProperties: true
          description: Event-type-specific supplementary fields (e.g. role, validity, `sodConflict`)
        changes:
          type: array
          items: { $ref: '#/components/schemas/AuditEventChange' }

    AuditExportRecord:
      type: object
      description: |
        One line of the JSON Lines export (ADR-033 §9): exactly one link of the audit hash
        chain, with all chain fields, so that consumers can check continuity and recompute
        `recordHash` without OEA secrets. The ordered field list per table, the
        `tableTag` values and the canonical serialization are specified in
        `docs/audit-hash-chain.md` (follow-up). Actors are pseudonymous keys; restricted
        values are exported as ciphertext (base64) with `keyId`; no names, no e-mail
        addresses, no decrypted values.
      required: [chainSeq, hashVersion, prevHash, recordHash, table, fields]
      properties:
        chainSeq:    { type: integer, format: int64 }
        hashVersion: { type: integer, minimum: 1 }
        prevHash:    { type: string, pattern: '^[0-9a-f]{64}$' }
        recordHash:  { type: string, pattern: '^[0-9a-f]{64}$' }
        table:
          type: string
          enum: [events, event_changes, retention_settings]
        fields:
          type: object
          additionalProperties: true
          description: Column values of the link as hashed (`hash_version` field list)
        checkpointSignature:
          type: [string, 'null']
          description: Ed25519 signature (base64) for `audit.checkpoint` links, if a signing key is configured

    AuditCheckpoint:
      type: object
      required: [chainSeq, recordHash, createdAt]
      properties:
        chainSeq:   { type: integer, format: int64 }
        recordHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt:  { type: string, format: date-time }
        signature:  { type: [string, 'null'], description: Ed25519 signature (base64); `null` if unsigned }

    AuditIntegrityStatus:
      type: object
      required: [status, headSeq]
      description: Result of the latest chain verification (ADR-033 §5) and the latest checkpoint
      properties:
        status:
          type: string
          enum: [verified, violation, not-yet-verified]
        headSeq:          { type: integer, format: int64, description: Highest `chainSeq` in the database }
        verifiedAt:       { type: [string, 'null'], format: date-time }
        verifiedFromSeq:  { type: [integer, 'null'], format: int64, description: Start of the verified range (purge anchor or genesis) }
        verifiedToSeq:    { type: [integer, 'null'], format: int64 }
        firstBrokenLink:
          type: [object, 'null']
          description: Present only for `violation`
          required: [chainSeq, table]
          properties:
            chainSeq:     { type: integer, format: int64 }
            table:        { type: string, enum: [events, event_changes, retention_settings] }
            expectedHash: { type: [string, 'null'] }
            actualHash:   { type: [string, 'null'] }
            reason:       { type: string, enum: [hash-mismatch, sequence-gap, prev-hash-mismatch] }
        purgeAnchor:
          type: [object, 'null']
          description: Last link deleted by the retention purge; verification starts after it
          properties:
            chainSeq:   { type: integer, format: int64 }
            recordHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        latestCheckpoint:
          oneOf:
            - $ref: '#/components/schemas/AuditCheckpoint'
            - type: 'null'

    AuditRetentionValue:
      type: object
      required: [retentionDays, effectiveFrom, recordedAt]
      properties:
        retentionDays: { type: integer, minimum: 365 }
        effectiveFrom: { type: string, format: date-time }
        recordedAt:    { type: string, format: date-time }
        recordedByType: { $ref: '#/components/schemas/AuditActorType' }
        recordedByRef:  { type: [string, 'null'], description: Pseudonymous actor key as in `AuditEvent.actorRef` }

    AuditRetention:
      type: object
      required: [floorDays, inForce]
      description: |
        Audit retention (ADR-033 §4); stored as an append-only series. A reduction takes
        effect 30 days after it is recorded; an increase takes effect immediately and
        cancels a pending reduction (ADR-037 §6).
      properties:
        floorDays:
          type: integer
          const: 365
          description: Fixed floor, not configurable (owner decision Q10)
        inForce: { $ref: '#/components/schemas/AuditRetentionValue' }
        pending:
          description: A recorded reduction that is not yet effective (`effectiveFrom` = recording + 30 days)
          oneOf:
            - $ref: '#/components/schemas/AuditRetentionValue'
            - type: 'null'

    AuditRetentionWrite:
      type: object
      required: [retentionDays]
      properties:
        retentionDays:
          type: integer
          minimum: 365
          description: Days; values below 365 are rejected with `422`. Default of a new installation is 2555 (7 years).

    # ── Analytics (ADR-034) ─────────────────────────────────────────────────
    AnalyticsQueryRequest:
      type: object
      required: [language, query]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [sql]
          description: Only `sql` in v1; other values (e.g. `cypher`) are rejected with `400`
        query:
          type: string
          minLength: 1
          maxLength: 20000
          description: Exactly one `SELECT` statement over views of the schema `reporting`; longer text → `413`
        parameters:
          type: array
          maxItems: 50
          description: Values bound to `$1` … `$n`, in order
          items:
            type: [string, number, integer, boolean, 'null']
        maxRows:
          type: integer
          minimum: 1
          maximum: 100000
          description: Lowers the instance row limit for this request; higher values are capped
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Lowers the instance statement timeout for this request; higher values are capped

    AnalyticsColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: PostgreSQL type name of the result column, example: "text" }

    AnalyticsQueryResult:
      type: object
      required: [columns, rows, rowCount, truncated, durationMs, requestId]
      properties:
        columns:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsColumn' }
        rows:
          type: array
          description: Result rows; each row is an array in the order of `columns`. Restricted values are `null`.
          items:
            type: array
            items: {}
        rowCount:   { type: integer }
        truncated:  { type: boolean }
        truncatedReason:
          type: [string, 'null']
          enum: [rows, size, null]
        durationMs: { type: integer }
        requestId:  { type: string }

    AnalyticsProblem:
      description: Problem details of a rejected or failed analytics query (no internal object names, no raw database messages)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reasonCode:
              type: string
              enum: [V1, V2, V3, V4, V5, V6, V7, syntax-error, timeout, execution-error, too-many-columns]
              description: Validation rule (ADR-034 §4) or execution failure
            position:
              type: [integer, 'null']
              description: Character position in the query text, if applicable
            requestId: { type: string }

    AnalyticsSchema:
      type: object
      required: [views]
      description: Reporting schema introspection for the caller (same content as `reporting.columns`)
      properties:
        views:
          type: array
          items:
            type: object
            required: [name, generated, columns]
            properties:
              name:        { type: string, example: "entities" }
              description: { type: [string, 'null'] }
              generated:
                type: boolean
                description: "`true` for generated per-metatype views (`reporting.<metatype>`)"
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, readable]
                  properties:
                    name:     { type: string }
                    type:     { type: string }
                    readable:
                      type: boolean
                      description: "`false` = values of this column are always masked for the caller"

    AnalyticsSettings:
      type: object
      description: Instance settings `analytics.*` (ADR-034 §5, §7)
      properties:
        enabled:
          type: boolean
          default: false
          description: Raw analytics enabled; requires provisioned `oea_analytics` credentials
        statementTimeoutSeconds: { type: integer, minimum: 1, maximum: 120, default: 30 }
        maxRows:                 { type: integer, minimum: 1, maximum: 100000, default: 10000 }
        maxResultBytes:          { type: integer, minimum: 1, default: 10485760 }
        maxConcurrentPerPrincipal: { type: integer, minimum: 1, default: 2 }
        queriesPerMinute:        { type: integer, minimum: 1, default: 30 }
        poolSize:
          type: integer
          minimum: 1
          default: 4
          description: Size of the separate analytics connection pool; takes effect after restart

    # ── Admin – Viewpoints ────────────────────────────────────────────────────
    ViewpointConfig:
      type: object
      required: [id, name]
      properties:
        id:               { type: string }
        name:             { type: string }
        description:      { type: string }
        allowedMetatypes:
          type: array
          items: { $ref: '#/components/schemas/MetatypeSummary' }
        allowedRelations:
          type: array
          items: { $ref: '#/components/schemas/MetatypeSummary' }

    # ── Admin – Property visibility (REQ-124, REQ-128, REQ-161) ───────────────
    PropertyVisibility:
      type: object
      required: [visibilityMode, readRoles, writeRoles]
      description: |
        Visibility configuration of a property definition (REQ-124). Role lists contain
        authorization role IDs (ADR-032 §5); business roles of the EA model are never used.
        - `public`: readable for every principal that can read the object
        - `role-restricted`: readable only with a role in `readRoles`, writable only with
          a role in `writeRoles` (`writeRoles` ⊆ `readRoles`; `readRoles` not empty)
        - `connection-scoped`: readable/writable only with a path to the entity via
          `scopingConnectionType` from the caller's linked Person entity (REQ-127)
      properties:
        visibilityMode:
          type: string
          enum: [public, role-restricted, connection-scoped]
          default: public
        readRoles:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []
        writeRoles:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []
        scopingConnectionType:
          type: [string, 'null']
          format: uuid
          description: Connection metatype ID; mandatory for `connection-scoped`

    PropertyVisibilityEntry:
      description: Visibility configuration of one property definition (SCR-032)
      allOf:
        - type: object
          required: [propertyDefId]
          properties:
            propertyDefId: { type: string, format: uuid }
            propertyName:  { type: string, readOnly: true }
            label:         { type: string, readOnly: true, description: "Translated label (session locale)" }
        - $ref: '#/components/schemas/PropertyVisibility'

    PropertyVisibilityOverride:
      type: object
      required: [roles]
      description: |
        Roles whose holders read all properties of objects they can already read,
        regardless of `visibilityMode` (REQ-128). Empty by default (owner decision Q14).
        Every change is audited (`visibility.override-changed`); a change that adds a
        role the acting principal holds is flagged as self-benefiting (SoD-6).
      properties:
        roles:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
          default: []

    # ── Access control (ADR-032, UC-23) ───────────────────────────────────────
    PermissionId:
      type: string
      pattern: '^[a-z][a-z-]*:[a-z][a-z-]*$'
      maxLength: 64
      description: Identifier from the permission catalog `x-oea-permissions`
      example: "entity:write"

    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9-]{1,62}$'
      description: Stable identifier of an authorization role (built-in or custom); immutable
      example: "enterprise-architect"

    Permission:
      type: object
      required: [id, category, adminClass, description]
      properties:
        id:          { $ref: '#/components/schemas/PermissionId' }
        category:    { type: string, description: "Resource part of the identifier", example: "entity" }
        adminClass:  { type: boolean, description: "A role containing it is privileged (MFA, REQ-171) and never assignable to service accounts" }
        description: { type: string }

    RoleRef:
      type: object
      required: [id, name, privileged]
      properties:
        id:         { $ref: '#/components/schemas/RoleId' }
        name:       { type: string }
        privileged: { type: boolean }

    PrincipalRef:
      type: object
      required: [principalType, displayName]
      properties:
        principalType:
          type: string
          enum: [person, service-account, system-admin-account]
        id:
          type: [integer, 'null']
          description: "`persons.id`; `null` for the local system admin account"
        displayName: { type: string }

    AuthorizationRole:
      type: object
      required: [id, name, isBuiltin, privileged, assignableToServiceAccounts, overridesPropertyVisibility, permissions]
      description: |
        Authorization role (ADR-032 §4/§5). Not related to business roles of the EA model.
        The list of all roles with their permissions is the permission matrix (REQ-157 AC1).
      properties:
        id:          { $ref: '#/components/schemas/RoleId' }
        name:        { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        isBuiltin:
          type: boolean
          description: Built-in roles cannot be changed or deleted (SoD-5)
        privileged:
          type: boolean
          readOnly: true
          description: Derived; `true` if the role contains an admin-class permission
        assignableToServiceAccounts: { type: boolean }
        overridesPropertyVisibility:
          type: boolean
          readOnly: true
          description: Derived from the override role list (`/admin/property-visibility/override-roles`)
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionId' }
        usage:
          type: object
          readOnly: true
          description: References that prevent deletion
          properties:
            activeAssignments:            { type: integer }
            idpGroupMappings:             { type: integer }
            propertyVisibilityReferences: { type: integer }

    AuthorizationRoleWrite:
      type: object
      required: [name, permissions]
      description: |
        Custom role definition. Rejected with `422` if a permission is unknown, if
        `metamodel:write` is combined with `visibility:configure` or
        `visibility-scope:assign` (SoD-2), or if `assignableToServiceAccounts` is set
        for a role with an admin-class permission (SoD-4). Changing the permission set
        of a role the caller holds is rejected with `403` (SoD-1).
      properties:
        name:        { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        permissions:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionId' }
          description: Explicit list; an empty list grants no permissions (REQ-157 AC3)
        assignableToServiceAccounts: { type: boolean, default: false }

    AuthorizationRoleCreate:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/RoleId' }
        - $ref: '#/components/schemas/AuthorizationRoleWrite'

    RoleAssignment:
      type: object
      required: [id, personId, role, source, status, validFrom, grantedBy, grantedAt, sodConflict]
      description: |
        Local role assignment (ADR-032 §7). Never hard-deleted; revocation sets
        `revokedAt`/`revokedBy`.
      properties:
        id:          { type: string, format: uuid }
        personId:    { type: integer }
        role:        { $ref: '#/components/schemas/RoleRef' }
        source:      { type: string, enum: [local] }
        status:
          type: string
          enum: [scheduled, active, expired, revoked]
          description: "`scheduled` = `validFrom` in the future; assignments to `invited` persons become effective when the person is `active`"
        validFrom:   { type: string, format: date-time }
        validTo:     { type: [string, 'null'], format: date-time }
        reason:      { type: [string, 'null'] }
        grantedBy:   { $ref: '#/components/schemas/PrincipalRef' }
        grantedAt:   { type: string, format: date-time }
        approvedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          description: Second administrator if the assignment went through four-eyes approval
        revokedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        revokedAt:   { type: [string, 'null'], format: date-time }
        sodConflict:
          type: boolean
          description: The person's roles combine `metamodel:write` with visibility permissions (SoD-3)

    RoleAssignmentWrite:
      type: object
      required: [roleId]
      properties:
        roleId:    { $ref: '#/components/schemas/RoleId' }
        validFrom: { type: string, format: date-time, description: "Default: now" }
        validTo:   { type: [string, 'null'], format: date-time, description: "Optional end of a time-boxed assignment" }
        reason:    { type: [string, 'null'], maxLength: 500, example: "Ticket SEC-1234" }
        acknowledgeSodConflict:
          type: boolean
          default: false
          description: |
            Must be `true` if the assignment combines `metamodel:write` with visibility
            permissions for the person (SoD-3); otherwise the request is rejected with
            `409` so that the client can show the warning first.

    RoleAssignmentRevoke:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }

    ApprovalRequest:
      type: object
      required: [id, kind, status, requestedBy, requestedAt, sodConflict]
      description: |
        Privileged change awaiting four-eyes approval (setting `privilegedAssignmentApproval`,
        owner decisions Q15/Q18). Kinds: assignment of a privileged role to a person
        (`role-assignment`), IdP group mapping to a privileged role (`idp-group-mapping`),
        and adding an admin-class permission to a custom role (`role-permission`).
      properties:
        id:          { type: string, format: uuid }
        kind:        { type: string, enum: [role-assignment, idp-group-mapping, role-permission] }
        person:
          description: Assignee (kind `role-assignment` only)
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        role:        { $ref: '#/components/schemas/RoleRef' }
        idpGroupMappingId:
          type: [string, 'null']
          format: uuid
          description: Pending mapping (kind `idp-group-mapping` only)
        permission:
          type: [string, 'null']
          description: Admin-class permission to be added to `role` (kind `role-permission` only)
        status:      { type: string, enum: [pending, approved, rejected, expired] }
        validFrom:   { type: [string, 'null'], format: date-time }
        validTo:     { type: [string, 'null'], format: date-time }
        reason:      { type: [string, 'null'] }
        requestedBy: { $ref: '#/components/schemas/PrincipalRef' }
        requestedAt: { type: string, format: date-time }
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        decidedAt:      { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        assignmentId:
          type: [string, 'null']
          format: uuid
          description: Resulting assignment after approval (kind `role-assignment`)
        sodConflict: { type: boolean }

    ApprovalDecision:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }

    IdpGroupMapping:
      type: object
      required: [id, authProviderId, issuer, groupIdentifier, roleId, active, createdBy, createdAt]
      description: |
        Binds an immutable, provider-controlled group identifier of one issuer to an
        authorization role (ADR-032 §7, REQ-167). Group claims are re-evaluated at login
        and at every token refresh, at the latest every 15 minutes (owner decision Q16);
        a missing or truncated groups claim yields no IdP-derived roles.
      properties:
        id:              { type: string, format: uuid }
        authProviderId:  { type: string, format: uuid }
        issuer:          { type: string, readOnly: true, description: "Issuer of the provider; claims of other issuers are ignored" }
        groupIdentifier: { type: string, description: "Entra ID group object ID or app role ID, Authentik group UUID; never a display name" }
        roleId:          { $ref: '#/components/schemas/RoleId' }
        active:          { type: boolean }
        createdBy:       { $ref: '#/components/schemas/PrincipalRef' }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: [string, 'null'], format: date-time }

    IdpGroupMappingWrite:
      type: object
      required: [authProviderId, groupIdentifier, roleId]
      description: |
        Rejected with `422` if `groupIdentifier` does not match the identifier format of
        the provider (REQ-167) and with `403` if the group is contained in the caller's
        own current token (SoD-1).
      properties:
        authProviderId:  { type: string, format: uuid }
        groupIdentifier: { type: string, minLength: 1, maxLength: 256 }
        roleId:          { $ref: '#/components/schemas/RoleId' }
        active:          { type: boolean, default: true }

    PersonEntityLink:
      type: object
      required: [entityId]
      description: |
        Account link from a person to the Person entity of the EA model, used for
        connection-scoped visibility (REQ-127). `null` removes the link.
      properties:
        entityId: { type: [integer, 'null'] }

    PersonEntityLinkResult:
      type: object
      required: [personId, entityId]
      properties:
        personId:   { type: integer }
        entityId:   { type: [integer, 'null'] }
        entityName: { type: [string, 'null'] }
        linkedBy:   { $ref: '#/components/schemas/PrincipalRef' }
        linkedAt:   { type: string, format: date-time }

    RoleGrant:
      type: object
      required: [role, source]
      description: One role held by a principal and where it comes from
      properties:
        role:   { $ref: '#/components/schemas/RoleRef' }
        source:
          type: string
          enum: [local, idp, system-admin-account]
        assignmentId:    { type: [string, 'null'], format: uuid, description: "For `local`" }
        mappingId:       { type: [string, 'null'], format: uuid, description: "For `idp`" }
        groupIdentifier: { type: [string, 'null'], description: "For `idp`" }
        validFrom:       { type: [string, 'null'], format: date-time }
        validTo:         { type: [string, 'null'], format: date-time }
        grantedBy:
          oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        grantedAt:       { type: [string, 'null'], format: date-time }

    AccessReviewEntry:
      type: object
      required: [principal, roles, privileged, sodConflict]
      properties:
        principal: { $ref: '#/components/schemas/PrincipalRef' }
        status:
          type: [string, 'null']
          enum: [invited, active, inactive, offboarded, null]
          description: Lifecycle status of the person or service account
        lastLoginAt: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          description: Current local assignments, IdP-derived roles of the last login and the system admin account
          items: { $ref: '#/components/schemas/RoleGrant' }
        privileged:  { type: boolean }
        mfaEnrolled: { type: [boolean, 'null'] }
        sodConflict: { type: boolean }
        pendingRequests:     { type: integer, description: "Pending four-eyes requests for this principal" }
        secretExpiresAt:     { type: [string, 'null'], format: date-time, description: "Service accounts only" }

    AccessReview:
      type: object
      required: [generatedAt, items, page]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessReviewEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }

    EffectivePermission:
      type: object
      required: [permission, grantedBy]
      properties:
        permission: { $ref: '#/components/schemas/PermissionId' }
        grantedBy:
          type: array
          items:
            type: object
            required: [roleId, source]
            properties:
              roleId: { $ref: '#/components/schemas/RoleId' }
              source: { type: string, enum: [local, idp, system-admin-account] }

    Me:
      type: object
      required: [principal, mfaSatisfied, roles, permissions]
      description: |
        The caller and its effective permissions, resolved server-side at request time.
        Clients use it only to hide or disable UI elements (ADR-032 §9).
      properties:
        principal: { $ref: '#/components/schemas/PrincipalRef' }
        email:     { type: [string, 'null'] }
        mfaSatisfied:
          type: boolean
          description: The session was established with a second factor (SoD-8)
        roles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RoleGrant'
              - type: object
                required: [effective]
                properties:
                  effective: { type: boolean }
                  notEffectiveReason:
                    type: [string, 'null']
                    enum: [mfa-required, not-yet-valid, person-not-active, null]
        permissions:
          type: array
          description: Union of the permissions of all effective roles, with their sources
          items: { $ref: '#/components/schemas/EffectivePermission' }

    # ── Event stream payloads (`GET /events/stream`) ─────────────────────────
    SessionEndedEvent:
      type: object
      required: [type, reason, purgeLocalData]
      description: Last event of a stream before the server closes it (ADR-035 §8, REQ-164)
      properties:
        type:   { type: string, const: session_ended }
        reason:
          type: string
          enum: [logout, revoked, refresh-reuse, idle-timeout, lifetime-expired]
          description: "`revoked` covers lifecycle changes, credential or password resets and revoked role assignments"
        purgeLocalData: { type: boolean, const: true }

    AccessChangedEvent:
      type: object
      required: [type, purgeLocalData]
      description: Effective roles or permissions of the caller changed; re-read `GET /me` and re-synchronize
      properties:
        type: { type: string, const: access_changed }
        purgeLocalData:
          type: boolean
          description: "`true` if the caller holds no effective role any more"

    # ── OAuth2 token endpoint (REQ-176) ───────────────────────────────────────
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [client_credentials] }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type:   { type: string, enum: [Bearer] }
        expires_in:   { type: integer, maximum: 900 }

    OAuthError:
      type: object
      required: [error]
      description: RFC 6749 §5.2 error response
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type]
        error_description: { type: string }

    # ── Admin – TRM ───────────────────────────────────────────────────────────
    TRMEntry:
      type: object
      required: [id, name, category, status]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        category:    { type: string }
        status:
          type: string
          enum: [approved, tolerated, prohibited, under-evaluation]
        version:     { type: [string, 'null'] }
        validUntil:  { type: [string, 'null'], format: date }
        notes:       { type: [string, 'null'] }

    TRMEntryWrite:
      type: object
      required: [name, category, status]
      properties:
        name:       { type: string }
        category:   { type: string }
        status:
          type: string
          enum: [approved, tolerated, prohibited, under-evaluation]
        version:    { type: string }
        validUntil: { type: string, format: date }
        notes:      { type: string }

    # ── Admin – Conformance ────────────────────────────────────────────────────
    ConformanceViolation:
      type: object
      required: [entityId, entityName, ruleId, severity, message]
      properties:
        entityId:   { type: integer }
        entityName: { type: string }
        metatype:   { $ref: '#/components/schemas/MetatypeSummary' }
        ruleId:     { type: string }
        severity:
          type: string
          enum: [critical, high, medium, info]
        message:    { type: string }
        propertyName: { type: [string, 'null'] }

    ConformanceResult:
      type: object
      required: [checkedAt, totalEntities, violationCount, violations]
      properties:
        checkedAt:      { type: string, format: date-time }
        totalEntities:  { type: integer }
        violationCount: { type: integer }
        violations:
          type: array
          items: { $ref: '#/components/schemas/ConformanceViolation' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── Admin – Auth-Provider ─────────────────────────────────────────────────
    AuthProvider:
      type: object
      required: [id, name, type, enabled]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        type:
          type: string
          enum: [oidc, local]
        enabled:   { type: boolean }
        issuerUrl: { type: [string, 'null'] }
        clientId:  { type: [string, 'null'] }

    AuthProviderWrite:
      type: object
      required: [name, type]
      properties:
        name:         { type: string }
        type:
          type: string
          enum: [oidc, local]
        enabled:      { type: boolean, default: true }
        issuerUrl:    { type: string }
        clientId:     { type: string }
        clientSecret: { type: string, description: "Write-only; never returned in responses" }
        scopes:       { type: string, example: "openid profile email" }
        claimMappings:
          type: object
          additionalProperties: { type: string }

    AuthProviderTestResult:
      type: object
      required: [success, steps]
      properties:
        success: { type: boolean }
        steps:
          type: array
          items:
            type: object
            properties:
              step:    { type: string }
              status:  { type: string, enum: [ok, error, skipped] }
              message: { type: [string, 'null'] }

    # ── Admin – System settings ──────────────────────────────────────────
    ClientCompatibility:
      type: object
      required: [clientUpdateMode, minClientVersion, apiVersion]
      properties:
        clientUpdateMode: { type: string, enum: [public, server, managed] }
        minClientVersion: { type: string, description: "Semantic version; older clients refuse to connect" }
        recommendedClientVersion: { type: [string, 'null'], description: "Older clients show a non-blocking notice" }
        apiVersion: { type: string }
        updateFeedUrl:
          type: [string, 'null']
          format: uri
          description: Update metadata URL on this server (mode `server` only)

    SystemSettings:
      type: object
      description: |
        Generic instance settings. The audit retention is not part of them; it is changed
        only through `/admin/audit/retention` (ADR-033 §4).
      properties:
        instanceName:       { type: string }
        defaultLocale:      { type: string, enum: [de, en, fr, it] }
        sessionTimeoutMin:  { type: integer }
        maxUploadMb:        { type: integer }
        privilegedAssignmentApproval:
          type: boolean
          default: false
          description: |
            Four-eyes approval for privileged changes (owner decisions Q15, Q18): assignments
            of privileged roles, IdP group mappings to privileged roles, and adding an
            admin-class permission to a custom role. When `true`, such changes stay pending
            (`202` with an `ApprovalRequest`) until a second principal with `role:assign`, who
            is neither the requester nor the assignee, approves them.
        allowReactivationOfOffboarded:
          type: boolean
          default: false
          description: |
            Whether persons in status `offboarded` may be reactivated (owner decision Q19).
            A reactivated person returns to `invited` without roles and without factors.
        clientUpdateMode:
          type: string
          enum: [public, server, managed]
          default: public
          description: Update mode for desktop clients (REQ-195); a device policy on the client always takes precedence
        minClientVersion:
          type: [string, 'null']
          description: Minimum desktop client version allowed to connect (REQ-195)
        recommendedClientVersion:
          type: [string, 'null']
          description: Desktop client version recommended to users (REQ-195)
        sessionRetentionDays:
          type: integer
          minimum: 0
          default: 30
          description: |
            Days an ended session record (principal, times, client IP, user agent, end
            reason) is kept before deletion (owner decision Q20). Tokens and token hashes
            are deleted immediately when a session ends.
        licenseKey:         { type: [string, 'null'] }
        sseEnabled:         { type: boolean }
        analytics: { $ref: '#/components/schemas/AnalyticsSettings' }

    # ── I18N ─────────────────────────────────────────────────────────────────
    I18nBundle:
      type: object
      description: "Flat key-value map: `{entity_type}.{slug_or_uuid}.{field}` → translated text"
      additionalProperties: { type: string }
      example:
        "metatype.ac.name": "Application Component"
        "property-def.abc123.label": "Version"
        "enum-value.def456.label": "Planned"

    # ── Import ────────────────────────────────────────────────────────────────
    ImportResult:
      type: object
      required: [status, created, updated, conflicts]
      properties:
        status:
          type: string
          enum: [completed, completed-with-conflicts, failed]
        created:   { type: integer }
        updated:   { type: integer }
        conflicts: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row:     { type: integer }
              message: { type: string }


# ═════════════════════════════════════════════════════════════════════════════
# PATHS
# ═════════════════════════════════════════════════════════════════════════════
paths:

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  IDENTITY (ADR-032 §9, REQ-176)                                        ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session server-side (REQ-164 AC1, ADR-037)
      description: |
        Revokes the current session and its refresh tokens; the response carries
        `OEA-Purge-Local-Data: session-ended` so that the Electron client clears its
        offline cache. For OIDC sessions the response includes the IdP end-session URL
        if the provider supports RP-initiated logout.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Session ended
          headers:
            OEA-Purge-Local-Data: { $ref: '#/components/headers/PurgeLocalData' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  endSessionUrl:
                    type: [string, 'null']
                    format: uri
                    description: IdP RP-initiated logout URL (OIDC sessions only)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me:
    get:
      operationId: getCurrentPrincipal
      summary: Caller and effective permissions
      description: |
        Effective permissions with their sources, resolved server-side at request time.
        Privileged roles are listed with `effective: false` while the session lacks a
        second factor (SoD-8). For UI adaptation only; every operation is enforced
        server-side.
      tags: [Identity]
      x-oea-authorization: {"access": "authenticated"}
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /client-compatibility:
    get:
      operationId: getClientCompatibility
      summary: Client update mode and version compatibility (REQ-195, ADR-035 §10a)
      description: |
        Public, because the desktop client must check compatibility before login.
        Returns only version information and the update mode – no instance data.
      tags: [Identity]
      security: []
      x-oea-authorization: {"access": "public"}
      responses:
        '200':
          description: Compatibility information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCompatibility' }
        '429':
          description: Too many requests (rate limit for public endpoints, REQ-186)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /oauth2/token:
    post:
      operationId: issueClientCredentialsToken
      summary: OAuth2 token endpoint for service accounts (client credentials, REQ-176)
      description: |
        Issues an access token (lifetime ≤ 900 s) carrying only the `client_id`.
        Client authentication via HTTP Basic (`clientSecretBasic`). Expired or wrong
        secrets → `401` and an audit event. Rate-limited.
      tags: [Identity]
      security:
        - clientSecretBasic: []
      x-oea-authorization: {"access": "public"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Access token
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Invalid request or unsupported grant type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Client authentication failed (unknown client, wrong or expired secret, deactivated account)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  I18N                                                                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /i18n/{locale}:
    get:
      operationId: getI18nBundle
      summary: Dynamic labels for a locale (ADR-025)
      description: |
        ETag-cached (`MAX(updated_at)` over `i18n_entries`).
        `Cache-Control: max-age=300, stale-while-revalidate=3600`
      tags: [I18N]
      x-oea-authorization: {"access": "authenticated"}
      parameters:
        - $ref: '#/components/parameters/LocaleParam'
      responses:
        '200':
          description: Labels
          headers:
            ETag:          { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/I18nBundle' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Locale not supported
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – CATALOG (Walking Skeleton, UC-06, SCR-020/012)                 ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/catalog:
    get:
      operationId: getCatalogView
      summary: Catalog overview (SCR-020)
      description: |
        Paginated, filterable entity list. All `filter[*]` parameters
        are implicitly AND-combined (case-insensitive).
      tags: [Views – Catalog]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"], "conditions": [{"when": "query parameter deleted is 'true' or 'only'", "permissions": ["entity:restore"]}]}
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[metatypeId]
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: false
        - name: filter[lifecycle]
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
        - name: filter[isLogical]
          in: query
          schema: { type: boolean }
        - name: deleted
          in: query
          schema: { type: string, enum: ["false", "true", "only"], default: "false" }
          description: "`true`/`only` include soft-deleted entities and require `entity:restore` (ADR-019)"
      responses:
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                type: object
                required: [items, page, filterOptions]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntityListItem' }
                  page:          { $ref: '#/components/schemas/PageMeta' }
                  filterOptions: { $ref: '#/components/schemas/CatalogFilterOptions' }
        '400':
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /views/catalog/{id}:
    get:
      operationId: getCatalogEntityDetail
      summary: Entity detail (SCR-012)
      tags: [Views – Catalog]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
      responses:
        '200':
          description: Entity with properties and relations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Soft-deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – EXPLORER (SCR-010/011)                                         ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/explorer:
    get:
      operationId: getExplorerView
      summary: Navigation tree (SCR-010/011)
      description: Complete tree node graph for the left explorer panel.
      tags: [Views – Navigation]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      responses:
        '200':
          description: Tree structure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – DIAGRAMS (SCR-021/022)                                         ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/diagrams/{id}:
    get:
      operationId: getDiagramView
      summary: Diagram editor data (SCR-021/022)
      tags: [Views – Editoren]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Diagram with shapes and connections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – DATA LINEAGE (SCR-023)                                         ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/lineage/{id}:
    get:
      operationId: getLineageView
      summary: Data lineage graph (SCR-023)
      tags: [Views – Editoren]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Lineage nodes and edges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineageView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – DASHBOARD (SCR-024)                                            ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/dashboards/{id}:
    get:
      operationId: getDashboardConfig
      summary: Dashboard configuration (SCR-024)
      tags: [Views – Editoren]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Dashboard configuration with widget layouts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /views/dashboards/{id}/data:
    get:
      operationId: getDashboardData
      summary: Dashboard data (SCR-024)
      description: Current data points for all widgets of a dashboard.
      tags: [Views – Editoren]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  VIEW – ROADMAP (SCR-025)                                              ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /views/roadmap/{id}:
    get:
      operationId: getRoadmapView
      summary: Plateau-Roadmap (SCR-025)
      tags: [Views – Editoren]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Roadmap with plateaus and entity cards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadmapView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  ENTITY HISTORY & RESTORE (UC-14/15/16, SCR-026/027)                  ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /entities/{id}/history:
    get:
      operationId: getEntityHistory
      summary: Change history of an entity (SCR-026)
      description: |
        Returns all versions with delta-based changes.
        Source: `entity_version_headers` + `entity_system_field_history`
        + `entity_property_value_history` (ADR-022).
      tags: [Entities]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:read"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Entity not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /entities/{id}/restore:
    post:
      operationId: restoreEntity
      summary: Restore entity (SCR-027, UC-15/16)
      description: |
        Restores an entity to an earlier version.
        Soft-deleted entities can also be restored.
        Properties the caller may not write are not restored and are reported
        (REQ-162).
      tags: [Entities]
      x-oea-authorization: {"access": "permission", "permissions": ["entity:write", "entity:restore"]}
      parameters:
        - $ref: '#/components/parameters/EntityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Entity restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Entity or target version not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Optimistic lock conflict (version outdated)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ╔═════════════════════════════════════════════════════════════════════════╗
  # ║  METAMODEL (SCR-030)                                                   ║
  # ╚═════════════════════════════════════════════════════════════════════════╝
  /metamodel/metatypes:
    get:
      operationId: listMetatypes
      summary: List all metatypes
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - name: configId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Metatype list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetatypeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createMetatype
      summary: Create new metatype
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypeWrite' }
      responses:
        '201':
          description: Metatype created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Name/abbreviation already taken
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /metamodel/metatypes/{id}:
    get:
      operationId: getMetatype
      summary: Metatype detail
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Metatype
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: updateMetatype
      summary: Update metatype
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypeWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteMetatype
      summary: Delete metatype
      description: Only possible if no entities of this type exist.
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Metatype still has entities
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /metamodel/metatypes/{id}/property-mappings:
    get:
      operationId: listPropertyMappings
      summary: Property mappings of a metatype
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      responses:
        '200':
          description: Mappings (current state, latest valid_from per property)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetatypePropertyMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createPropertyMapping
      summary: Create property mapping (or effective-date change)
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      parameters:
        - $ref: '#/components/parameters/UuidIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetatypePropertyMappingWrite' }
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetatypePropertyMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /metamodel/property-categories:
    get:
      operationId: listPropertyCategories
      summary: List property categories
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "anyOfPermissions": ["entity:read", "metamodel:write"]}
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertyCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPropertyCategory
      summary: Create property category
      tags: [Metamodel]
      x-oea-authorization: {"access": "permission", "permissions": ["metamodel:write"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyCategoryWrite' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /metamodel/property-categories/{id}:
    put:
      operationId: updatePropertyCategory
