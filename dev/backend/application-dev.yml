# Development configuration of the backend (Spring profile "dev", ADR-036).
# Mounted by compose.dev.yaml; never part of the production artifact.
# Identity providers are stored through the admin API (scripts/dev_seed.py); in profile
# "dev" the startup guard accepts only loopback issuers (REQ-183 AC5).
oea:
  web:
    # Portal origin (Vite dev server, proxies /api); base of the OIDC redirect URI
    public-url: http://localhost:5173
  security:
    cors:
      allowed-origins: http://localhost:5173
