spring:
  application:
    name: oea-backend
  # No in-memory users: authentication is OEA's own (sessions, ADR-032); the default
  # configuration would also log a generated password (REQ-175)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  # The application never migrates; it only validates the schema history (ADR-037 §3).
  flyway:
    enabled: false

# Client address, scheme, host and port from the X-Forwarded-* headers, but only when the
# peer is a trusted proxy (Tomcat's RemoteIpValve; AA-01, design D1 of s11-review-hardening).
server:
  forward-headers-strategy: native

oea:
  web:
    # Trusted reverse proxies as a comma-separated CIDR list; blank keeps Tomcat's default
    # (loopback and the private networks; design D2 of s11-review-hardening).
    trusted-proxies: ${OEA_TRUSTED_PROXIES:}
  migration:
    url: ${spring.datasource.url:}
    owner:
      username: oea_owner
    reporting-owner:
      username: oea_reporting_owner
  # oea audit verify (ADR-033 §5): read-only auditor role
  audit-verify:
    url: ${spring.datasource.url:}
    username: oea_auditor

# Actuator endpoints are not exposed; the public health probe is GET /api/v1/health (REQ-075).
management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        exclude: "*"
    jmx:
      exposure:
        exclude: "*"
