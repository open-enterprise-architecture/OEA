schema: oea

context: |
  Language: English
  All artifacts (proposal, specs, design, tasks) and all code must be written in English.

  Project: OEA – Open Enterprise Architecture (open-source EA tool, AGPL-3.0).
  Binding working agreement: AGENTS.md in the repository root.

  Source of truth (do NOT duplicate in OpenSpec, only reference):
  - Use cases:        requirements/use-cases/UC-NN-*.md
  - Requirements:     requirements/req/REQ-NNN-*.md
  - User stories:     requirements/user-stories/US-NNN-*.md (incl. acceptance criteria)
  - Tests/features:   requirements/tests/
  - Business objects: business-objects/*.md + docs/data-model.puml
  - ADRs:             adrs/ADR-NNN-*.md
  - Sprint plan:      docs/sprint-plan.md, walking skeleton: docs/walking-skeleton.md
  - Screens:          docs/screens/SCREENS.md
  Several of these source documents are still written in German. Read them as
  source material; write all new OpenSpec artifacts in English regardless.
  OpenSpec specs describe the implemented system behavior per capability and
  grow change by change. Existing documents are source material, not a
  template for a bulk conversion.

  Tech stack (accepted ADRs):
  - Backend: Java 21, Spring Boot 4.1, Hibernate/Spring Data JPA (ADR-012, ADR-038)
  - Layers: api/app/core separation (ADR-028), single Maven module backend/ (ADR-027)
  - DB: PostgreSQL ≥ 15 only, JSONB allowed; tests with Testcontainers, no H2 (ADR-016, ADR-030)
  - Migrations: Flyway (ADR-015)
  - API: REST + OpenAPI 3.x, contract in api/openapi.yaml (ADR-013)
  - Frontend: Vue 3 + TypeScript (ADR-011), PrimeVue + WYSIWYG editor (ADR-014)
  - Client: Electron + web portal, dual-track GUI (ADR-008, ADR-009)
  - Auth: OIDC-based IdP integration (ADR-006)
  - Soft delete (ADR-019), audit in separate schema (ADR-024), i18n (ADR-025)
  - Tests: Cucumber/Gherkin on JUnit Platform (ADR-029)
  - UI prototyping: Storybook screen stories + mock API from api/openapi.yaml; screen images generated by CI (ADR-031)
  - Deployment: docker compose up (monorepo, ADR-027)

  Conventions:
  - Documentation, code identifiers and code comments in English
  - Commits: Conventional Commits; branches feature/<short>, docs/<short>, adr/<NNN-short>
  - Quality gate: python3 scripts/validate_links.py must pass

rules:
  proposal:
    - Every change MUST reference at least one user story or REQ in the Traceability section (relative links)
    - State sprint and milestone from docs/sprint-plan.md, if assigned
    - Change name in the format <us-id>-<short-name>, e.g. us-001-oidc-login
    - If the change deviates from an accepted ADR, a new ADR is required first – do not decide it in the proposal
  specs:
    - Capability paths by business domain, e.g. identity/login, metamodel/entity-types, catalog/query
    - Derive scenarios from the acceptance criteria of the referenced user stories, do not invent new ones
    - Every requirement names the related US/REQ IDs in a 'Trace:' line
  design:
    - Link affected ADRs; make decisions within the ADR framework
    - Name data model impacts (docs/data-model.puml, business-objects/)
    - Describe API changes as a delta to api/openapi.yaml
  tasks:
    - Tests are written as part of the change, never ahead of it – each task group contains its own tests
    - Cucumber scenarios (ADR-029) belong in the respective task group, not in a collective group at the end
    - Flyway migrations as separate tasks with version number
    - UI changes include the screen story in frontend/src/screens/ (ADR-031) and the SCREENS.md update in the same task group
    - Last group 'Wrap-up' contains doc sync (US status, SCREENS.md, data-model.puml), regenerating requirements/traceability.md via scripts/generate_traceability.py, and link validation

operations:
  archive:
    guidance:
      - Before archiving, set the status of the referenced user stories to realized and record the implementation hash (AGENTS.md)
      - Regenerate requirements/traceability.md (python3 scripts/generate_traceability.py)
