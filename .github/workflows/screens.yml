name: Screens – Storybook and screen images

# ADR-031 §3/§4: renders the first story of every screen story file (frontend/src/screens/) in
# light and dark mode to docs/screens/SCR-NNN-{light,dark}.png and commits changed images to the
# branch of the pull request, so that they are reviewed and merged with the change. A direct push
# to main is refused by the repository rules (pull request and required checks).
# REQ-192 AC2: the job that installs and runs third-party packages holds a read-only token; the
# commit job only consumes the rendered images and touches nothing but docs/screens/SCR-*.png.
# The commit job pushes with a token of the GitHub App "OEA license bot" (as dependabot-licenses.yml),
# because a push with the workflow token starts no pull_request run and the required checks would
# never report on the new commit. Client ID and private key are Actions and Dependabot secrets
# (LICENSE_BOT_CLIENT_ID, LICENSE_BOT_PRIVATE_KEY, see docs/development.md).
# Storybook is published to GitHub Pages under /storybook/ by pages.yml (ADR-045 rule 7).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'api/openapi.yaml'
      - '.github/workflows/screens.yml'

# Least privilege (REQ-192): read-only token unless a job widens it
permissions:
  contents: read

concurrency:
  group: screens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Build Storybook and render screen images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Storybook build
        run: npm run build-storybook
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Render screen images
        run: npm run render:screens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-images
          path: docs/screens/SCR-*.png
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit changed screen images
    needs: render
    # Branches of forks cannot be pushed to and get no secrets; their images stay as committed
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screen-images
          path: rendered
      - name: Copy only screen images
        run: |
          shopt -s nullglob dotglob
          for file in rendered/*; do
            name=$(basename "$file")
            if [[ ! "$name" =~ ^SCR-[0-9]{3}-(light|dark)\.png$ ]]; then
              echo "::error::unexpected file in the artifact: $name"
              exit 1
            fi
            cp "$file" "docs/screens/$name"
          done
          rm -rf rendered
      - name: Check for changed images
        id: changes
        run: |
          git add docs/screens/SCR-*.png
          if git diff --cached --quiet; then
            echo "Screen images unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git status --porcelain | grep -v -E '^[AM]  docs/screens/SCR-[0-9]{3}-(light|dark)\.png$'; then
            echo "::error::only docs/screens/SCR-*.png may change"
            exit 1
          fi
          # Guard against a loop if rendering is not reproducible
          if [[ "$(git log -1 --format=%s)" == "chore(screens): regenerate screenshots" ]]; then
            echo "::warning::images differ from the commit of this workflow; rendering is not reproducible, nothing committed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Token of the license bot (contents write, this repository only)
        if: steps.changes.outputs.changed == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LICENSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push (starts the pull_request checks for the new commit)
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore(screens): regenerate screenshots"
          remote="https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"
          if ! git push "$remote" "HEAD:refs/heads/${BRANCH}"; then
            current=$(git ls-remote "$remote" "refs/heads/${BRANCH}" | cut -f1)
            if [[ "$current" != "$HEAD_SHA" ]]; then
              echo "::notice::${BRANCH} moved on to ${current}; the run for that commit renders the images"
              exit 0
            fi
            exit 1
          fi
