name: CI – Requirements Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Link validation ───────────────────────────────────────────────────
  validate-links:
    name: Link validation (concept/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check relative links
        run: python3 scripts/validate_links.py

  # ── 1b. Agent configuration sync (OpenCode ↔ Claude Code) ───────────────
  agent-config-sync:
    name: Agent configuration in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check single source of truth
        run: python3 scripts/sync_agent_config.py --check

  # ── 2. Requirements completeness ──────────────────────────────────────
  requirements-quality:
    name: Requirements completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Artifact count
        run: |
          echo "SH:  $(ls business-analysis/stakeholders/SH-*.md 2>/dev/null | wc -l)"
          echo "UC:  $(ls requirements/use-cases/UC-*.md          2>/dev/null | wc -l)"
          echo "REQ: $(ls requirements/req/REQ-*.md               2>/dev/null | wc -l)"
          echo "US:  $(ls requirements/user-stories/US-*.md       2>/dev/null | wc -l)"
          echo "ADR: $(ls adrs/ADR-*.md                           2>/dev/null | wc -l)"

      - name: Check use case completeness
        run: |
          failed=0
          for f in requirements/use-cases/UC-*.md; do
            grep -q "^primary_actor:" "$f"  || { echo "MISSING primary_actor: $f"; failed=1; }
            grep -q "Acceptance Criteria" "$f" || { echo "MISSING Acceptance Criteria: $f"; failed=1; }
            grep -qiE "concept|§" "$f" || { echo "MISSING concept reference: $f"; failed=1; }
          done
          exit $failed

      - name: Check REQ completeness
        run: |
          failed=0
          for f in requirements/req/REQ-*.md; do
            grep -q "^type:"   "$f" || { echo "MISSING type: $f";   failed=1; }
            grep -q "^status:" "$f" || { echo "MISSING status: $f"; failed=1; }
            grep -q "UC-"      "$f" || { echo "MISSING UC-Ref: $f"; failed=1; }
          done
          exit $failed

      - name: Check US completeness and reference integrity
        run: |
          failed=0
          for f in requirements/user-stories/US-*.md; do
            grep -q "UC-"  "$f" || { echo "MISSING UC-Ref: $f";  failed=1; }
            grep -q "REQ-" "$f" || { echo "MISSING REQ-Ref: $f"; failed=1; }
            # Orphaned REQ references
            for req in $(grep -o "REQ-[0-9]*" "$f"); do
              num=${req#REQ-}
              ls requirements/req/REQ-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN REQ-Ref: $f → $req"; failed=1; }
            done
            # Orphaned UC references
            for uc in $(grep -o "UC-[0-9]*" "$f"); do
              num=${uc#UC-}
              ls requirements/use-cases/UC-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN UC-Ref: $f → $uc"; failed=1; }
            done
          done
          exit $failed

      - name: Check ADR completeness
        run: |
          failed=0
          for f in adrs/ADR-*.md; do
            grep -q "Deciders" "$f" || { echo "MISSING Deciders: $f"; failed=1; }
          done
          exit $failed

      - name: Check that referenced ADRs exist
        run: |
          failed=0
          for f in requirements/req/REQ-*.md requirements/user-stories/US-*.md; do
            for adr in $(grep -o "ADR-[0-9]*" "$f" 2>/dev/null); do
              num=${adr#ADR-}
              ls adrs/ADR-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN ADR-Ref: $f → $adr"; failed=1; }
            done
          done
          exit $failed

  # ── 3. OpenAPI syntax ─────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest
      - name: Validate OpenAPI
        run: redocly lint api/openapi.yaml --format=github-actions

  # ── 4. Markdown lint (informational until baseline is cleaned up) ─────────────────────
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    # continue-on-error until existing files are cleaned up
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            requirements/**/*.md
            adrs/*.md
            business-analysis/**/*.md
            docs/*.md
          config: .markdownlint.json

