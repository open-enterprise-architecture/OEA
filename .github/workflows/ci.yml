name: CI – Requirements Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (REQ-192): read-only token for all jobs
permissions:
  contents: read

jobs:
  # ── 1. Link validation ───────────────────────────────────────────────────
  validate-links:
    name: Link validation (concept/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check relative links
        run: python3 scripts/validate_links.py

  # ── 1b. Agent configuration sync (OpenCode ↔ Claude Code) ───────────────
  agent-config-sync:
    name: Agent configuration in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check single source of truth
        run: python3 scripts/sync_agent_config.py --check

  # ── 2. Requirements completeness ──────────────────────────────────────
  requirements-quality:
    name: Requirements completeness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Traceability matrix up to date
        run: python3 scripts/generate_traceability.py --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: OpenSpec specs valid (strict)
        # same CLI version as the generated command and skill files (scripts/sync_agent_config.py)
        run: |
          version=$(grep -ohE 'generatedBy: *"[0-9]+\.[0-9]+\.[0-9]+"' .opencode/skills/openspec-*/SKILL.md | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$version" || { echo "::error::OpenSpec version not found in .opencode/skills"; exit 1; }
          npx -y "@fission-ai/openspec@${version}" validate --specs --strict --no-interactive

      - name: Screen inventory consistent
        run: python3 scripts/check_screens.py
      - name: User manual coverage (ADR-045, REQ-196)
        run: python3 scripts/check_manual.py

      - name: Artifact count
        run: |
          echo "SH:  $(ls business-analysis/stakeholders/SH-*.md 2>/dev/null | wc -l)"
          echo "UC:  $(ls requirements/use-cases/UC-*.md          2>/dev/null | wc -l)"
          echo "REQ: $(ls requirements/req/REQ-*.md               2>/dev/null | wc -l)"
          echo "US:  $(ls requirements/user-stories/US-*.md       2>/dev/null | wc -l)"
          echo "ADR: $(ls adrs/ADR-*.md                           2>/dev/null | wc -l)"

      - name: Check use case completeness
        run: |
          failed=0
          for f in requirements/use-cases/UC-*.md; do
            grep -q "^primary_actor:" "$f"  || { echo "MISSING primary_actor: $f"; failed=1; }
            grep -q "Acceptance Criteria" "$f" || { echo "MISSING Acceptance Criteria: $f"; failed=1; }
            grep -qiE "concept|§" "$f" || { echo "MISSING concept reference: $f"; failed=1; }
          done
          exit $failed

      - name: Check REQ completeness
        run: |
          failed=0
          for f in requirements/req/REQ-*.md; do
            grep -q "^type:"   "$f" || { echo "MISSING type: $f";   failed=1; }
            grep -q "^status:" "$f" || { echo "MISSING status: $f"; failed=1; }
            grep -q "UC-"      "$f" || { echo "MISSING UC-Ref: $f"; failed=1; }
          done
          exit $failed

      - name: Check US completeness and reference integrity
        run: |
          failed=0
          for f in requirements/user-stories/US-*.md; do
            grep -q "UC-"  "$f" || { echo "MISSING UC-Ref: $f";  failed=1; }
            grep -q "REQ-" "$f" || { echo "MISSING REQ-Ref: $f"; failed=1; }
            # Orphaned REQ references
            for req in $(grep -o "REQ-[0-9]*" "$f"); do
              num=${req#REQ-}
              ls requirements/req/REQ-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN REQ-Ref: $f → $req"; failed=1; }
            done
            # Orphaned UC references
            for uc in $(grep -o "UC-[0-9]*" "$f"); do
              num=${uc#UC-}
              ls requirements/use-cases/UC-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN UC-Ref: $f → $uc"; failed=1; }
            done
          done
          exit $failed

      - name: Check ADR completeness
        run: |
          failed=0
          for f in adrs/ADR-*.md; do
            grep -q "Deciders" "$f" || { echo "MISSING Deciders: $f"; failed=1; }
          done
          exit $failed

      - name: Check that referenced ADRs exist
        run: |
          failed=0
          for f in requirements/req/REQ-*.md requirements/user-stories/US-*.md; do
            for adr in $(grep -o "ADR-[0-9]*" "$f" 2>/dev/null); do
              num=${adr#ADR-}
              ls adrs/ADR-${num}-*.md >/dev/null 2>&1 \
                || { echo "BROKEN ADR-Ref: $f → $adr"; failed=1; }
            done
          done
          exit $failed

  # ── 3. OpenAPI syntax ─────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@2.63.0
      - name: Validate OpenAPI
        run: redocly lint api/openapi.yaml --format=github-actions
      - name: Check authorization declared on every operation (ADR-032)
        run: python3 scripts/check_openapi_authorization.py
      - name: Test the authorization check
        run: python3 scripts/test_check_openapi_authorization.py

  # ── 4. Markdown lint (informational until baseline is cleaned up) ─────────────────────
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !.claude/**
            !.opencode/**
            !**/node_modules/**
          config: .markdownlint.json

  # ── 5. Backend build and tests (ws-01-project-setup) ───────────────────────
  # Two parallel jobs (design D4 of s2b-backend-hardening): surefire and Cucumber each start one
  # shared PostgreSQL server per JVM; a hung test must not run for 6 hours
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (unit, Testcontainers, ArchUnit, Enforcer)
        working-directory: backend
        run: ./mvnw -B -ntp verify -DskipITs 2>&1 | tee ../backend-build.log; exit "${PIPESTATUS[0]}"
      - name: Testcontainers start times (ADR-036 follow-up)
        if: always()
        run: |
          {
            echo "### Testcontainers start times"
            grep -oE "Container [^ ]+ started in PT[0-9.]+S" backend-build.log | sed 's/@sha256:[0-9a-f]*//' | sort | uniq -c || true
          } >> "$GITHUB_STEP_SUMMARY"

  backend-cucumber:
    name: Backend Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cucumber scenarios (ADR-029)
        working-directory: backend
        run: ./mvnw -B -ntp verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee ../backend-cucumber.log; exit "${PIPESTATUS[0]}"
      - name: Testcontainers start times (ADR-036 follow-up)
        if: always()
        run: |
          {
            echo "### Testcontainers start times"
            grep -oE "Container [^ ]+ started in PT[0-9.]+S" backend-cucumber.log | sed 's/@sha256:[0-9a-f]*//' | sort | uniq -c || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 6. Security checks (ADR-036 §7) ──────────────────────────────────────────
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compose files (secrets, profiles, loopback ports)
        run: python3 scripts/check_compose_secrets.py
      - name: Known development secrets complete
        run: python3 scripts/check_dev_secrets.py
      - name: Package the backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t oea-backend:local .
      - name: Inspect the production artifact
        run: python3 scripts/check_production_artifact.py --jar backend/target/oea-backend-*.jar --image oea-backend:local
      - name: Operator Compose starts with explicit secrets (health within 60 s)
        run: scripts/compose_smoke_test.sh

  # ── 7. Frontend build (ADR-011, ADR-031, ADR-040) ───────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check (API types generated from api/openapi.yaml)
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the story tests
        run: npx playwright install --with-deps chromium
      - name: Story tests (rendering, play functions, accessibility; ADR-031)
        run: npm run test:stories
      - name: Build
        run: npm run build
      - name: Storybook build
        run: npm run build-storybook

  # ── User manual (ADR-045, REQ-196; change s2c-manual-site D7) ─────────────────
  # Generates the API reference from api/openapi.yaml (fails on a mismatch with the implemented
  # operations) and builds the site (fails on dead links); the coverage check runs in
  # "Requirements completeness"
  manual:
    name: User manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: manual/package-lock.json
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Tests of the API reference generator
        run: npm test
      - name: Build (API reference and site)
        run: npm run build

  # ── Third-party licenses (ADR-043) ──────────────────────────────────────────
  third-party-licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: License report of the backend runtime libraries
        working-directory: backend
        run: ./mvnw -B -ntp license:add-third-party
      - name: Frontend build (manifest of the bundled packages)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Allowed licenses and THIRD-PARTY-LICENSES.md up to date
        run: python3 scripts/generate_third_party_licenses.py --check
