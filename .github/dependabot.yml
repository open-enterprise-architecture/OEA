# Keeps the SHA-pinned GitHub Actions, Maven and npm dependencies and digest-pinned
# container images up to date (REQ-191, REQ-192).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      nuxt-ui:
        patterns: ["@nuxt/ui", "tailwindcss", "@iconify-json/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]

  # User manual (ADR-045, change s2c-manual-site D7); VitePress is pinned exactly while 2.0 is in alpha
  - package-ecosystem: npm
    directory: /manual
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      vitepress:
        patterns: ["vitepress", "vue"]
